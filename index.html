 ["In welcher Klimazone liegt Deutschland?",["Tropen","Subtropen","Gemäßigte Zone","Polare Zone"],2,"Gemäßigte Zone mit Laub- und Mischwald."],

 {id:"g-regen", t:"Tropischer Regenwald", ex:`

 {id:"g-tekt", t:"Risikoräume: Vulkane & Erdbeben", ex:`
<h4>Aufbau der Erde</h4><p>Erdkruste → Erdmantel → äußerer und innerer Erdkern. Die Kruste ist in <b>Platten</b> zerbrochen, die auf dem zähflüssigen Mantel wandern (wenige cm pro Jahr) – <b>Plattentektonik</b>.</p>
<ul><li><b>Divergenz:</b> Platten bewegen sich auseinander (Mittelatlantischer Rücken, Island)</li><li><b>Konvergenz/Subduktion:</b> eine Platte taucht unter die andere → Vulkane, Gebirge, Tiefseegräben</li><li><b>Transform:</b> Platten gleiten aneinander vorbei (San-Andreas-Graben)</li></ul>
<p><b>Erdbeben:</b> plötzliche Entladung von Spannungen; Ort im Erdinneren = <b>Hypozentrum</b>, darüber an der Oberfläche = <b>Epizentrum</b>; Stärke: Magnitude (Richterskala). <b>Tsunami</b> = Flutwelle nach Seebeben.</p>
<p><b>Vulkane:</b> Magma steigt auf, an der Oberfläche heißt es <b>Lava</b>. Pazifischer Feuerring. Leben trotz Risiko: fruchtbare Böden, Tourismus, Erdwärme.</p>
<div class="tip">💡 Schutz: Frühwarnsysteme, erdbebensicheres Bauen, Evakuierungspläne.</div>`,
 q:[["Wie heißt geschmolzenes Gestein an der Erdoberfläche?",["Magma","Lava","Basalt","Asche"],1,"Im Erdinneren Magma, an der Oberfläche Lava."],
 ["Der Punkt an der Oberfläche direkt über dem Erdbebenherd heißt …",["Hypozentrum","Epizentrum","Krater","Magmakammer"],1,"Epizentrum."],
 ["Eine Platte taucht unter eine andere. Das ist …",["Divergenz","Subduktion","Transform","Erosion"],1,"Subduktion."],
 ["Warum leben Menschen trotz Gefahr an Vulkanen?",["kühles Klima","fruchtbare Böden","keine Erdbeben","viel Schnee"],1,"Vulkanasche macht Böden fruchtbar."],
 ["Eine Flutwelle nach einem Seebeben heißt …","=tsunami","Tsunami."],
 ["Wie heißt die Theorie über wandernde Erdplatten?","=plattentektonik","Plattentektonik (Alfred Wegener: Kontinentaldrift)."]]},
 {id:"g-wetter", t:"Risikoräume: Wirbelstürme, Dürre & Hochwasser", ex:`
<h4>Tropische Wirbelstürme</h4><p>Entstehen über warmem Meer (mind. 26–27 °C). Namen: <b>Hurrikan</b> (Atlantik/Karibik), <b>Taifun</b> (Westpazifik), <b>Zyklon</b> (Indischer Ozean). In der Mitte das ruhige <b>Auge</b>. Über Land schwächen sie sich ab, weil der Nachschub an warmem, feuchtem Wasser fehlt.</p>
<h4>Dürre & Desertifikation</h4><p>Lange Trockenheit; in der <b>Sahelzone</b> verstärkt durch Überweidung und Abholzung → Ausbreitung wüstenhafter Gebiete (<b>Desertifikation</b>).</p>
<h4>Hochwasser</h4><p>Starkregen, Schneeschmelze, versiegelte Flächen und begradigte Flüsse verstärken Hochwasser (z. B. Oderflut 1997 in Brandenburg). Schutz: Deiche, Polder, Auen renaturieren.</p>
<div class="tip">💡 Der Klimawandel macht Extremwetter häufiger und stärker.</div>`,
 q:[["Wie heißt ein tropischer Wirbelsturm in der Karibik?",["Taifun","Hurrikan","Zyklon","Tornado"],1,"Atlantik/Karibik → Hurrikan."],
 ["Was brauchen Wirbelstürme zur Entstehung?",["kaltes Meer","warmes Meer über 26 °C","Gebirge","Wüste"],1,"Warmes Meerwasser liefert die Energie."],
 ["Die ruhige Mitte eines Wirbelsturms heißt …","=auge","Das Auge."],
 ["Ausbreitung wüstenhafter Gebiete nennt man …",["Desertifikation","Erosion","Urbanisierung","Subduktion"],0,"Desertifikation, z. B. im Sahel."],
 ["Was verstärkt Hochwasser?",["Auenwälder","versiegelte Flächen","Polder","Deiche"],1,"Wasser kann nicht versickern."],
 ["Welcher Fluss in Brandenburg hatte 1997 ein großes Hochwasser?",["Elbe","Oder","Spree","Havel"],1,"Oderflut 1997."]]},
 {id:"g-arm", t:"Armut & Reichtum", ex:`
<p>Länder werden oft eingeteilt in <b>Industrieländer</b>, <b>Schwellenländer</b> (z. B. Brasilien, Indien) und <b>Entwicklungsländer</b> (Länder des Globalen Südens).</p>
<h4>Indikatoren</h4><ul><li><b>BIP pro Kopf</b> (Wirtschaftsleistung pro Einwohner)</li>
<li><b>HDI</b> (Human Development Index): Lebenserwartung + Bildung + Einkommen</li><li>Kindersterblichkeit, Zugang zu Wasser, Alphabetisierung</li></ul>
<h4>Ursachen von Armut</h4><p>Koloniale Vergangenheit, Kriege, Korruption, Abhängigkeit vom Export von Rohstoffen, Klimaextreme, Verschuldung.</p>
<h4>Lösungsansätze</h4><p>Bildung, Fairer Handel, Entwicklungszusammenarbeit, Mikrokredite, <b>17 Nachhaltigkeitsziele (SDGs)</b> der UN bis 2030.</p>`,

 ["Was misst das BIP pro Kopf?",["Wirtschaftsleistung pro Einwohner","Zahl der Ärzte","Lebenserwartung","Einwohner pro km²"],0,"Bruttoinlandsprodukt geteilt durch Einwohner."],

 {id:"g-bev", t:"Bevölkerung & Migration", ex:`
<ul><li><b>Bevölkerungswachstum</b> = Geburtenrate − Sterberate (+ Zuwanderung − Abwanderung). Weltbevölkerung: über 8 Milliarden.</li>
<li><b>Bevölkerungsdiagramme:</b> <i>Pyramide</i> (viele Kinder, wachsend – z. B. Niger), <i>Glocke</i> (stabil), <i>Urne</i> (wenig Kinder, schrumpfend/alternd – z. B. Deutschland)</li></ul>
<h4>Migration</h4><ul><li><b>Push-Faktoren</b> (drücken weg): Krieg, Armut, Arbeitslosigkeit, Dürre</li>
<li><b>Pull-Faktoren</b> (ziehen an): Arbeit, Sicherheit, Bildung, Familie</li>
<li>Binnenmigration (im Land), internationale Migration, Flucht</li><li><b>Landflucht</b> → Verstädterung, Megastädte, Slums</li></ul>`,

 {id:"g-glob", t:"Globalisierung", ex:`
<p><b>Globalisierung</b> = die weltweite Verflechtung von Wirtschaft, Politik, Kultur und Kommunikation.</p>
<h4>Ursachen</h4><ul><li>günstiger Transport (Containerschiffe)</li><li>Internet & Kommunikation</li><li>Abbau von Zöllen, Freihandel</li></ul>
<h4>Beispiel: Die Reise einer Jeans</h4><p>Baumwolle aus Indien → gesponnen in China → gefärbt in Bangladesch → genäht in Tunesien → verkauft in Deutschland. Sie legt oft über 50 000 km zurück.</p>
<h4>Chancen & Risiken</h4><p>+ günstige Waren, Austausch, Arbeitsplätze in Schwellenländern<br>− Ausbeutung, Umweltschäden, Abhängigkeiten, Arbeitsplatzverlust in Industrieländern</p>
<div class="tip">💡 „Global Player“ = große internationale Konzerne, die weltweit produzieren und verkaufen.</div>`,

 {id:"b-zelle", t:"Zelle & Mikroskop", ex:`
<p>Alle Lebewesen bestehen aus <b>Zellen</b>.</p>
<table class="tb"><tr><th>Tier- & Pflanzenzelle</th><th>nur Pflanzenzelle</th></tr>
<tr><td>Zellmembran, Zellkern (Steuerzentrale, Erbinfo), Zellplasma, Mitochondrien (Energie)</td><td><b>Zellwand</b> (Stabilität), <b>Vakuole</b> (Zellsaft), <b>Chloroplasten</b> (Fotosynthese)</td></tr></table>
<h4>Mikroskop</h4><p>Okular, Objektiv, Objekttisch, Blende, Lichtquelle, Grob- und Feintrieb.<br><b>Gesamtvergrößerung = Okular · Objektiv</b> (10× · 40× = 400×)</p>
<div class="tip">💡 Immer mit der kleinsten Vergrößerung beginnen! Einzeller (z. B. Pantoffeltierchen) bestehen aus nur einer Zelle.</div>`,

 {id:"b-foto", t:"Fotosynthese & Zellatmung", ex:`
<p>Pflanzen stellen mit <b>Lichtenergie</b> ihre Nahrung selbst her (sie sind <b>Produzenten</b>).</p>
<div class="ex"><b>Fotosynthese</b> (in den Chloroplasten):<br>Kohlenstoffdioxid + Wasser → (Licht, Chlorophyll) → Traubenzucker + Sauerstoff<br>6 CO₂ + 6 H₂O → C₆H₁₂O₆ + 6 O₂</div>
<ul><li>CO₂ kommt über die <b>Spaltöffnungen</b> der Blätter, Wasser über die Wurzeln</li><li>Traubenzucker wird zu Stärke umgebaut und gespeichert</li></ul>
<div class="ex"><b>Zellatmung</b> (in den Mitochondrien, bei Pflanzen UND Tieren):<br>Traubenzucker + Sauerstoff → Kohlenstoffdioxid + Wasser + <b>Energie</b></div>
<div class="tip">💡 Die Zellatmung ist die Umkehrung der Fotosynthese.</div>`,
 q:[["Welche Ausgangsstoffe braucht die Fotosynthese?",["Sauerstoff und Zucker","Kohlenstoffdioxid und Wasser","Stickstoff und Wasser","Stärke und Licht"],1,"CO₂ + H₂O."],
 ["Welches Gas entsteht bei der Fotosynthese?",["Kohlenstoffdioxid","Sauerstoff","Stickstoff","Methan"],1,"Sauerstoff wird abgegeben."],
 ["Wo findet die Zellatmung statt?",["Chloroplasten","Mitochondrien","Zellwand","Vakuole"],1,"Die „Kraftwerke“ der Zelle."],
 ["Wie gelangt CO₂ in das Blatt?",["über die Wurzeln","über die Spaltöffnungen","über die Blüte","über den Stängel"],1,"Spaltöffnungen an der Blattunterseite."],
 ["Was liefert die Energie für die Fotosynthese?",["Wärme","Licht","Wasser","Erde"],1,"Lichtenergie wird vom Chlorophyll aufgenommen."]]},
 {id:"b-wald", t:"Ökosystem Wald", ex:`
<p><b>Ökosystem</b> = <b>Biotop</b> (Lebensraum) + <b>Biozönose</b> (Lebensgemeinschaft).</p>
<ul><li><b>Abiotische Faktoren:</b> Licht, Temperatur, Wasser, Boden, Wind</li><li><b>Biotische Faktoren:</b> Einflüsse durch Lebewesen (Fressfeinde, Konkurrenz)</li></ul>
<h4>Stockwerke des Waldes</h4><p>Moosschicht – Krautschicht – Strauchschicht – Baumschicht (+ Wurzelschicht)</p>
<h4>Nahrungsbeziehungen</h4><div class="ex">Eiche (Produzent) → Raupe (Konsument 1. Ordnung) → Meise (2. Ordnung) → Habicht (3. Ordnung)</div>
<p><b>Destruenten</b> (Bakterien, Pilze, Regenwürmer) zersetzen tote Stoffe zu Mineralstoffen → Stoffkreislauf. Viele Nahrungsketten bilden ein <b>Nahrungsnetz</b>.</p>`,
 q:[["Ökosystem = Biotop + …",["Biologie","Biozönose","Biomasse","Biosphäre"],1,"Biozönose = Lebensgemeinschaft."],

 ["Wer zersetzt tote Pflanzen und Tiere?",["Produzenten","Konsumenten","Destruenten","Räuber"],2,"Pilze, Bakterien, Regenwürmer."],

 {id:"b-see", t:"Ökosystem See", ex:`
<h4>Zonen eines Sees</h4><p>Vom Ufer zur Mitte: Erlen-/Bruchwaldzone → <b>Röhrichtzone</b> (Schilf) → <b>Schwimmblattzone</b> (Seerose) → <b>Tauchblattzone</b> (Wasserpest) → Freiwasser.</p>
<h4>Jahreszeiten</h4><p>Im Sommer bildet sich eine <b>Schichtung</b> (warmes Oberflächenwasser, kaltes Tiefenwasser), im Frühjahr und Herbst gibt es die <b>Vollzirkulation</b>. Wasser hat bei <b>4 °C</b> die größte Dichte – deshalb friert ein See von oben zu und Fische überleben am Grund.</p>
<h4>Nahrungskette im See</h4><div class="ex">Algen (Plankton) → Wasserfloh → Rotfeder → Hecht → Fischadler</div>
<p><b>Eutrophierung:</b> zu viele Nährstoffe (Dünger) → Algenblüte → beim Abbau toter Algen wird Sauerstoff verbraucht → Fischsterben („Umkippen“).</p>
<div class="tip">💡 Brandenburg hat über 3000 Seen – perfekte Beispiele direkt vor der Haustür!</div>`,
 q:[["In welcher Zone wächst Schilf?",["Schwimmblattzone","Röhrichtzone","Tauchblattzone","Freiwasser"],1,"Röhrichtzone."],

 ["Wozu gehört die Seerose?",["Röhrichtzone","Schwimmblattzone","Tauchblattzone","Bruchwald"],1,"Schwimmblattzone."],

 ["Welches Tier steht am Anfang der Nahrungskette als Konsument 1. Ordnung?",["Hecht","Wasserfloh","Fischadler","Rotfeder"],1,"Der Wasserfloh frisst Algen."]]},
 {id:"b-viel", t:"Vielfalt: Einzeller, Bakterien, Pilze & Wirbellose", ex:`
<h4>Ordnung der Lebewesen</h4><p>Lebewesen werden eingeteilt: Reich → Stamm → Klasse → Ordnung → Familie → Gattung → Art. Wissenschaftliche Namen bestehen aus Gattung + Art (<i>Homo sapiens</i>).</p>
<ul><li><b>Bakterien:</b> Einzeller <b>ohne Zellkern</b>; nützlich (Joghurt, Verdauung) oder Krankheitserreger</li><li><b>Einzeller mit Zellkern:</b> Pantoffeltierchen, Amöbe, Augentierchen</li>
<li><b>Pilze:</b> eigenes Reich – kein Chlorophyll, ernähren sich von anderen; Hyphen/Myzel, Fruchtkörper; Destruenten</li><li><b>Viren:</b> keine Zellen, vermehren sich nur in Wirtszellen</li></ul>
<h4>Wirbellose</h4><ul><li><b>Insekten:</b> 3 Körperteile (Kopf, Brust, Hinterleib), <b>6 Beine</b>, Außenskelett, Facettenaugen; vollständige Verwandlung: Ei → Larve → Puppe → Insekt</li><li><b>Spinnen:</b> 2 Körperteile, <b>8 Beine</b></li><li>Weichtiere (Schnecken), Ringelwürmer (Regenwurm)</li></ul>`,
 q:[["Wie viele Beine haben Insekten?","=6","Insekten haben 6 Beine."],
 ["Was fehlt Bakterien?",["Zellmembran","ein Zellkern","Zellplasma","Erbinformation"],1,"Bakterien haben keinen echten Zellkern."],
 ["Warum sind Pilze keine Pflanzen?",["Sie haben kein Chlorophyll","Sie sind zu klein","Sie leben im Wasser","Sie haben Beine"],0,"Sie können keine Fotosynthese betreiben."],
 ["Reihenfolge der vollständigen Verwandlung?",["Ei – Puppe – Larve – Insekt","Ei – Larve – Puppe – Insekt","Larve – Ei – Puppe","Puppe – Ei – Larve"],1,"Ei → Larve → Puppe → fertiges Insekt."],
 ["Wie viele Beine hat eine Spinne?","=8","Spinnen haben 8 Beine – sie sind keine Insekten."],
 ["Wie heißt das Pilzgeflecht im Boden?","=myzel|mycel","Myzel (aus Hyphen)."]]},
 {id:"b-ern", t:"Ernährung & Verdauung", ex:`
<h4>Nährstoffe</h4><ul><li><b>Kohlenhydrate</b> (Brot, Nudeln) → Energie</li><li><b>Fette</b> → Energie, Speicher</li><li><b>Eiweiße</b> (Proteine) → Baustoffe für Muskeln & Zellen</li></ul>
<p>Dazu: Vitamine, Mineralstoffe, Ballaststoffe und Wasser.</p>
<h4>Weg der Nahrung</h4><ol><li><b>Mund:</b> Zähne zerkleinern, Speichel (Amylase) spaltet Stärke</li><li><b>Speiseröhre</b> → Transport</li>
<li><b>Magen:</b> Salzsäure tötet Keime, Pepsin spaltet Eiweiß</li><li><b>Dünndarm:</b> Galle (Fette) & Bauchspeicheldrüse; Darmzotten nehmen Nährstoffe ins <b>Blut</b> auf</li>
<li><b>Dickdarm:</b> Wasser wird entzogen</li><li>Enddarm, After</li></ol>
<div class="tip">💡 Enzyme spalten Nährstoffe in kleinste Bausteine – wie Schlüssel, die nur in ein Schloss passen (Schlüssel-Schloss-Prinzip).</div>`,

 ["Wo werden die meisten Nährstoffe ins Blut aufgenommen?",["Magen","Dünndarm","Dickdarm","Speiseröhre"],1,"Über die Darmzotten."],

 {id:"b-pub", t:"Pubertät & Entwicklung", ex:`
<p>In der <b>Pubertät</b> (ca. 10–16 Jahre) wird der Körper geschlechtsreif. Gesteuert wird das von <b>Hormonen</b>: Die Hirnanhangdrüse (<b>Hypophyse</b>) gibt Signale an Hoden bzw. Eierstöcke.</p>
<ul><li>Hormone: <b>Testosteron</b> (v. a. Jungen), <b>Östrogen</b> & Progesteron (v. a. Mädchen)</li>
<li><b>Primäre Geschlechtsmerkmale:</b> von Geburt an vorhandene Geschlechtsorgane</li>
<li><b>Sekundäre Geschlechtsmerkmale:</b> entwickeln sich in der Pubertät: Brustwachstum, Bartwuchs, Stimmbruch, Körperbehaarung</li></ul>
<h4>Menstruationszyklus</h4><p>Dauer ca. 28 Tage. Etwa in der Zyklusmitte findet der <b>Eisprung</b> statt. Wird die Eizelle nicht befruchtet, wird die Gebärmutterschleimhaut abgestoßen → Menstruation (Periode).</p>
<div class="tip">💡 Gefühle schwanken in dieser Zeit oft – das ist normal. Körperpflege wird wichtiger.</div>`,

 {id:"h-stand", t:"Ständegesellschaft & Lehnswesen", ex:`
<p>Im <b>Mittelalter</b> (ca. 500–1500) galt die Gesellschaft als <b>gottgewollte Ordnung</b> aus drei Ständen:</p>
<ul><li><b>1. Stand – Klerus</b> (Geistliche): „Ich bete für euch alle.“</li><li><b>2. Stand – Adel</b> (König, Fürsten, Ritter): „Ich schütze euch alle.“</li><li><b>3. Stand – Bauern</b> (über 90 %): „Ich arbeite für euch alle.“</li></ul>
<h4>Lehnswesen</h4><p>Der <b>König</b> (Lehnsherr) vergibt <b>Lehen</b> (Land, Ämter) an <b>Kronvasallen</b> (Herzöge, Grafen, Bischöfe). Diese geben Teile an <b>Untervasallen</b> (Ritter) weiter. Gegenleistung: <b>Treue und Kriegsdienst</b>; der Herr gibt Schutz.</p>
<div class="tip">💡 Wichtige Daten: 800 Kaiserkrönung Karls des Großen · 962 Kaiserkrönung Ottos I.</div>`,

 {id:"h-grund", t:"Grundherrschaft, Burg & Ritter", ex:`
<h4>Grundherrschaft</h4><p>Ein <b>Grundherr</b> (Adliger, Kloster) besitzt Land und gibt es Bauern zur Bewirtschaftung. Die Bauern sind oft <b>Hörige/Leibeigene</b>: Sie leisten <b>Frondienste</b> (Arbeit auf dem Herrenhof) und geben <b>Abgaben</b> (z. B. den „Zehnt“). Der Grundherr gewährt Schutz und spricht Recht.</p>
<h4>Dreifelderwirtschaft</h4><p>Feld 1 Wintergetreide, Feld 2 Sommergetreide, Feld 3 <b>Brache</b> (Erholung) – jährlich wechselnd → höhere Erträge.</p>
<h4>Ritter</h4><p>Ausbildung: <b>Page</b> (ab 7) → <b>Knappe</b> (ab 14) → <b>Ritterschlag</b> (ca. 21). Ritterideale: Tapferkeit, Treue, Schutz der Schwachen. Burgen: Bergfried, Palas, Ringmauer, Zugbrücke.</p>`,
 q:[["Was sind Frondienste?",["Gebete","Arbeit auf dem Hof des Grundherrn","Kriegszüge","Handel"],1,"Unbezahlte Arbeit für den Grundherrn."],
 ["Was ist bei der Dreifelderwirtschaft die Brache?",["Ein Feld mit Weizen","Ein Feld, das sich erholt","Ein Wald","Ein Garten"],1,"Brachliegendes Feld."],
 ["Reihenfolge der Ritterausbildung?",["Knappe – Page – Ritter","Page – Knappe – Ritter","Ritter – Knappe – Page","Page – Ritter – Knappe"],1,"Page → Knappe → Ritterschlag."],

 {id:"h-stadt", t:"Die Stadt im Mittelalter & Hanse", ex:`
<p>Ab dem 12. Jh. entstanden viele <b>Städte</b> – an Handelswegen, Flussübergängen, bei Burgen oder Klöstern. Der Stadtherr verlieh das <b>Stadtrecht</b> (Markt, Mauer, eigene Gerichte).</p>
<p><b>„Stadtluft macht frei“</b>: Ein Leibeigener, der ein Jahr und einen Tag in der Stadt lebte, wurde frei.</p>
<h4>Stadtgesellschaft</h4><ul><li>Oberschicht: <b>Patrizier</b> (reiche Kaufleute) – im Stadtrat</li><li>Mittelschicht: <b>Handwerker</b>, organisiert in <b>Zünften</b> (Kaufleute in <b>Gilden</b>)</li><li>Unterschicht: Mägde, Knechte, Tagelöhner, Bettler</li></ul>
<h4>Die Hanse</h4><p>Bund von Kaufleuten und Städten (Hauptort <b>Lübeck</b>), Handel über Nord- und Ostsee mit der <b>Kogge</b>. Auch Brandenburger Städte wie Frankfurt (Oder) waren Mitglied.</p>
<p>1347–1351: Die <b>Pest</b> („Schwarzer Tod“) tötete etwa ein Drittel der Menschen Europas.</p>`,
 q:[["Was bedeutete „Stadtluft macht frei“?",["Saubere Luft","Leibeigene wurden nach Jahr und Tag frei","Kostenlose Wohnung","Keine Steuern"],1,"Nach 1 Jahr und 1 Tag frei."],
 ["Wie hießen Zusammenschlüsse der Handwerker?",["Gilden","Zünfte","Hansen","Stände"],1,"Zünfte regelten Preise, Qualität, Ausbildung."],

 {id:"h-kreuz", t:"Kreuzzüge & Begegnung mit dem Islam", ex:`
<p><b>1095</b> rief Papst <b>Urban II.</b> in Clermont zum Kreuzzug auf, um Jerusalem von den Muslimen zu „befreien“ („Gott will es!“).</p>
<ul><li><b>1099</b> Eroberung Jerusalems mit einem Massaker an Muslimen und Juden</li><li>Motive: Glaube & Sündenerlass, Abenteuer, Land und Reichtum, Handel</li><li>Auch Judenverfolgungen in Europa (z. B. in Worms, Mainz)</li></ul>
<h4>Begegnung der Kulturen</h4><p>Die islamische Welt war in Wissenschaft weit voraus: <b>arabische Ziffern</b> und die Null, Algebra, Medizin, Astronomie, antike Schriften. In <b>al-Andalus</b> (Spanien, Córdoba) lebten Muslime, Christen und Juden lange zusammen.</p>
<p>Wörter aus dem Arabischen: Zucker, Kaffee, Algebra, Matratze, Ziffer.</p>`,

 {id:"h-entd", t:"Entdeckungen & Eroberungen", ex:`
<h4>Ursachen</h4><p>Europäer wollten einen <b>Seeweg nach Indien</b> (Gewürze, Seide). Seit <b>1453</b> kontrollierten die Osmanen Konstantinopel und den Landweg.</p>
<h4>Neue Technik</h4><p>Kompass, Astrolabium, die wendige <b>Karavelle</b>, bessere Karten; Buchdruck durch <b>Gutenberg</b> (um 1450) verbreitete Wissen.</p>
<h4>Entdecker</h4><ul><li><b>1492</b> Christoph Kolumbus erreicht Amerika (dachte, es sei Indien)</li><li><b>1498</b> Vasco da Gama: Seeweg nach Indien um Afrika</li><li><b>1519–1522</b> Magellans Flotte umsegelt die Welt</li></ul>
<h4>Eroberungen</h4><p>Hernán <b>Cortés</b> zerstörte das Reich der <b>Azteken</b> (1521), Francisco <b>Pizarro</b> das der <b>Inka</b>. Folgen: Millionen Tote durch Gewalt und eingeschleppte Krankheiten, Kolonien, später Sklavenhandel aus Afrika.</p>`,

 {id:"h-renai", t:"Renaissance & Humanismus", ex:`
<p>Um 1400–1600 beginnt die <b>Neuzeit</b>. In Italien (Florenz) entdeckte man die Kunst und das Wissen der <b>Antike</b> neu – „Renaissance“ heißt <b>Wiedergeburt</b>.</p>
<ul><li><b>Humanismus:</b> Der Mensch und seine Fähigkeiten stehen im Mittelpunkt, nicht nur Gott. Bildung, eigenes Denken, Quellen im Original lesen („ad fontes“). Bekannt: Erasmus von Rotterdam.</li>
<li><b>Künstler & Forscher:</b> Leonardo da Vinci (Mona Lisa, Erfindungen), Michelangelo (Sixtinische Kapelle), Zentralperspektive in der Malerei</li>
<li><b>Neues Weltbild:</b> Kopernikus: Die Sonne steht im Mittelpunkt (<b>heliozentrisch</b>) statt die Erde (geozentrisch). Galileo Galilei bestätigte es mit dem Fernrohr und wurde von der Kirche angeklagt.</li>
<li><b>Buchdruck</b> (Gutenberg, um 1450): Wissen verbreitet sich schnell und billig – Voraussetzung für die Reformation.</li></ul>`,

 ["In welcher Stadt begann die Renaissance vor allem?",["Paris","Florenz","Berlin","London"],1,"Florenz in Italien."],

 {id:"h-ref", t:"Reformation", ex:`
<p>Die Kirche verkaufte <b>Ablassbriefe</b> (Sündenerlass gegen Geld) – Prediger Johann <b>Tetzel</b>: „Wenn das Geld im Kasten klingt, die Seele aus dem Fegefeuer springt.“</p>
<ul><li><b>1517</b> Martin <b>Luther</b> veröffentlicht in Wittenberg seine <b>95 Thesen</b> gegen den Ablass</li>
<li>Luthers Lehre: Gnade Gottes nur durch Glauben, die Bibel allein zählt</li><li><b>1521</b> Reichstag zu Worms: Luther widerruft nicht → Reichsacht; Versteck auf der <b>Wartburg</b>, dort übersetzt er das Neue Testament ins Deutsche</li>
<li><b>1525</b> Bauernkrieg</li><li><b>1555</b> Augsburger Religionsfrieden: Der Landesherr bestimmt die Religion („Wessen Land, dessen Religion“)</li>
<li><b>1618–1648</b> Dreißigjähriger Krieg, beendet durch den Westfälischen Frieden</li></ul>
<div class="tip">💡 Wittenberg liegt nahe an Brandenburg – Brandenburg wurde 1539 evangelisch.</div>`,

 {id:"h-abs", t:"Absolutismus & Preußen", ex:`
<p>Im <b>Absolutismus</b> hat der Herrscher die <b>uneingeschränkte Macht</b> (legibus absolutus = von den Gesetzen gelöst) – er beruft sich auf Gottes Gnade.</p>
<h4>Ludwig XIV. – der Sonnenkönig (Frankreich, reg. 1643/61–1715)</h4><ul><li>Ihm zugeschrieben: „Der Staat bin ich“</li><li>Schloss <b>Versailles</b> als Machtzentrum, strenges Hofzeremoniell</li>
<li>Säulen der Macht: <b>stehendes Heer</b>, Beamte, Kirche, <b>Merkantilismus</b> (Minister Colbert: viel exportieren, wenig importieren, Manufakturen)</li></ul>
<h4>Brandenburg-Preußen</h4><p>1701 krönt sich Kurfürst Friedrich III. zum König in Preußen. <b>Friedrich II.</b> („der Große“, reg. 1740–1786) gilt als <b>aufgeklärter Absolutist</b>: „erster Diener des Staates“, Religionstoleranz, Abschaffung der Folter, Förderung der Kartoffel, Schloss Sanssouci in Potsdam.</p>`,

 {id:"h-migr", t:"Längsschnitt Migration (Hugenotten & Co.)", ex:`
<p>Migration (Wanderung) gab es zu allen Zeiten. Im Unterricht 7/8 wird sie als <b>Längsschnitt</b> durch die Epochen betrachtet.</p>
<ul><li><b>Völkerwanderung</b> (ca. 375–568): Germanische Stämme ziehen nach Westen und Süden, Ende des Weströmischen Reiches (476)</li>
<li><b>Ostsiedlung</b> im Mittelalter: deutsche Siedler ziehen in slawische Gebiete östlich der Elbe – auch nach Brandenburg</li>
<li><b>Hugenotten:</b> Französische Protestanten werden verfolgt. 1685 lädt der Große Kurfürst Friedrich Wilhelm sie mit dem <b>Edikt von Potsdam</b> nach Brandenburg ein → ca. 20 000 kommen, bringen Handwerk und Wissen (Französischer Dom in Berlin, Französisches Viertel)</li>
<li><b>Auswanderung im 19. Jh.:</b> Millionen Deutsche wandern nach Amerika aus (Armut, Hunger)</li></ul>
<p><b>Push-Faktoren</b> (Verfolgung, Krieg, Armut) und <b>Pull-Faktoren</b> (Religionsfreiheit, Land, Arbeit) gibt es damals wie heute.</p>`,

 {id:"h-frrev", t:"Französische Revolution", ex:`
<h4>Ursachen</h4><p>Frankreich war hoch verschuldet (Kriege, Hof von Versailles). Der <b>3. Stand</b> (98 % der Bevölkerung) zahlte fast alle Steuern, hatte aber kaum Rechte. Ideen der <b>Aufklärung</b> (Freiheit, Gleichheit, Gewaltenteilung – Montesquieu, Rousseau) verbreiteten sich. Missernten → Hunger.</p>
<h4>Verlauf</h4><ul><li><b>1789</b>: Generalstände → der 3. Stand erklärt sich zur <b>Nationalversammlung</b> (Ballhausschwur)</li><li><b>14. Juli 1789: Sturm auf die Bastille</b> (heute Nationalfeiertag)</li>
<li>August 1789: <b>Erklärung der Menschen- und Bürgerrechte</b></li><li>1791: konstitutionelle Monarchie · 1792: Republik · 1793: Hinrichtung Ludwigs XVI.</li>
<li>1793/94: <b>Schreckensherrschaft</b> unter Robespierre (Guillotine)</li><li>1799: <b>Napoleon</b> übernimmt die Macht, 1804 Kaiser</li></ul>
<p>Motto: <b>Liberté, Égalité, Fraternité</b> – Freiheit, Gleichheit, Brüderlichkeit.</p>`,

 {id:"h-indus", t:"Industrialisierung", ex:`
<p>Die <b>Industrielle Revolution</b> begann um 1760 in <b>England</b>, in Deutschland ab ca. 1835.</p>
<ul><li><b>Dampfmaschine</b> (verbessert von James Watt, 1769) treibt Maschinen an</li><li>Mechanischer Webstuhl, Fabriken statt Handarbeit</li>
<li><b>Eisenbahn:</b> erste deutsche Strecke 1835 Nürnberg–Fürth; 1838 Berlin–Potsdam (erste in Preußen!)</li><li>Kohle und Stahl (Ruhrgebiet), in Berlin: Borsig (Lokomotiven), Siemens (Elektrotechnik)</li></ul>
<h4>Soziale Frage</h4><p>Arbeiter zogen in die Städte (Landflucht). Folgen: 14–16-Stunden-Tage, <b>Kinderarbeit</b>, niedrige Löhne, enge Mietskasernen, keine Absicherung bei Krankheit.</p>
<p><b>Lösungsversuche:</b> Gewerkschaften, Arbeiterparteien (SPD), Kirche (Kolping), Unternehmer (Krupp-Siedlungen), Staat: <b>Bismarcks Sozialversicherungen</b> (1883 Kranken-, 1884 Unfall-, 1889 Rentenversicherung).</p>`,

<script>
"use strict";
/* ========== Helpers ========== */
const $=s=>document.querySelector(s);
const esc=s=>String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const pad=n=>String(n).padStart(2,"0");
const dayKey=(d=new Date())=>d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate());
const addDays=(k,n)=>{const [y,m,d]=k.split("-").map(Number);const x=new Date(y,m-1,d+n);return dayKey(x)};
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
const rnd=(a,b)=>a+Math.floor(Math.random()*(b-a+1));
const fmtMin=s=>{s=Math.floor(s/60);if(s<60)return s+" Min";return Math.floor(s/60)+" Std "+(s%60)+" Min"};
const norm=s=>String(s).toLowerCase().replace(/[−–]/g,"-").replace(/[’`´]/g,"'").replace(/,/g,".").replace(/€|%|°c|°|grad|tage|liter|jahre/g,"").replace(/\s+/g," ").trim().replace(/\.$/,"");
const lsGet=k=>{try{return JSON.parse(localStorage.getItem(k))}catch(e){return null}};
const lsSet=(k,v)=>{try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}};
const toast=(m,ms=2600)=>{const t=document.createElement("div");t.className="toast";t.innerHTML=m;$("#toasts").appendChild(t);setTimeout(()=>t.remove(),ms)};
const SUBJ=window.SUBJECTS, VOC=window.VOCAB;
const TOPIC={};SUBJ.forEach(s=>s.topics.forEach(t=>{t.sid=s.id;TOPIC[t.id]=t}));
const subj=id=>SUBJ.find(s=>s.id===id);

/* ========== Avatar / Shop ========== */
const ANIMALS=["🦊","🐼","🐯","🐸","🐱","🐶","🦁","🐨","🐵","🐧","🐰","🦉"];
const PREMIUM={"🦄":400,"🐉":800,"🦖":600,"🐙":300};
const COLORS=["#7c6cff","#ff7a18","#2ee59d","#ff5d73","#3fa9ff","#ffcc33","#d36bff","#00c2c7"];
const ACCS=[["⭐",100],["🧢",150],["🕶️",200],["🎧",250],["🎩",300],["🌈",400],["👑",500],["🚀",600]];
function avaHTML(a,size=44){a=a||{};const c=COLORS[a.c||0]||COLORS[0];return `<span class="ava" style="width:${size}px;height:${size}px;font-size:${size*.58}px;background:radial-gradient(circle at 30% 25%,#fff4,transparent 60%),${c}">${esc(a.e||"🦊")}${a.acc?`<span class="acc">${esc(a.acc)}</span>`:""}</span>`}

/* ========== Levels & badges ========== */
const lvlOf=xp=>Math.floor(Math.sqrt(xp/40))+1;
const lvlXp=l=>Math.pow(l-1,2)*40;
const RANKS=["Startklar","Passagier","Co-Pilot","Pilot","Kapitän","Überflieger","Ass","Legende"];
const rankName=l=>RANKS[Math.min(RANKS.length-1,Math.floor((l-1)/3))];
const BADGES=[
 ["first","🎯","Erster Test",p=>Object.keys(p.topics||{}).length>0],
 ["s3","🔥","3 Tage Flamme",p=>(p.best||0)>=3],
 ["s7","🌋","7 Tage Flamme",p=>(p.best||0)>=7],
 ["s30","☄️","30 Tage Flamme",p=>(p.best||0)>=30],
 ["h1","⏱️","1 Stunde gelernt",p=>(p.totalSec||0)>=3600],
 ["h10","🏅","10 Stunden",p=>(p.totalSec||0)>=36000],
 ["perf","💯","Perfekter Test",p=>Object.values(p.topics||{}).some(t=>t.best===100)],
 ["exam","📝","Probe-Arbeit",p=>(p.exams||[]).length>0],
 ["one","🥇","Note 1",p=>(p.exams||[]).some(e=>e.g===1)],
 ["fly","✈️","Erster Flug",p=>(p.flights||0)>=1],
 ["fly10","🛫","10 Flüge",p=>(p.flights||0)>=10],
 ["all","🌍","Alle Fächer",p=>SUBJ.every(s=>s.topics.some(t=>(p.topics||{})[t.id]))],
 ["voc","🗂️","50 Vokabeln",p=>Object.values(p.vocab||{}).reduce((n,s)=>n+Object.values(s).filter(b=>b>=3).length,0)>=50],
 ["friend","🤝","Freund geaddet",p=>(p.friends||[]).length>0],
];

/* ========== State ========== */
let P=null, MODE="local", DB=null, USER=null, ROOM=null, UID=null, LOCALKEY=null, CLOUD_RO=false;
let ALLP={}, ONLINE={};
let V={v:"home"};
let lastAct=Date.now(), dirty=false, saving=false, cloudTimer=null;
const LEARN_VIEWS=["topic","quiz","exam","vocab","vocset","flight"];
function newProfile(name,ava){return{v:1,name:name,ava:ava,xp:0,coins:0,streak:0,best:0,lastGoal:"",freezes:0,totalSec:0,days:{},goal:10,friends:[],code:Math.random().toString(36).slice(2,8).toUpperCase(),topics:{},exams:[],owned:[],vocab:{},flights:0,created:Date.now(),upd:Date.now()}}

/* ========== Persistence ========== */
function saveLocal(){if(!P)return;P.upd=Date.now();lsSet(LOCALKEY,P)}
function save(){saveLocal();dirty=true;if(MODE==="cloud"&&!CLOUD_RO){clearTimeout(cloudTimer);cloudTimer=setTimeout(cloudSave,3000)}}
async function cloudSave(){if(!DB||!UID||saving||!dirty||CLOUD_RO)return;saving=true;dirty=false;
 try{const days={};Object.keys(P.days).sort().slice(-60).forEach(k=>days[k]=P.days[k]);P.days=days;
  await DB.doc("players/"+UID).set(JSON.parse(JSON.stringify(P)));}
 catch(e){if(e&&(e.code==="invalid_argument"||e.code==="permission-denied")){CLOUD_RO=true;toast("☁️ Cloud-Speichern ist für dich nicht freigeschaltet – dein Fortschritt wird auf diesem Gerät gespeichert.",6000)}else{dirty=true}}
 saving=false;if(dirty){clearTimeout(cloudTimer);cloudTimer=setTimeout(cloudSave,4000)}}
window.addEventListener("pagehide",()=>{saveLocal();cloudSave()});
document.addEventListener("visibilitychange",()=>{if(document.visibilityState==="hidden"){saveLocal();cloudSave();if(FL())FL().turb=(FL().turb||0)+1,lsSet(flKey(),FL()),FL().hiddenAt=Date.now()}else if(FL()&&FL().hiddenAt&&Date.now()-FL().hiddenAt<36e5){FL().hiddenAt=0;toast("🌪️ Turbulenzen! Du hast den Flug verlassen. Bleib dran für den vollen Bonus.",3500)}});

/* ========== Gamification ========== */
function today(){return dayKey()}
function todaySec(){return (P.days||{})[today()]||0}
function streakAlive(){const t=today();if(!P.lastGoal)return 0;if(P.lastGoal===t||P.lastGoal===addDays(t,-1))return P.streak;if(P.freezes>0&&P.lastGoal===addDays(t,-2))return P.streak;return 0}
function checkStreakOnLoad(){const t=today();if(!P.lastGoal)return;if(P.lastGoal===t||P.lastGoal===addDays(t,-1))return;
 if(P.freezes>0&&P.lastGoal===addDays(t,-2)){return}
 if(P.streak>0){toast("💨 Deine Flamme ist erloschen. Heute startet eine neue Serie!",4000)}P.streak=0;save()}
function goalReached(){const t=today();if(P.lastGoal===t)return;const y=addDays(t,-1);
 if(P.lastGoal===y)P.streak++;else if(P.freezes>0&&P.lastGoal===addDays(t,-2)){P.freezes--;P.streak++;toast("🧊 Flammen-Schutz benutzt – Serie gerettet!")}else P.streak=1;
 P.lastGoal=t;P.best=Math.max(P.best||0,P.streak);addXP(20,true);
 showModal(`<div class="center"><div class="big flame">🔥</div><h2>${P.streak} ${P.streak===1?"Tag":"Tage"} Flamme!</h2><p class="mut" style="margin:8px 0 16px">Tagesziel geschafft (${P.goal} Min). Komm morgen wieder, damit deine Flamme weiterbrennt!</p><button class="btn fire full" data-a="closeModal">Weiter so! +20 XP</button></div>`);save();renderTop()}
function addXP(n,silent){const before=lvlOf(P.xp);P.xp+=n;P.coins+=n;const after=lvlOf(P.xp);
 if(!silent)toast(`+${n} XP ⚡`,1400);
 if(after>before){setTimeout(()=>showModal(`<div class="center"><div class="big">🎉</div><h2>Level ${after}!</h2><p class="mut" style="margin:8px 0 16px">Rang: <b>${rankName(after)}</b></p><button class="btn full" data-a="closeModal">Yeah!</button></div>`),400)}
 checkBadges();save();renderTop()}
function checkBadges(){P.badges=P.badges||[];BADGES.forEach(b=>{if(!P.badges.includes(b[0])&&b[3](P)){P.badges.push(b[0]);setTimeout(()=>toast(`🏆 Abzeichen: ${b[1]} ${b[2]}`,3500),800)}})}

/* ========== Time tracking ========== */
["click","keydown","touchstart","scroll"].forEach(e=>window.addEventListener(e,()=>lastAct=Date.now(),{passive:true}));
let tick=0;
setInterval(()=>{if(!P)return;
 const fl=FL();
 const learning=LEARN_VIEWS.includes(V.v)||!!fl;
 if(document.visibilityState==="visible"&&learning&&(Date.now()-lastAct<120000||fl)){
  const t=today();P.days[t]=(P.days[t]||0)+1;P.totalSec=(P.totalSec||0)+1;tick++;
  if(P.lastGoal!==t&&P.days[t]>=P.goal*60)goalReached();
  if(tick%15===0)save();
  if(tick%5===0)renderTop();
 }
 if(fl)flightTick();
},1000);

/* ===== Firebase-Anbindung ===== */
function makeRoom(fs,uid,name){const col=fs.collection("rooms").doc(name).collection("peers");let state=null,hb=null,unsub=null;
 return{presence(o){state=o;col.doc(uid).set(Object.assign({},o,{t:Date.now()})).catch(()=>{});if(!hb)hb=setInterval(()=>{if(state&&document.visibilityState==="visible")col.doc(uid).set(Object.assign({},state,{t:Date.now()})).catch(()=>{})},45000)},
 onPeers(fn){const run=s=>{const now=Date.now();fn(s.docs.map(d=>d.data()).filter(p=>now-(p.t||0)<150000).map(p=>({presence:p})))};let last=null;unsub=col.onSnapshot(s=>{last=s;run(s)},()=>{});setInterval(()=>{if(last)run(last)},30000);return unsub},
 join(n){return makeRoom(fs,uid,n)},
 leave(){clearInterval(hb);hb=null;state=null;try{unsub&&unsub()}catch(e){}col.doc(uid).delete().catch(()=>{})}}}

 <p class="mut sm" style="margin-top:14px">Dein Fortschritt wird online gespeichert – auf jedem Gerät gleich.</p></div>`}
const AUTHERR={"auth/invalid-email":"Die E-Mail-Adresse ist ungültig.","auth/missing-password":"Bitte gib ein Passwort ein.","auth/weak-password":"Das Passwort muss mindestens 6 Zeichen haben.","auth/email-already-in-use":"Mit dieser E-Mail gibt es schon ein Konto – melde dich an.","auth/invalid-credential":"E-Mail oder Passwort falsch.","auth/wrong-password":"Falsches Passwort.","auth/user-not-found":"Kein Konto mit dieser E-Mail – erstelle ein neues.","auth/too-many-requests":"Zu viele Versuche – warte kurz.","auth/operation-not-allowed":"E-Mail-Anmeldung ist in Firebase noch nicht eingeschaltet.","auth/unauthorized-domain":"Diese Website ist in Firebase noch nicht freigeschaltet (Authorized domains).","auth/network-request-failed":"Keine Internetverbindung."};

 if(!fbReady()){$("#main").innerHTML=`<div class="card" style="margin-top:30px"><h2>⚙️ Fast fertig!</h2><p style="margin-top:8px">Die Firebase-Daten fehlen noch in der Datei <b>config.js</b>. Trage dort deine Firebase-Konfiguration ein.</p><p class="mut sm" style="margin-top:10px">Bis dahin kannst du im Geräte-Modus lernen.</p><button class="btn full" style="margin-top:12px" data-a="localMode">Im Geräte-Modus starten</button></div>`;return}

 });

/* ---------- Generators (Mathe-Endlostraining) ---------- */
const GEN={
 "m-rat":()=>{const a=rnd(-15,15)||3,b=rnd(-12,12)||-4;const op=rnd(0,3);const f=x=>x<0?`(−${-x})`:x;
  if(op===0)return[`${f(a)} + ${f(b)} = ?`,"="+(a+b),`Vorzeichenregeln der Addition → ${a+b}`];
  if(op===1)return[`${f(a)} − ${f(b)} = ?`,"="+(a-b),`Minus einer Zahl = Plus der Gegenzahl → ${a-b}`];
  if(op===2)return[`${f(a)} · ${f(b)} = ?`,"="+(a*b),`Gleiche Vorzeichen +, verschiedene − → ${a*b}`];
  const p=a*b;return[`${f(p)} : ${f(b)} = ?`,"="+a,`${p} : ${b} = ${a}`]},
 "m-proz":()=>{const G=rnd(2,40)*10,p=[5,10,15,20,25,30,40,50,60,75][rnd(0,9)],W=G*p/100;const k=rnd(0,2);
  if(k===0)return[`${p} % von ${G} = ?`,"="+W,`W = ${G} · ${p} / 100 = ${W}`];
  if(k===1)return[`${W} von ${G} sind wie viel Prozent?`,"="+p,`p = ${W} / ${G} · 100 = ${p}`];
  return[`${p} % sind ${W}. Wie groß ist der Grundwert?`,"="+G,`G = ${W} · 100 / ${p} = ${G}`]},
 "m-zins":()=>{const K=rnd(2,50)*100,p=rnd(1,6);const m=[12,6,3,9][rnd(0,3)];const Z=Math.round(K*p/100*m/12*100)/100;
  return[`${K} € werden ${m===12?"1 Jahr":m+" Monate"} zu ${p} % angelegt. Zinsen in €?`,"="+String(Z),`Z = ${K} · ${p}/100 · ${m}/12 = ${String(Z).replace(".",",")} €`]},
 "m-zuo":()=>{if(rnd(0,1)){const n=rnd(2,6),pr=rnd(2,9)*(n),m=rnd(2,12);const e=pr/n;return[`${n} Stück kosten ${pr} €. Was kosten ${m} Stück? (in €)`,"="+(e*m),`1 Stück: ${pr} : ${n} = ${e} → ${m} · ${e} = ${e*m}`]}
  const a=[2,3,4,6][rnd(0,3)],d=[6,8,12][rnd(0,2)],tot=a*d;const b=[2,3,4,6,8,12].filter(x=>x!==a&&tot%x===0);const bb=b[rnd(0,b.length-1)]||2;
  return[`${a} Arbeiter brauchen ${d} Tage. Wie viele Tage brauchen ${bb} Arbeiter?`,"="+(tot/bb),`Antiproportional: ${a}·${d} = ${tot}; ${tot} : ${bb} = ${tot/bb}`]},
 "m-term":()=>{const x=rnd(-6,9),a=rnd(2,7),b=rnd(-12,15);const c=a*x+b;const bs=b<0?`− ${-b}`:`+ ${b}`;
  return[`Löse: ${a}x ${bs} = ${c}. x = ?`,"="+x,`${b<0?"+"+(-b):"−"+b} → ${a}x = ${c-b} → : ${a} → x = ${x}`]},
 "m-wahr":()=>{const n=rnd(4,5);let a=[];for(let i=0;i<n;i++)a.push(rnd(1,20));let s=a.reduce((x,y)=>x+y,0);const r=s%n;if(r){a[0]+=n-r;s+=n-r}
  return[`Mittelwert von ${a.join(", ")}?`,"="+(s/n),`Summe ${s} : ${n} = ${s/n}`]}
};

/* ---------- Quiz engine ---------- */
function mkQ(raw){if(typeof raw[1]==="string")return{q:raw[0],inp:raw[1].slice(1).split("|"),e:raw[2]};return{q:raw[0],o:raw[1],a:raw[2],e:raw[3]}}
function startPractice(){const t=TOPIC[V.tid];V.tab="prac";V.mode="prac";V.qs=shuffle(t.q).map(mkQ);V.qi=0;V.answered=false;V.sel=null;V.right=0;V.total=0}
function nextPracQ(){const t=TOPIC[V.tid];V.qi++;V.answered=false;V.sel=null;
 if(V.qi>=V.qs.length){if(t.gen&&GEN[t.id]){V.qs.push(mkQ(GEN[t.id]()))}else{V.qs=V.qs.concat(shuffle(t.q).map(mkQ))}}}
function curQ(){return V.qs[V.qi]}
function qCard(q,showFb){let h=`<div class="qtext">${esc(q.q)}</div>`;
 if(q.o){h+=`<div class="opts">${q.o.map((o,i)=>{let c="";if(showFb&&V.answered){if(i===q.a)c="ok";else if(i===V.sel)c="bad"}else if(V.sel===i)c="sel";return `<button class="opt ${c}" data-a="pick" data-x="${i}" ${V.answered?"disabled":""}>${esc(o)}</button>`}).join("")}</div>`}
 else{h+=`<form data-f="ans" class="inp-row"><input id="ans" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="Antwort eingeben" value="${esc(V.typed||"")}" ${V.answered?"disabled":""}>${V.answered?"":`<button class="btn sm" type="submit">OK</button>`}</form>`;
  if(V.v!=="exam")h+=`<p class="mut sm" style="margin-top:6px">Tipp: Kommazahlen mit Komma, negative Zahlen mit Minus.</p>`}
 return h}
const deacc=s=>s.normalize("NFD").replace(/[\u0300-\u036f]/g,"");
function isRight(q){if(q.o)return V.sel===q.a;const u=deacc(norm(V.typed||""));return q.inp.some(a=>{const n=deacc(norm(a));if(n===u||n.replace(/\s/g,"")===u.replace(/\s/g,""))return true;const x=parseFloat(n),y=parseFloat(u.replace(/\s/g,""));return /^-?[\d.]+$/.test(n)&&/^-?[\d.]+$/.test(u.replace(/\s/g,""))&&Math.abs(x-y)<1e-9})}
function quizBody(){const q=curQ();if(!q)return "";
 let fb="";if(V.answered){const ok=V.lastOk;fb=`<div class="fb ${ok?"ok":"bad"}">${ok?"✅ Richtig!":"❌ Nicht ganz."+(q.inp?` Richtig: <b>${esc(q.inp[0])}</b>`:"")}<div style="font-weight:600;margin-top:6px">${esc(q.e)}</div></div><button class="btn full" style="margin-top:12px" data-a="pracNext">Weiter →</button>`}
 return `<div class="card"><div class="qhead"><span class="pill">✏️ Übung ${V.total?`· ${V.right}/${V.total} richtig`:""}</span><span class="pill">+10 XP pro richtige</span></div>${qCard(q,true)}${fb}</div>`}
function answer(){const q=curQ();if(V.answered)return;if(q.o&&V.sel==null)return;
 const ok=isRight(q);V.answered=true;V.lastOk=ok;
 if(V.v==="topic"){V.total++;if(ok){V.right++;addXP(10,true);toast("+10 XP ⚡",900)}}
 rerender()}
/* Mini-Test */
function startTest(){const t=TOPIC[V.tid];let pool=shuffle(t.q).map(mkQ);if(t.gen&&GEN[t.id]){pool=pool.slice(0,4).concat([mkQ(GEN[t.id]()),mkQ(GEN[t.id]())])}else pool=pool.slice(0,6);
 V={v:"quiz",tid:t.id,qs:pool,qi:0,res:[],answered:false,sel:null,typed:""}}
VIEWS.quiz=()=>{const t=TOPIC[V.tid];if(V.done)return resultView(t);const q=curQ();
 return `<button class="btn ghost sm" style="margin-top:14px" data-a="topic" data-x="${t.id}">✕ Abbrechen</button>
 <div class="card"><div class="qhead"><span class="pill">📝 Mini-Test: ${esc(t.t)}</span><span class="pill">${V.qi+1}/${V.qs.length}</span></div><div class="bar"><i style="width:${V.qi/V.qs.length*100}%"></i></div>
 ${qCard(q,false)}${q.o?`<button class="btn fire full" style="margin-top:14px" data-a="testNext" ${V.sel==null?"disabled":""}>${V.qi+1<V.qs.length?"Weiter →":"Abgeben ✔"}</button>`:""}</div>`};

function finishTest(){const r=V.res.filter(x=>x.ok).length;const pct=Math.round(r/V.res.length*100);V.done=true;V.pct=pct;
 if(V.v==="quiz"){const st=P.topics[V.tid]||{best:0,n:0};st.best=Math.max(st.best,pct);st.n=(st.n||0)+1;st.d=Date.now();P.topics[V.tid]=st;
  addXP(r*10+(pct===100?30:0));}
 else{const g=gradeOf(pct);V.grade=g;P.exams.unshift({s:V.sid,g:g,p:pct,d:today()});P.exams=P.exams.slice(0,30);addXP(50+r*10)}

  acc[n]={ava:{e:"🦊",c:0},streak:0,pin};lsSet("lf7_accounts",acc);lsSet("lf7_l_"+n,newProfile(n,{e:ANIMALS[rnd(0,ANIMALS.length-1)],c:rnd(0,COLORS.length-1)}));localUse(n);V={v:"me"};render();toast("🎉 Profil erstellt! Gestalte deinen Avatar.")},

};
document.addEventListener("click",e=>{const el=e.target.closest("[data-a]");if(!el)return;const a=el.dataset.a;if(ACT[a]){if(el.tagName==="BUTTON"&&el.closest("form")&&el.type==="submit")return;e.preventDefault();ACT[a](el.dataset.x,e)}});
document.addEventListener("input",e=>{const t=e.target;if(t.id==="ans")V.typed=t.value;if(t.dataset.in==="dur"){V.dur=+t.value;const l=$("#durl");if(l)l.textContent=t.value+" Min"}});

document.addEventListener("submit",e=>{e.preventDefault();const f=e.target.dataset.f;
 if(f==="emailLogin"){emailAuth(e.target.dataset.x==="reg");return}
 if(f==="ans"){V.typed=$("#ans").value;if(!V.typed.trim())return;if(V.v==="topic")answer();else testNext()}
 if(f==="vans"){V.typed=$("#ans").value;if(!V.typed.trim())return;const[s,w]=vWord();const back=V.dir==="de"?w[1]:w[0];V.answered=true;vRecord(vCheck(back));rerender()}
 if(f==="addf"){const c=($("#fcode").value||"").trim().toUpperCase();const hit=Object.entries(ALLP).find(([id,p])=>p.code===c&&id!==UID);if(!hit)return toast("Code nicht gefunden – hat deine Freundin die Seite schon geöffnet?");ACT.addId(hit[0])}
 if(f==="rename"){const n=($("#rn").value||"").trim().slice(0,20);if(n&&MODE==="cloud"){P.name=n;save();toast("Gespeichert");rerender()}else if(n){toast("Im Geräte-Modus ist der Name fest.")}}
 if(f==="pin"){const name=e.target.dataset.x;const acc=lsGet("lf7_accounts")||{};if(($("#pinin").value||"")===acc[name].pin){closeModal();localUse(name)}else toast("❌ Falsche PIN")}
});

<script>
"use strict";
/* ================= Stimme (möglichst natürlich) ================= */
let VOICES=[];
function loadVoices(){try{VOICES=speechSynthesis.getVoices()||[]}catch(e){VOICES=[]}}
try{loadVoices();speechSynthesis.onvoiceschanged=loadVoices}catch(e){}
function bestVoice(lang){const pre=lang.slice(0,2).toLowerCase();const list=VOICES.filter(v=>(v.lang||"").toLowerCase().replace("_","-").startsWith(pre));
 if(!list.length)return null;
 const good={de:["anna","petra","helena","markus","yannick","katja","conrad","google deutsch"],en:["daniel","kate","serena","arthur","martha","oliver","google uk english","libby","sonia","ryan"],fr:["amélie","amelie","thomas","audrey","aurélie","marie","google français","denise","henri"]}[pre]||[];
 const score=v=>{const n=(v.name||"").toLowerCase();let s=0;if(/premium/.test(n))s+=8;if(/enhanced|verbessert|améliorée|natural|neural|online/.test(n))s+=6;if(/google/.test(n))s+=4;if(good.some(g=>n.includes(g)))s+=3;
  if(pre==="en"&&/gb|uk/.test((v.lang||"").toLowerCase()))s+=2;if(pre==="fr"&&/fr-fr|fr_fr/.test((v.lang||"").toLowerCase()))s+=2;if(pre==="de"&&/de-de|de_de/.test((v.lang||"").toLowerCase()))s+=1;
  if(/compact|eloquence|albert|bad news|bells|boing|bubbles|cellos|jester|organ|superstar|trinoids|whisper|wobble|zarvox|grandma|grandpa|rocko|shelley|flo|reed|sandy/.test(n))s-=10;return s};
 return list.sort((a,b)=>score(b)-score(a))[0]}
function sayText(text,lang,onend){try{speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(text);u.lang=lang;const v=bestVoice(lang);if(v)u.voice=v;u.rate=lang.startsWith("de")?1.0:0.9;u.pitch=1;
 let done=false;const fin=()=>{if(!done){done=true;onend&&onend()}};u.onend=fin;u.onerror=fin;speechSynthesis.speak(u);return true}catch(e){onend&&setTimeout(onend,2500);return false}}
window.speak=function(){try{const[s,w]=vWord();sayText(w[1],VOC[V.L].lang)}catch(e){toast("🔇 Vorlesen geht in diesem Browser nicht.")}};
const VOICE_TIP=`<p class="mut sm" style="margin-top:10px">💡 Stimme klingt zu künstlich? iPhone: Einstellungen → Bedienungshilfen → Gesprochene Inhalte → Stimmen → eine Stimme mit „Verbessert“ oder „Premium“ laden. Samsung: In Chrome nutzen (Google-Stimmen).</p>`;

/* ================= Tageszähler (für Aufgaben) ================= */
function bump(k,n){const t=today();if(!P.dly||P.dly.d!==t)P.dly={d:t};P.dly[k]=(P.dly[k]||0)+(n||1);checkXmas();save()}
function dly(k){const t=today();if(k==="sec")return todaySec();return P.dly&&P.dly.d===t?(P.dly[k]||0):0}
LEARN_VIEWS.push("speak","cards","video");

function cleanSpeech(txt,sid){let t=txt.replace(/\p{Extended_Pictographic}|️/gu,"").replace(/z\. ?B\./g,"zum Beispiel").replace(/ca\./g,"circa").replace(/Jh\./g,"Jahrhundert").replace(/bzw\./g,"beziehungsweise").replace(/usw\./g,"und so weiter")

 t=sid==="ma"?t.replace(/ ?· ?/g," mal ").replace(/ = /g," gleich ").replace(/\bπ\b|π/g," pi "):t.replace(/·/g,", ");
 return t.replace(/\s+/g," ").trim()}
function buildSlides(t){const s=subj(t.sid);const d=document.createElement("div");d.innerHTML=t.ex;const out=[{title:s.name,html:`<div class="bigic">${s.icon}</div><div style="text-align:center;font-size:28px;font-weight:900;margin-top:10px">${esc(t.t)}</div><div class="mut" style="text-align:center;margin-top:8px">Lernvideo · Klasse 7</div>`,say:"Hallo! Heute lernst du: "+t.t+". Los geht's!"}];

/* ================= SPRECHEN (Aussprache) ================= */
const SR=window.SpeechRecognition||window.webkitSpeechRecognition||null;
function lev(a,b){const m=a.length,n=b.length;if(!m)return n;if(!n)return m;const d=Array.from({length:m+1},(_,i)=>[i]);for(let j=1;j<=n;j++)d[0][j]=j;for(let i=1;i<=m;i++)for(let j=1;j<=n;j++)d[i][j]=Math.min(d[i-1][j]+1,d[i][j-1]+1,d[i-1][j-1]+(a[i-1]===b[j-1]?0:1));return d[m][n]}
const spN=s=>deacc(String(s).toLowerCase()).replace(/[’'`´\-]/g," ").replace(/[^a-z0-9 ]/g,"").replace(/\s+/g," ").trim();
const stripArt=s=>s.replace(/^(le|la|les|l|un|une|des|the|a|an|to) /,"");
function simil(a,b){a=spN(a);b=spN(b);const c=[[a,b],[stripArt(a),stripArt(b)],[a.replace(/ /g,""),b.replace(/ /g,"")]];return Math.max(...c.map(([x,y])=>{const L=Math.max(x.length,y.length)||1;return 1-lev(x,y)/L}))}
function speakTips(w,L){const x=w.toLowerCase();const t=[];
 if(L==="fr"){if(/eau|au/.test(x))t.push("„eau“ und „au“ spricht man wie ein langes „o“.");if(/oi/.test(x))t.push("„oi“ klingt wie „wa“ (moi → „mwa“).");if(/ou/.test(x))t.push("„ou“ spricht man wie ein deutsches „u“.");else if(/u/.test(x))t.push("Das französische „u“ klingt wie ein deutsches „ü“.");
  if(/(an|en|on|in|un|om|am)(\b|[^aeiouéè])/.test(x))t.push("Nasallaut: bei „an/en/on/in“ das n nicht sprechen, sondern durch die Nase klingen lassen.");if(/ch/.test(x))t.push("„ch“ spricht man wie „sch“.");if(/[stdxp]\b|ent\b/.test(x))t.push("Endbuchstaben wie s, t, d, x, p spricht man meist nicht.");if(/é/.test(x))t.push("„é“ klingt wie ein helles „e“ wie in „See“.");if(/^h|\bh/.test(x))t.push("Das „h“ ist im Französischen stumm.");if(/r/.test(x))t.push("Das französische „r“ kommt hinten aus dem Hals – leicht gegurgelt.");if(/qu/.test(x))t.push("„qu“ spricht man wie „k“.")}
 else{if(/th/.test(x))t.push("„th“: Zungenspitze leicht zwischen die Zähne!");if(/w/.test(x))t.push("Englisches „w“: Lippen rund machen wie bei einem kurzen „u“ – nicht wie deutsches w.");if(/v/.test(x))t.push("Englisches „v“ klingt wie deutsches „w“.");if(/\bkn/.test(x))t.push("Das „k“ in „kn“ ist stumm.");if(/gh/.test(x))t.push("„gh“ ist meistens stumm (thought, night).");if(/r/.test(x))t.push("Englisches „r“: Zunge nicht rollen, sie bleibt hinten im Mund.");if(/ed\b/.test(x))t.push("Endung „-ed“ meist kurz als „d“ oder „t“ sprechen.");if(/\bs/.test(x))t.push("Ein „s“ am Wortanfang ist scharf (stimmlos) wie in „Bus“.")}
 if(!t.length)t.push("Hör dir das Wort nochmal mit 🔊 an und sprich langsam und deutlich.");return t.slice(0,2)}
function spItem(){const set=VOC[V.L].sets.find(s=>s.id===V.sid);return set.w[V.order[V.i%V.order.length]]}

 if(!V.L)return `<h2 style="margin-top:18px">🎤 Aussprache-Training</h2><p class="mut">Hör dir das Wort an, tippe aufs Mikrofon und sprich nach. Grün = richtig, Rot = nochmal mit Tipp.</p>
 ${SR?"":`<div class="card" style="border-color:var(--bad)"><b>⚠️ Spracherkennung wird in diesem Browser nicht unterstützt.</b><p class="mut sm" style="margin-top:6px">iPhone: Safari benutzen und „Diktieren“ einschalten (Einstellungen → Allgemein → Tastatur). Samsung: Google Chrome benutzen.</p></div>`}

 <div class="mut sm">${V.listening?"Ich höre zu … sprich jetzt!":st?"":"Tippe aufs Mikrofon und sprich das Wort."}</div>

 ${st.heard?`<div style="font-weight:600;margin-top:6px">Ich habe verstanden: „${esc(st.heard)}“</div>`:""}
 ${!st.ok?`<div style="font-weight:600;margin-top:8px;text-align:left">💡 Tipps:<ul style="margin:4px 0 0 18px">${speakTips(w[1],V.L).map(x=>`<li>${esc(x)}</li>`).join("")}</ul></div>`:""}</div>
 <div class="row" style="margin-top:12px">${!st.ok?`<button class="btn" style="flex:1" data-a="splisten">🔁 Nochmal</button>`:""}<button class="btn ${st.ok?"ok":"ghost"}" style="flex:1" data-a="spnext">Weiter →</button></div>`:""}</div>
 <div class="fcount">${V.right||0} von ${V.tot||0} richtig ausgesprochen</div>${VOICE_TIP}`};
function spListen(){if(!SR){V.res={ok:false,err:"Spracherkennung wird hier nicht unterstützt. iPhone: Safari · Samsung: Chrome."};rerender();return}
 const w=spItem();let got=false;let r;try{r=new SR()}catch(e){V.res={ok:false,err:"Spracherkennung konnte nicht starten."};rerender();return}
 r.lang=VOC[V.L].lang==="en-GB"?"en-GB":"fr-FR";r.interimResults=false;r.maxAlternatives=5;r.continuous=false;
 r.onresult=e=>{got=true;const alts=[...e.results[0]].map(a=>a.transcript);let best=0,heard=alts[0]||"";alts.forEach(a=>{const s=simil(a,w[1]);if(s>best){best=s;heard=a}});
  V.listening=false;V.tot=(V.tot||0)+1;if(best>=0.8){V.res={ok:true,heard};V.right=(V.right||0)+1;addXP(5,true);toast("+5 XP ⚡",900);bump("speak");try{navigator.vibrate&&navigator.vibrate(60)}catch(e){}}else V.res={ok:false,mid:best>=0.6,heard};rerender()};
 r.onerror=e=>{V.listening=false;const m={"not-allowed":"Mikrofon nicht erlaubt. Bitte in den Browser-Einstellungen das Mikrofon für diese Seite erlauben.","service-not-allowed":"Spracherkennung ist ausgeschaltet. iPhone: Einstellungen → Allgemein → Tastatur → „Diktieren“ einschalten.","no-speech":"Ich habe nichts gehört – sprich etwas lauter.","audio-capture":"Kein Mikrofon gefunden.","network":"Keine Internetverbindung für die Spracherkennung."}[e.error]||"Das hat nicht geklappt – versuch es nochmal.";V.res={ok:false,err:m};rerender()};
 r.onend=()=>{if(!got&&V.listening){V.listening=false;if(!V.res)V.res={ok:false,err:"Ich habe nichts gehört – sprich etwas lauter."};rerender()}};
 V.listening=true;V.res=null;rerender();try{speechSynthesis.cancel()}catch(e){}try{r.start()}catch(e){V.listening=false;V.res={ok:false,err:"Mikrofon ist gerade beschäftigt – kurz warten."};rerender()}}

 const alt=$("#alt");if(alt)alt.textContent=Math.round(Math.sin(Math.PI*p)*11000)+" m";
 document.querySelectorAll(".wsky").forEach(el=>{const h=Math.round(215-p*190);el.style.background=`linear-gradient(180deg,hsl(${h},70%,${55-p*12}%),hsl(${h+20},80%,${75-p*10}%))`})};
{const _fl=VIEWS.flight;VIEWS.flight=()=>{const f=FL();if(!f)return _fl();const left=Math.max(0,Math.round((f.end-Date.now())/1000));const sid=f.sub;const s=subj(sid);
 const win=i=>`<div class="win"><div class="wsky"></div><span class="wc" style="top:${18+i*14}%;animation-delay:-${i*2}s">☁️</span><span class="wc" style="top:${55-i*8}%;animation-delay:-${3+i*2}s;font-size:18px">☁️</span></div>`;
 return `<div class="cabin"><div class="roof"><span></span><span></span><span></span></div><div class="wins">${win(0)}${win(1)}${win(2)}</div>
 <div class="disp"><span>🛫 ${esc(f.from)}</span><div class="route"><i id="routei"></i><b id="plane">✈️</b></div><span>${esc(f.to)} 🛬</span></div>
 <div class="disp"><span style="font-size:13px">Flughöhe<br><span id="alt">0 m</span></span><span class="timer" id="flt">${Math.floor(left/60)}:${pad(left%60)}</span></div>

 ${f.code?`<div class="card"><div class="row" style="justify-content:space-between"><div><div class="sm mut">Flugcode für Freunde</div><div style="font-size:26px;font-weight:900;letter-spacing:3px">${f.code}</div></div><button class="btn ghost sm" data-a="copyCode" data-x="${f.code}">📋 Kopieren</button></div></div>`:""}
 <div class="card"><h3>📚 Bordprogramm: ${subLabel(sid)}</h3><p class="mut sm" style="margin:4px 0 10px">Wähle ein Thema – der Timer läuft weiter.</p>
 ${sid==="vocab"?`<button class="btn full" data-a="go" data-x="vocab">🗂️ Zum Vokabeltrainer</button>`:`<div class="tlist">${s.topics.map(t=>`<button class="titem" data-a="topic" data-x="${t.id}"><span class="num">${s.icon}</span><span class="tt">${esc(t.t)}</span><span class="star">${P.topics[t.id]?P.topics[t.id].best+"%":"neu"}</span></button>`).join("")}</div><button class="btn fire full" style="margin-top:10px" data-a="examStart" data-x="${sid}">📝 Probe-Arbeit an Bord</button>`}</div>
 <button class="btn ghost full" style="margin-top:14px" data-a="flAbort">🪂 Flug abbrechen (kein Bonus)</button>`}}

/* ================= SCHATZTRUHE ================= */
const SVG_CHEST=(xm)=>`<svg viewBox="0 0 120 100"><rect x="14" y="48" width="92" height="46" rx="6" fill="${xm?"#c62828":"#8b5a2b"}" stroke="#5a3415" stroke-width="3"/><rect x="14" y="62" width="92" height="7" fill="#ffcc33"/><rect x="52" y="56" width="16" height="20" rx="3" fill="#ffcc33" stroke="#c9961a" stroke-width="2"/>
 <g class="lid"><path d="M14 52 Q14 22 60 22 Q106 22 106 52 Z" fill="${xm?"#e53935":"#a0682f"}" stroke="#5a3415" stroke-width="3"/><rect x="${xm?57:14}" y="${xm?22:44}" width="${xm?6:92}" height="${xm?30:7}" fill="#ffcc33"/>${xm?`<path d="M60 22 C48 8 40 18 58 22 C76 18 72 8 60 22" fill="#ffcc33" stroke="#c9961a" stroke-width="2"/>`:""}</g></svg>`;
const isXmas=()=>!!window.__xmasTest||new Date().getMonth()===11;
const xDay=()=>window.__xmasTest||new Date().getDate();
function chestReady(){if(P.chestDay===today())return false;return P.lastGoal===today()||(isXmas()&&P.xmas&&P.xmas.done&&P.xmas.done["d"+xDay()])}
function chestCard(){if(P.chestDay===today())return `<div class="card center"><span style="font-size:30px">${isXmas()?"🎁":"🧰"}</span> <b>Truhe heute schon geöffnet</b><div class="mut sm">Morgen gibt es eine neue!</div></div>`;
 if(!chestReady())return `<div class="card" style="display:flex;align-items:center;gap:12px"><div style="width:60px;opacity:.5;filter:grayscale(1)">${SVG_CHEST(isXmas())}</div><div><b>Tägliche Schatztruhe 🔒</b><div class="mut sm">${isXmas()?"Schaffe die Tagesaufgabe oder dein Tagesziel":"Schaffe dein Tagesziel"} (${P.goal} Min), um sie zu öffnen!</div></div></div>`;
 return `<div class="card center" style="border-color:var(--fire2)"><b>${isXmas()?"🎁 Dein Weihnachtsgeschenk wartet!":"🧰 Deine Schatztruhe ist bereit!"}</b><div class="chest shake" data-a="chest">${SVG_CHEST(isXmas())}</div><button class="btn fire" data-a="chest">Öffnen!</button></div>`}
function openChest(){if(!chestReady())return;const xm=isXmas();const coins=rnd(20,60)+(xm?rnd(10,40):0);const piece=xm&&Math.random()<0.25;
 P.chestDay=today();P.coins+=coins;if(piece){P.xmas.pieces=(P.xmas.pieces||0)+1;checkOutfits()}save();renderTop();
 showModal(`<div class="center"><div class="chest" id="mchest" style="width:150px">${SVG_CHEST(xm)}</div><div id="mres" style="opacity:0;transition:opacity .4s"><div class="coinburst">🪙 +${coins}</div>${piece?`<div class="coinburst">🧩 +1 Puzzleteil!</div>`:""}<h3 style="margin-top:6px">${xm?"Frohe Weihnachtszeit! 🎄":"Stark gelernt!"}</h3></div><button class="btn fire full" style="margin-top:14px" data-a="closeModal">Super!</button></div>`);
 setTimeout(()=>{const c=$("#mchest");if(c)c.classList.add("open");const r=$("#mres");if(r)r.style.opacity=1},350);rerender()}

/* ================= WEIHNACHTS-EDITION ================= */
const XTASKS=[{k:"sec",n:600,t:"Lerne 10 Minuten",ic:"⏱"},{k:"tests",n:2,t:"Mache 2 Mini-Tests",ic:"📝"},{k:"vocab",n:15,t:"Beantworte 15 Vokabeln richtig",ic:"🗂️"},{k:"speak",n:5,t:"Sprich 5 Wörter richtig aus",ic:"🎤"},{k:"cards",n:10,t:"Lerne 10 Karteikarten (gewusst)",ic:"🃏"},{k:"flights",n:1,t:"Schließe einen Fokus-Flug ab",ic:"✈️"},{k:"videos",n:1,t:"Schau ein Lernvideo bis zum Ende",ic:"🎬"},{k:"perfect",n:1,t:"Schaffe einen Mini-Test mit 100 %",ic:"💯"},{k:"exams",n:1,t:"Schreib eine Probe-Klassenarbeit",ic:"📚"}];
const xTask=d=>d===24?{k:"sec",n:900,t:"Heiligabend-Special: Lerne 15 Minuten (2 Puzzleteile!)",ic:"🎄"}:XTASKS[(d-1)%XTASKS.length];
function checkOutfits(){const X=P.xmas;X.outfits=X.outfits||[];Object.entries(OUTFITS).forEach(([k,o])=>{if(!X.outfits.includes(k)&&X.pieces>=o.need){X.outfits.push(k);setTimeout(()=>showModal(`<div class="center"><div style="margin:30px 0 10px">${avaHTML(Object.assign({},P.ava,{outfit:k}),110)}</div><h2>${o.ic} ${o.name} freigeschaltet!</h2><p class="mut" style="margin:8px 0 14px">Du hast ${o.need} Puzzleteile gesammelt.</p><button class="btn fire full" data-a="wearOutfit" data-x="${k}">Jetzt anziehen!</button></div>`),900)}})}
function checkXmas(){if(!P||!isXmas())return;const d=xDay();const X=P.xmas||(P.xmas={pieces:0,done:{}});X.done=X.done||{};if(X.done["d"+d])return;const tk=xTask(d);if(dly(tk.k)<tk.n)return;
 X.done["d"+d]=1;const n=d===24?2:1;X.pieces=(X.pieces||0)+n;save();
 showModal(`<div class="center"><div class="big pop">🧩</div><h2>+${n} Puzzleteil${n>1?"e":""}!</h2><p class="mut" style="margin:8px 0 14px">Tagesaufgabe geschafft: ${esc(tk.t)}. Deine Geschenk-Truhe ist jetzt offen! 🎁</p><button class="btn fire full" data-a="goXmas">Zur Weihnachts-Edition 🎄</button></div>`);checkOutfits()}
setInterval(()=>{try{if(P&&isXmas()&&LEARN_VIEWS.includes(V.v))checkXmas()}catch(e){}},5000);
function snowHTML(n){let h="";for(let i=0;i<n;i++)h+=`<span class="snow" style="left:${Math.random()*100}%;animation-duration:${6+Math.random()*8}s;animation-delay:-${Math.random()*10}s;font-size:${10+Math.random()*12}px">❄</span>`;return h}
function xmasBanner(){if(isXmas()){const X=P.xmas||{pieces:0,done:{}};const d=xDay();const tk=xTask(d);const done=X.done&&X.done["d"+d];
  return `<div class="card xmas" data-a="goXmas" style="cursor:pointer">${snowHTML(10)}<div style="position:relative"><b style="font-size:18px">🎄 Weihnachts-Edition</b><div class="sm" style="margin-top:4px">${done?"✅ Heutige Aufgabe geschafft!":tk.ic+" Heute: "+esc(tk.t)}</div><div class="bar" style="margin-top:8px"><i style="width:${Math.min(100,(X.pieces||0)/18*100)}%"></i></div><div class="sm" style="margin-top:4px">🧩 ${X.pieces||0} Puzzleteile · Tippen für mehr →</div></div></div>`}
 const now=new Date();const dec1=new Date(now.getFullYear(),11,1);const days=Math.ceil((dec1-now)/864e5);
 return days>0&&days<=40?`<div class="card xmas" data-a="goXmas" style="cursor:pointer">${snowHTML(8)}<div style="position:relative"><b>🎄 Weihnachts-Edition startet in ${days} ${days===1?"Tag":"Tagen"}!</b><div class="sm" style="margin-top:4px">Ab 1. Dezember: tägliche Aufgaben, Puzzleteile & 2 Outfits für deinen Avatar.</div></div></div>`:""}
VIEWS.xmas=()=>{const X=P.xmas||{pieces:0,done:{}};const pcs=X.pieces||0;
 const prev=`<div class="row" style="justify-content:space-around;margin-top:28px">${Object.entries(OUTFITS).map(([k,o])=>{const own=(X.outfits||[]).includes(k);return `<div class="center">${avaHTML(Object.assign({},P.ava,{outfit:k,acc:""}),80)}<div style="font-weight:900;margin-top:10px">${o.ic} ${o.name}</div><div class="sm">${own?"✅ freigeschaltet":"🧩 "+Math.min(pcs,o.need)+" / "+o.need}</div>${own?`<button class="btn sm ${P.ava.outfit===k?"ok":""}" style="margin-top:6px" data-a="wearOutfit" data-x="${k}">${P.ava.outfit===k?"Angezogen ✓":"Anziehen"}</button>`:""}</div>`}).join("")}</div>`;
 if(!isXmas()){const now=new Date();const days=Math.ceil((new Date(now.getFullYear(),11,1)-now)/864e5);
  return `<div class="card xmas" style="margin-top:18px">${snowHTML(14)}<div style="position:relative"><h2>🎄 Weihnachts-Edition</h2><p style="margin-top:6px">Startet am <b>1. Dezember</b>${days>0?` – noch ${days} Tage`:""}!</p>${prev}
  <ul style="margin:18px 0 0 18px;line-height:1.6"><li>Jeden Tag eine neue Lern-Aufgabe</li><li>Aufgabe geschafft → 🧩 Puzzleteil + 🎁 Geschenk-Truhe mit Münzen</li><li>8 Teile → Wichtel-Outfit 🎅 · 18 Teile → Rentier-Outfit 🦌</li><li>An Heiligabend gibt es doppelte Teile!</li></ul></div></div>`}
 const d=xDay();const tk=xTask(d);const done=X.done&&X.done["d"+d];const prog=Math.min(tk.n,dly(tk.k));
 let cal="";for(let i=1;i<=31;i++)cal+=`<div class="${X.done&&X.done["d"+i]?"done":""} ${i===d?"today":""}">${X.done&&X.done["d"+i]?"✓":i}</div>`;
 let puz="";for(let i=0;i<18;i++)puz+=`<div class="${i<pcs?"got":""}">${i<pcs?"🧩":""}</div>`;
 return `<div class="card xmas" style="margin-top:18px">${snowHTML(16)}<div style="position:relative"><h2>🎄 Weihnachts-Edition</h2><div class="sm">${d}. Dezember</div>
 <div class="card" style="background:#0005;margin-top:12px"><b>${tk.ic} Aufgabe von heute</b><p style="margin:6px 0">${esc(tk.t)}</p><div class="bar" style="height:12px"><i style="width:${prog/tk.n*100}%"></i></div><div class="sm" style="margin-top:4px">${done?"✅ Geschafft! Puzzleteil erhalten.":(tk.k==="sec"?Math.floor(prog/60)+" / "+tk.n/60+" Min":prog+" / "+tk.n)}</div></div>
 ${prev}<h3 style="margin-top:18px">🧩 Dein Puzzle (${pcs} / 18)</h3><div class="puz">${puz}</div>
 <h3 style="margin-top:18px">📅 Adventskalender</h3><div class="cal">${cal}</div></div></div>${chestCard()}`};
{const _h=VIEWS.home;VIEWS.home=()=>xmasBanner()+chestCard()+_h()}
{const _m=VIEWS.me;VIEWS.me=()=>{const X=P.xmas||{};const own=X.outfits||[];const h=_m();const card=own.length?`<div class="card"><h3>🎄 Weihnachts-Outfits</h3><div class="shop"><button class="${!P.ava.outfit?"eq":""}" data-a="wearOutfit" data-x=""><span class="e">🚫</span>keins</button>${own.map(k=>`<button class="${P.ava.outfit===k?"eq":""}" data-a="wearOutfit" data-x="${k}"><span class="e">${OUTFITS[k].ic}</span>${OUTFITS[k].name}</button>`).join("")}</div></div>`:"";return h.replace('<div class="card"><h3>🐾 Avatar</h3>',card+'<div class="card"><h3>🐾 Avatar</h3>')}}

Object.assign(ACT,{
 video:x=>{const t=TOPIC[x];V={v:"video",tid:x,slides:buildSlides(t),si:0,playing:true,vDone:false};window.__vidOn=true;render();playSlide()},

 topic2:x=>{V={v:"topic",tid:x,tab:"exp"};startPractice();render()},
 quizStart2:x=>{V={v:"topic",tid:x};startTest();render()},
 spset:x=>{const[L,s]=x.split("|");const set=VOC[L].sets.find(z=>z.id===s);V={v:"speak",L,sid:s,order:shuffle(set.w.map((_,i)=>i)),i:0,res:null,right:0,tot:0};render()},

 spnext:()=>{V.i++;V.res=null;rerender();setTimeout(()=>{try{sayText(spItem()[1],VOC[V.L].lang)}catch(e){}},250)},
 cexp:x=>{V.open=V.open===x?null:x;rerender()},
 cdeck:x=>{startDeck(x);render()},
 cback:()=>{V={v:"cards"};render()},
 cflip:()=>{V.flip=!V.flip;rerender()},
 cres:x=>{const ok=x==="1";const id=V.order[V.i%V.order.length];P.cbox=P.cbox||{};const bx=P.cbox[V.deck]||{};bx[id]=ok?Math.min(5,(bx[id]||0)+1):1;P.cbox[V.deck]=bx;V.seen++;if(ok){V.known++;addXP(3,true);bump("cards")}else save();V.i++;V.flip=false;if(V.i%V.order.length===0)toast("🔁 Stapel einmal durch! Schwierige Karten kommen zuerst.");rerender()},
 cdel:x=>{P.mycards=(P.mycards||[]).filter((_,i)=>i!==+x);save();if(!P.mycards.length){V={v:"cards"};render()}else{startDeck("my");render()}},
 chest:()=>openChest(),
 goXmas:()=>{closeModal();V={v:"xmas"};render()},
 wearOutfit:x=>{P.ava.outfit=x||"";save();closeModal();toast(x?"🎄 Outfit angezogen!":"Outfit ausgezogen");rerender();presence()}
});
{const _go=ACT.go;ACT.go=(x,e)=>{if(x==="speak"||x==="cards"||x==="videos"){V={v:x};render();presence();return}_go(x,e)}}
document.addEventListener("submit",e=>{if(e.target.dataset.f==="newcard"){e.preventDefault();const f=($("#cf").value||"").trim(),b=($("#cb").value||"").trim();if(!f||!b)return toast("Bitte Vorder- und Rückseite ausfüllen");P.mycards=P.mycards||[];P.mycards.push({f,b});save();toast("✅ Karte gespeichert");rerender()}});

.chart span{font-size:10px;color:var(--mut);font-weight:800;margin-top:4px}
.seg{display:inline-flex;background:var(--bg2);border-radius:12px;padding:3px;border:1px solid var(--line)}
.seg button{padding:5px 10px;border-radius:9px;font-size:12px;font-weight:800;color:var(--mut)}
.seg button.on{background:var(--acc);color:#fff}
.sc{border-radius:20px;padding:14px;color:#fff;text-align:left;display:flex;flex-direction:column;gap:6px;min-height:150px;position:relative;overflow:hidden}

.sc .t{font-weight:900;font-size:17px}

.mcal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin-top:10px;text-align:center}
.mcal b{font-size:10px;color:var(--mut)}
.mcal div{aspect-ratio:1;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:800;position:relative}
.mcal div.l{background:linear-gradient(135deg,#a78bff,#7c5cff);color:#fff}
.mcal div.t{outline:2px solid var(--fire)}
.mcal div.x::after{content:"";position:absolute;bottom:3px;width:6px;height:6px;border-radius:50%;background:#ff5d73}
.next{display:flex;align-items:center;gap:12px;background:var(--bg2);border:1px solid var(--line);border-radius:16px;padding:10px 12px;margin-top:8px;text-align:left;width:100%}
.next .dd{width:52px;text-align:center;border-radius:12px;background:#fff;padding:4px;box-shadow:0 2px 8px #7c5cff22;flex-shrink:0}
.next .dd b{display:block;font-size:20px;color:var(--acc)}
.next .dd span{font-size:10px;font-weight:900;color:var(--mut)}
.can{display:flex;gap:10px;align-items:flex-start;padding:8px 0;border-bottom:1px dashed var(--line);text-align:left;width:100%}
.plan{border-left:3px solid var(--line);margin-left:8px;padding-left:14px}
.plan .pd{position:relative;padding:8px 0}
.plan .pd::before{content:"";position:absolute;left:-22px;top:14px;width:13px;height:13px;border-radius:50%;background:var(--line);border:2px solid #fff}
.plan .pd.now::before{background:var(--fire)}
.plan .pd.ok::before{background:var(--ok)}
.thumbs{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
.thumbs img,.thumbs .ph{width:76px;height:76px;object-fit:cover;border-radius:12px;background:var(--card2);border:1px solid var(--line)}
.paper{background:#fffdf5;color:#2b2540;border-radius:16px;padding:20px 18px;margin-top:14px;box-shadow:0 10px 30px #0002;background-image:repeating-linear-gradient(180deg,transparent 0 27px,#e6ecff 27px 28px);line-height:28px}
.paper h2{color:#7c5cff;font-size:22px;line-height:1.3;margin-bottom:6px}
.paper h3{font-size:16px;margin-top:10px;line-height:28px}
.paper h3 span{background:linear-gradient(transparent 55%,#fff176 55%)}
.paper .ex,.paper .tip{background:#ffffffcc;border:2px solid #d9ceff;border-radius:10px;padding:6px 10px;margin:6px 0;line-height:1.5}
.paper ul{margin-left:20px}
.paper table{border-collapse:collapse;line-height:1.4;font-size:14px;margin:6px 0}
.paper td,.paper th{border:1px solid #d9ceff;padding:4px 6px}
.chat{display:flex;flex-direction:column;gap:10px;margin-top:14px;padding-bottom:10px}
.msg{max-width:86%;padding:10px 14px;border-radius:18px;line-height:1.45;font-size:15px;animation:tin .25s}
.msg.bot{background:#fff;border:1px solid var(--line);border-bottom-left-radius:6px;align-self:flex-start;box-shadow:0 4px 14px #7c5cff12}
html:not(.light) .msg.bot{background:var(--card)}
.msg.me{background:linear-gradient(135deg,var(--acc),#a35cff);color:#fff;border-bottom-right-radius:6px;align-self:flex-end}
.msg .acts{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.msg .acts button,.msg .acts a{background:var(--card2);color:var(--txt);border-radius:10px;padding:6px 10px;font-size:13px;font-weight:800;text-decoration:none}
.chips2{display:flex;gap:6px;overflow-x:auto;padding:6px 0;scrollbar-width:none}
.chips2 button{white-space:nowrap;background:#fff;border:1px solid var(--line);border-radius:999px;padding:7px 12px;font-size:13px;font-weight:800;color:var(--txt)}
.chatin{position:sticky;bottom:78px;background:var(--bg);padding:8px 0;z-index:5}
#coachfab{position:fixed;right:14px;bottom:calc(84px + env(safe-area-inset-bottom));z-index:29;width:58px;height:58px;border-radius:50%;font-size:30px;background:linear-gradient(135deg,#ffb347,#ff7a18);box-shadow:0 8px 24px #ff7a1866,0 3px 0 #a34a00;display:flex;align-items:center;justify-content:center;animation:fly 3s ease-in-out infinite}
#coachfab span{position:absolute;top:-4px;right:-4px;background:#ff5d73;color:#fff;font-size:11px;font-weight:900;border-radius:10px;padding:1px 6px}
.conf{position:fixed;top:-20px;z-index:120;width:10px;height:14px;border-radius:2px;pointer-events:none;animation:cf 1.8s ease-in forwards}
@keyframes cf{to{transform:translateY(105vh) rotate(720deg);opacity:.7}}
.combo{position:fixed;left:50%;top:40%;transform:translate(-50%,-50%);z-index:110;font-size:34px;font-weight:900;color:#ff7a18;text-shadow:0 4px 0 #fff,0 8px 20px #ff7a1866;pointer-events:none;animation:cmb 1.2s forwards}
@keyframes cmb{0%{transform:translate(-50%,-50%) scale(.3);opacity:0}30%{transform:translate(-50%,-50%) scale(1.2);opacity:1}100%{transform:translate(-50%,-90%) scale(1);opacity:0}}
@media (min-width:760px){
 .wrap{max-width:1100px}.topin{max-width:1100px}
 .dash{display:grid;grid-template-columns:1.35fr 1fr;gap:0 16px;align-items:start}
 .dash .full{grid-column:1/-1}
 .tlist{display:grid;grid-template-columns:1fr 1fr}
 .sgrid{grid-template-columns:repeat(4,1fr)!important}
 .nav{left:50%;right:auto;transform:translateX(-50%);bottom:12px;border-radius:22px;border:1px solid var(--line);width:560px;padding:6px}
 #coachfab{bottom:24px;right:24px}
 .chatin{bottom:84px}
}
@media (orientation:landscape) and (max-height:520px){
 .nav{padding:3px 4px calc(3px + env(safe-area-inset-bottom))}
 .nav button{flex-direction:row;gap:6px;padding:4px 0}
 .nav button b{font-size:18px}
 .wrap{padding-bottom:70px}
 #coachfab{bottom:58px;width:48px;height:48px;font-size:24px}
 .chatin{bottom:52px}
