 flPresence()}catch(e){}}

 ${others.length?`<div class="card"><h3>Weitere Lernende hier</h3><div class="list">${others.map(([id,p])=>`<div class="li">${avaHTML(p.ava,36)}<div class="grow"><div class="nm">${esc(p.name)} ${onlineOf(id)}</div><div class="sm mut">🔥 ${liveStreak(p)} · Lvl ${lvlOf(p.xp||0)}</div></div><button class="btn sm" data-a="addId" data-x="${esc(id)}">➕</button></div>`).join("")}</div></div>`:""}
 <div class="card"><h3>✈️ Gemeinsam lernen</h3><p class="mut sm" style="margin:6px 0 10px">Starte einen Fokus-Flug und schick deiner Freundin den Flugcode. Ihr seht euch dann gegenseitig im Flugzeug sitzen.</p><button class="btn full" data-a="go" data-x="flight">Zum Flughafen 🛫</button></div>`};
function weekSec(p){let s=0;for(let i=0;i<7;i++)s+=((p.days||{})[addDays(today(),-i)]||0);return s}
function liveStreak(p){const t=today();return p.lastGoal===t||p.lastGoal===addDays(t,-1)?(p.streak||0):0}
function onlineOf(id){const o=ONLINE[id];if(!o)return "";return o.fl?`<span class="pill on">✈️ fliegt</span>`:`<span class="pill on">● online</span>`}

/* ---------- Me / Shop ---------- */
VIEWS.me=()=>{const lv=lvlOf(P.xp);
 return `<div class="card center" style="margin-top:18px">${avaHTML(P.ava,110)}<h2 style="margin-top:10px">${esc(P.name)}</h2><p class="mut">Level ${lv} · ${rankName(lv)} · ${P.xp} XP</p>
 <div class="row" style="margin-top:12px"><div class="stat"><b>🔥 ${streakAlive()}</b><span>Serie</span></div><div class="stat"><b>🧊 ${P.freezes||0}</b><span>Flammen-Schutz</span></div><div class="stat"><b>🪙 ${P.coins}</b><span>Münzen</span></div></div></div>
 <div class="card"><h3>✏️ Name</h3><form data-f="rename" class="inp-row" style="margin-top:8px"><input id="rn" value="${esc(P.name)}" maxlength="20"><button class="btn sm">Speichern</button></form></div>
 <div class="card"><h3>🐾 Avatar</h3><div class="shop">${ANIMALS.map(e=>`<button class="${P.ava.e===e?"eq":""}" data-a="setAni" data-x="${e}"><span class="e">${e}</span>gratis</button>`).join("")}${Object.entries(PREMIUM).map(([e,c])=>{const own=P.owned.includes(e);return `<button class="${P.ava.e===e?"eq":own?"own":""}" data-a="buyAni" data-x="${e}"><span class="e">${e}</span>${own?"✔":"🪙 "+c}</button>`}).join("")}</div>
 <h3 style="margin-top:14px">🎨 Farbe</h3><div class="colors">${COLORS.map((c,i)=>`<button style="background:${c}" class="${P.ava.c===i?"on":""}" data-a="setCol" data-x="${i}"></button>`).join("")}</div>
 <h3 style="margin-top:14px">👒 Accessoires</h3><div class="shop"><button class="${!P.ava.acc?"eq":""}" data-a="setAcc" data-x=""><span class="e">🚫</span>keins</button>${ACCS.map(([e,c])=>{const own=P.owned.includes(e);return `<button class="${P.ava.acc===e?"eq":own?"own":""}" data-a="buyAcc" data-x="${e}"><span class="e">${e}</span>${own?"✔":"🪙 "+c}</button>`}).join("")}</div></div>
 <div class="card"><h3>🧊 Flammen-Schutz</h3><p class="mut sm" style="margin:6px 0 10px">Rettet deine Serie, wenn du einen Tag verpasst (max. 3).</p><button class="btn" data-a="buyFreeze" ${(P.freezes||0)>=3?"disabled":""}>Kaufen für 🪙 300</button></div>
 <div class="card"><h3>📊 Statistik</h3><div class="list">
 <div class="li"><span>⏱</span><div class="grow">Gesamt gelernt</div><b>${fmtMin(P.totalSec||0)}</b></div>
 <div class="li"><span>📅</span><div class="grow">Diese Woche</div><b>${fmtMin(weekSec(P))}</b></div>
 <div class="li"><span>📝</span><div class="grow">Mini-Tests gemacht</div><b>${Object.values(P.topics).reduce((n,t)=>n+(t.n||0),0)}</b></div>
 <div class="li"><span>✈️</span><div class="grow">Fokus-Flüge</div><b>${P.flights||0}</b></div></div>
 ${P.exams.length?`<h3 style="margin-top:14px">Letzte Probe-Arbeiten</h3><div class="list">${P.exams.slice(0,8).map(e=>`<div class="li"><span>${subj(e.s)?subj(e.s).icon:"📝"}</span><div class="grow">${subj(e.s)?subj(e.s).name:""} <span class="sm mut">${e.d}</span></div><b>Note ${e.g}</b></div>`).join("")}</div>`:""}</div>
 <div class="card sm mut">${MODE==="cloud"?(CLOUD_RO?"☁️ Nur Geräte-Speicherung (Cloud-Schreibrecht fehlt).":"☁️ Mit Google angemeldet – Fortschritt wird online gespeichert."):"📱 Geräte-Modus – Fortschritt wird in diesem Browser gespeichert."}
 <div style="margin-top:10px"><button class="btn ghost sm" data-a="logout">Abmelden / Konto wechseln</button></div></div>`};

/* ========== Modal ========== */
function showModal(h){$("#modal").innerHTML=`<div class="modal" data-a="closeModalBg"><div class="card">${h}</div></div>`}
function closeModal(){$("#modal").innerHTML=""}

/* ========== Events ========== */
const ACT={
 go:x=>{const f=FL();if(f&&(x==="friends"||x==="home")){toast("🔒 Im Flug nicht verfügbar – bleib fokussiert!");return}
  if(x==="vocab")V={v:"vocab"};else V={v:x};render();presence()},
 subject:x=>{const f=FL();if(f&&f.sub!==x&&f.sub!=="vocab"){toast("🔒 Im Flug nur dein Bordfach");return}V={v:"subject",sid:x};render();presence()},
 topic:x=>{const f=FL();if(f&&f.sub!=="vocab"&&TOPIC[x].sid!==f.sub){toast("🔒 Im Flug nur dein Bordfach");return}V={v:"topic",tid:x,tab:"exp"};render();presence()},
 tab:x=>{if(x==="prac"){startPractice()}else V.tab=x;rerender()},
 pick:x=>{V.sel=+x;if(V.v==="topic")answer();else rerender()},
 pracNext:()=>{nextPracQ();V.typed="";rerender()},
 quizStart:x=>{if(x==="again"){V={v:"topic",tid:V.tid}}startTest();render()},
 testNext:()=>testNext(),
 examStart:x=>{startExam(x);render()},
 exTog:x=>{const i=V.sel.indexOf(x);if(i>=0)V.sel.splice(i,1);else V.sel.push(x);V.n=+$("#exn").value;V.min=+$("#exm").value;rerender()},
 exGo:()=>{examGo();render()},
 vset:x=>{const[L,s]=x.split("|");vStart(L,s,"card");render()},
 vmode:x=>{V.mode=x;V.flip=false;V.answered=false;V.opts=null;V.typed="";rerender()},
 vdir:()=>{V.dir=V.dir==="de"?"fx":"de";V.flip=false;V.answered=false;V.opts=null;rerender()},
 vflip:()=>{V.flip=!V.flip;rerender();if(V.flip&&V.dir==="de")speak()},
 vres:x=>{vRecord(x==="1");vNext();rerender()},
 vpick:x=>{const[s,w]=vWord();const back=V.dir==="de"?w[1]:w[0];V.pick=x;V.answered=true;vRecord(x===back);rerender()},
 vnext:()=>{vNext();rerender()},
 vskip:()=>{V.typed="";V.answered=true;vRecord(false);rerender()},
 vchar:x=>{const i=$("#ans");if(i){i.value+=x;V.typed=i.value;i.focus()}},
 speak:()=>speak(),
 durSet:x=>{V.dur=+x;V.fsub=$("#flsub").value;V.fcode=$("#flcode").value;rerender()},
 flStart:()=>flStart(),
 flAbort:()=>{showModal(`<div class="center"><div class="big">🪂</div><h3>Flug wirklich abbrechen?</h3><p class="mut" style="margin:8px 0 14px">Deine Lernzeit bleibt gespeichert, aber du bekommst keinen Flug-Bonus.</p><div class="row"><button class="btn ghost" style="flex:1" data-a="closeModal">Weiterfliegen</button><button class="btn fire" style="flex:1" data-a="flAbortYes">Abbrechen</button></div></div>`)},
 flAbortYes:()=>{setFL(null);try{flRoom&&flRoom.leave()}catch(e){}flRoom=null;flPeers=[];closeModal();try{document.fullscreenElement&&document.exitFullscreen()}catch(e){}V={v:"home"};render()},
 copyCode:x=>{try{navigator.clipboard.writeText(x).then(()=>toast("📋 Kopiert: "+x),()=>toast("Code: "+x))}catch(e){toast("Code: "+x)}},
 addId:x=>{if(!P.friends.includes(x)){P.friends.push(x);save();checkBadges();toast("🤝 Freund hinzugefügt!");rerender()}},
 goalSet:()=>showModal(`<h3>🎯 Tagesziel</h3><p class="mut sm" style="margin:6px 0 12px">Wie viele Minuten willst du jeden Tag lernen? Schaffst du es, brennt deine Flamme weiter.</p><div class="shop">${[5,10,15,20,30,45,60].map(n=>`<button class="${P.goal===n?"eq":""}" data-a="goalPick" data-x="${n}"><span class="e">${n<=10?"🌱":n<=20?"🔥":n<=30?"🚀":"🌋"}</span>${n} Min</button>`).join("")}</div>`),
 goalPick:x=>{P.goal=+x;save();closeModal();rerender();toast("🎯 Tagesziel: "+x+" Min")},
 closeModal:()=>closeModal(),
 closeModalBg:(x,e)=>{if(e.target.classList.contains("modal"))closeModal()},
 setAni:x=>{P.ava.e=x;save();rerender()},
 setCol:x=>{P.ava.c=+x;save();rerender()},
 setAcc:x=>{P.ava.acc=x;save();rerender()},
 buyAni:x=>{if(P.owned.includes(x)){P.ava.e=x}else{const c=PREMIUM[x];if(P.coins<c)return toast("🪙 Nicht genug Münzen – lern weiter!");P.coins-=c;P.owned.push(x);P.ava.e=x;toast("🎉 Neuer Avatar!")}save();rerender()},
 buyAcc:x=>{if(P.owned.includes(x)){P.ava.acc=x}else{const c=ACCS.find(a=>a[0]===x)[1];if(P.coins<c)return toast("🪙 Nicht genug Münzen – lern weiter!");P.coins-=c;P.owned.push(x);P.ava.acc=x;toast("🎉 Gekauft!")}save();rerender()},
 buyFreeze:()=>{if(P.coins<300)return toast("🪙 Nicht genug Münzen");P.coins-=300;P.freezes=(P.freezes||0)+1;save();toast("🧊 Flammen-Schutz gekauft!");rerender()},
 logout:async()=>{saveLocal();try{await cloudSave()}catch(e){}try{ROOM&&ROOM.leave()}catch(e){}try{if(MODE==="cloud")await firebase.auth().signOut()}catch(e){}P=null;location.reload()},
 gLogin:()=>gLogin(),
 localMode:()=>{MODE="local";renderLocalLogin()},
 obAni:x=>{V.ava.e=x;const n=$("#oname").value;renderOnboard();$("#oname").value=n},
 obCol:x=>{V.ava.c=+x;const n=$("#oname").value;renderOnboard();$("#oname").value=n},
 obGo:()=>{const n=($("#oname").value||"").trim();if(!n)return toast("Bitte gib einen Namen ein");const loc=lsGet("lf7_c_"+UID);P=loc||newProfile(n,V.ava);P.name=n;P.ava=V.ava;save();startApp();toast("✈️ Willkommen an Bord, "+esc(n)+"!")},
 localNew:()=>{const n=($("#lname").value||"").trim().slice(0,20);const pin=($("#lpin").value||"").trim();if(!n)return toast("Bitte Namen eingeben");const acc=lsGet("lf7_accounts")||{};if(acc[n])return toast("Den Namen gibt es schon auf diesem Gerät");
  acc[n]={ava:{e:"🦊",c:0},streak:0,pin};lsSet("lf7_accounts",acc);lsSet("lf7_l_"+n,newProfile(n,{e:ANIMALS[rnd(0,ANIMALS.length-1)],c:rnd(0,COLORS.length-1)}));localUse(n);V={v:"me"};render();toast("🎉 Profil erstellt! Gestalte deinen Avatar.")},
 localPick:x=>{const acc=lsGet("lf7_accounts")||{};const a=acc[x];if(a&&a.pin){showModal(`<h3>🔒 PIN für ${esc(x)}</h3><form data-f="pin" data-x="${esc(x)}" class="inp-row" style="margin-top:10px"><input id="pinin" inputmode="numeric" maxlength="4" placeholder="PIN"><button class="btn sm">OK</button></form>`);setTimeout(()=>$("#pinin")&&$("#pinin").focus(),50);return}localUse(x)},
};
document.addEventListener("click",e=>{const el=e.target.closest("[data-a]");if(!el)return;const a=el.dataset.a;if(ACT[a]){if(el.tagName==="BUTTON"&&el.closest("form")&&el.type==="submit")return;e.preventDefault();ACT[a](el.dataset.x,e)}});
document.addEventListener("input",e=>{const t=e.target;if(t.id==="ans")V.typed=t.value;if(t.dataset.in==="dur"){V.dur=+t.value;const l=$("#durl");if(l)l.textContent=t.value+" Min"}});
document.addEventListener("change",e=>{const t=e.target;if(t.dataset&&t.dataset.in==="dur"){V.dur=+t.value;V.fsub=$("#flsub").value;V.fcode=$("#flcode").value;rerender()}});
document.addEventListener("submit",e=>{e.preventDefault();const f=e.target.dataset.f;
 if(f==="ans"){V.typed=$("#ans").value;if(!V.typed.trim())return;if(V.v==="topic")answer();else testNext()}
 if(f==="vans"){V.typed=$("#ans").value;if(!V.typed.trim())return;const[s,w]=vWord();const back=V.dir==="de"?w[1]:w[0];V.answered=true;vRecord(vCheck(back));rerender()}
 if(f==="addf"){const c=($("#fcode").value||"").trim().toUpperCase();const hit=Object.entries(ALLP).find(([id,p])=>p.code===c&&id!==UID);if(!hit)return toast("Code nicht gefunden – hat deine Freundin die Seite schon geöffnet?");ACT.addId(hit[0])}
 if(f==="rename"){const n=($("#rn").value||"").trim().slice(0,20);if(n&&MODE==="cloud"){P.name=n;save();toast("Gespeichert");rerender()}else if(n){toast("Im Geräte-Modus ist der Name fest.")}}
 if(f==="pin"){const name=e.target.dataset.x;const acc=lsGet("lf7_accounts")||{};if(($("#pinin").value||"")===acc[name].pin){closeModal();localUse(name)}else toast("❌ Falsche PIN")}
});
init();
</script>
</body>
</html>
