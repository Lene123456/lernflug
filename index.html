 .vid{min-height:240px}
}
@media print{.top,.nav,#coachfab,#fbar,.noprint{display:none!important}.wrap{padding:0}body{background:#fff!important}.paper{box-shadow:none}}
</style>
<script>
"use strict";
/* ---------- Theme ---------- */
document.documentElement.classList.add("light");
function applyTheme(){if(P&&P.theme==="dark")document.documentElement.classList.remove("light");else document.documentElement.classList.add("light")}

/* ---------- Konfetti & Combo ---------- */
function confetti(n){n=n||60;const cs=["#7c5cff","#ff7a18","#ffcc33","#2ee59d","#ff5d73","#3fa9ff"];for(let i=0;i<n;i++){const s=document.createElement("span");s.className="conf";s.style.left=Math.random()*100+"vw";s.style.background=cs[i%cs.length];s.style.animationDelay=Math.random()*.5+"s";s.style.animationDuration=1.4+Math.random()*1.2+"s";document.body.appendChild(s);setTimeout(()=>s.remove(),3200)}}
function comboFx(txt){const d=document.createElement("div");d.className="combo";d.textContent=txt;document.body.appendChild(d);setTimeout(()=>d.remove(),1300)}

/* ---------- Zeit pro Fach ---------- */
function curSub(){try{if(V.sid&&subj(V.sid))return V.sid;if(V.tid&&TOPIC[V.tid])return TOPIC[V.tid].sid;if(["vocab","vocset","speak"].includes(V.v))return V.L||"vocab";const f=FL();if(f&&f.sub)return f.sub}catch(e){}return null}
setInterval(()=>{if(!P)return;const fl=FL();if(document.visibilityState==="visible"&&(LEARN_VIEWS.includes(V.v)||fl)&&(Date.now()-lastAct<120000||fl)){const s=curSub();if(s&&s!=="vocab"){P.subSec=P.subSec||{};P.subSec[s]=(P.subSec[s]||0)+1}}},1000);
LEARN_VIEWS.push("tests","test","zettel");

/* ---------- Tages-Quests ---------- */
const QPOOL=[{k:"sec",n:300,t:"5 Minuten lernen",ic:"⏱",xp:15},{k:"tests",n:1,t:"Einen Mini-Test machen",ic:"📝",xp:20},{k:"vocab",n:10,t:"10 Vokabeln richtig",ic:"🗂️",xp:15},{k:"cards",n:5,t:"5 Karteikarten gewusst",ic:"🃏",xp:10},{k:"speak",n:3,t:"3 Wörter richtig aussprechen",ic:"🎤",xp:15},{k:"videos",n:1,t:"Ein Lernvideo ansehen",ic:"🎬",xp:15},{k:"prac",n:8,t:"8 Übungsaufgaben richtig",ic:"✏️",xp:15},{k:"perfect",n:1,t:"100 % in einem Mini-Test",ic:"💯",xp:30},{k:"sec",n:900,t:"15 Minuten lernen",ic:"🚀",xp:25},{k:"flights",n:1,t:"Einen Fokus-Flug schaffen",ic:"✈️",xp:25}];
function todaysQuests(){const t=today();let h=0;for(const c of t)h=(h*31+c.charCodeAt(0))>>>0;const idx=[];let i=h;while(idx.length<3){const k=i%QPOOL.length;if(!idx.includes(k))idx.push(k);i=Math.floor(i/3)+7*idx.length+1}return idx.map(k=>Object.assign({id:k},QPOOL[k]))}
function checkQuests(){if(!P)return;const t=today();if(!P.qd||P.qd.d!==t)P.qd={d:t,got:[]};let any=false;todaysQuests().forEach(q=>{if(!P.qd.got.includes(q.id)&&dly(q.k)>=q.n){P.qd.got.push(q.id);any=true;setTimeout(()=>{toast(`✅ Quest geschafft: ${q.ic} ${q.t} · +${q.xp} XP`,3200);confetti(40)},300);addXP(q.xp,true)}});
 if(any&&P.qd.got.length===3&&!P.qd.all){P.qd.all=1;P.coins+=50;setTimeout(()=>showModal(`<div class="center"><div class="big pop">🏆</div><h2>Alle Tages-Quests geschafft!</h2><p class="mut" style="margin:8px 0 14px">Bonus: +50 🪙 Münzen. Du bist richtig stark heute!</p><button class="btn fire full" data-a="closeModal">Weiter so! 💪</button></div>`),1400)}
 if(any)save()}
{const _b=window.bump;window.bump=function(k,n){_b(k,n);checkQuests()}}
setInterval(()=>{try{if(P&&LEARN_VIEWS.includes(V.v))checkQuests()}catch(e){}},10000);

/* ---------- Combo beim Üben ---------- */
{const _a=window.answer;window.answer=function(){const was=V.answered;_a();if(!was&&V.answered&&V.v==="topic"){if(V.lastOk){bump("prac");V.combo=(V.combo||0)+1;if(V.combo>=3){comboFx(`🔥 ${V.combo}er-Combo!`);if(V.combo%3===0){addXP(5,true);confetti(25)}}}else V.combo=0}}}
{const _f=window.finishTest;window.finishTest=function(){_f();if(V.pct===100)setTimeout(()=>confetti(90),300);else if(V.pct>=80)setTimeout(()=>confetti(40),300)}}
{const _g=window.goalReached;window.goalReached=function(){_g();confetti(80)}}

/* ---------- Coach-Sprüche ---------- */
function coachSays(){const s=streakAlive();const tm=Math.floor(todaySec()/60);const nt=nextTest();const n=P.name;
 const l=[];
 if(nt){const d=daysUntil(nt.d);l.push(d<=0?`Heute ist ${nt.title} in ${subj(nt.s).name}! Du schaffst das – atme tief durch. 💪`:`Noch ${d} ${d===1?"Tag":"Tage"} bis ${nt.title} in ${subj(nt.s).name}. Schau in deinen Lernplan!`)}
 if(P.lastGoal!==today())l.push(tm===0?`Hey ${n}! Schon 5 Minuten reichen für den Anfang. Los geht's! 🚀`:`Noch ${Math.max(1,P.goal-tm)} Minuten, dann brennt deine Flamme heute! 🔥`);
 else l.push(`Tagesziel geschafft – du bist der Hammer, ${n}! 🎉`);
 if(s>=3)l.push(`${s} Tage am Stück – lass die Flamme nicht ausgehen! 🔥`);
 l.push("Tipp: Erst Video schauen, dann üben, dann Mini-Test – so bleibt es am besten hängen. 🧠","Kleine Pausen helfen: 25 Minuten lernen, 5 Minuten Pause. ✈️","Fehler sind gut – genau daraus lernt dein Gehirn am meisten! 💡");
 return l[0]}

/* ---------- Tests ---------- */
const daysUntil=d=>Math.round((new Date(d+"T12:00")-new Date(today()+"T12:00"))/864e5);
const fmtDate=d=>{const x=new Date(d+"T12:00");return ["So","Mo","Di","Mi","Do","Fr","Sa"][x.getDay()]+" "+x.getDate()+"."+(x.getMonth()+1)+"."};
function myTests(){return(P.tests||[]).slice().sort((a,b)=>a.d<b.d?-1:1)}
function nextTest(){return myTests().find(t=>daysUntil(t.d)>=0)}
function testProg(t){if(!t.topics.length)return 0;return Math.round(t.topics.filter(id=>P.topics[id]&&P.topics[id].best>=80).length/t.topics.length*100)}
function canDo(id){const t=TOPIC[id];const d=document.createElement("div");d.innerHTML=t.ex;let h=[...d.querySelectorAll("h4")].map(x=>x.textContent.trim()).filter(x=>!/^beispiel/i.test(x));if(!h.length)h=[...d.querySelectorAll("li")].slice(0,3).map(x=>x.textContent.replace(/:.*/,"").trim());return h.slice(0,5)}
function planFor(t){const days=Math.max(1,daysUntil(t.d));const T=t.topics.slice();const out=[];const learnDays=Math.max(1,days-(days>=3?2:days>=2?1:0));
 const per=Math.ceil(T.length/learnDays)||1;for(let i=0;i<learnDays;i++){const part=T.slice(i*per,i*per+per);out.push({d:addDays(today(),i),type:part.length?"learn":"rep",topics:part})}
 if(days>=3)out.push({d:addDays(today(),days-2),type:"exam",topics:T});if(days>=2)out.push({d:addDays(today(),days-1),type:"zettel",topics:T});return out}
VIEWS.tests=()=>{const ts=myTests();const up=ts.filter(t=>daysUntil(t.d)>=0),past=ts.filter(t=>daysUntil(t.d)<0);
 return `<h2 style="margin-top:18px">📅 Meine Tests & Arbeiten</h2><p class="mut">Trag deine nächsten Tests ein – ich zeige dir, was du können musst, und mache dir einen Lernplan bis zum Tag X.</p>
 <button class="btn fire full" style="margin-top:12px" data-a="newtest" data-x="">➕ Test hinzufügen</button>
 ${up.length?`<div class="card">${up.map(t=>testRow(t)).join("")}</div>`:`<div class="card center mut">Noch keine Tests eingetragen.</div>`}
 ${past.length?`<div class="card"><h3>Vergangene Tests</h3>${past.map(t=>testRow(t)).join("")}</div>`:""}`};
function testRow(t){const s=subj(t.s);const d=daysUntil(t.d);const x=new Date(t.d+"T12:00");return `<button class="next" data-a="opentest" data-x="${t.id}"><div class="dd"><b>${x.getDate()}</b><span>${["JAN","FEB","MÄR","APR","MAI","JUN","JUL","AUG","SEP","OKT","NOV","DEZ"][x.getMonth()]}</span></div><div style="flex:1;min-width:0"><div style="font-weight:900">${s.icon} ${esc(t.title)} · ${s.name}</div><div class="sm mut">${d<0?"vorbei":d===0?"🔴 HEUTE":d===1?"🟠 morgen":"in "+d+" Tagen"} · ${t.topics.length} Themen</div><div class="bar" style="margin-top:6px"><i style="width:${testProg(t)}%"></i></div></div><b style="color:var(--acc)">${testProg(t)}%</b></button>`}
VIEWS.testadd=()=>{const s=subj(V.s);return `<button class="btn ghost sm" style="margin-top:14px" data-a="go" data-x="tests">← Tests</button>
 <div class="card"><h2>➕ Neuer Test</h2>
 <div class="sm mut" style="margin-top:10px">Fach</div><select data-k="s">${SUBJ.map(x=>`<option value="${x.id}" ${x.id===V.s?"selected":""}>${x.icon} ${x.name}</option>`).join("")}</select>
 <div class="row" style="margin-top:8px"><div style="flex:1"><div class="sm mut">Datum</div><input type="date" data-k="d" value="${esc(V.d)}" min="${today()}"></div><div style="flex:1"><div class="sm mut">Art</div><select data-k="title">${["Klassenarbeit","Test","Vokabeltest","Leistungskontrolle","Referat","Abfrage"].map(o=>`<option ${o===V.title?"selected":""}>${o}</option>`).join("")}</select></div></div>
 <div class="sm mut" style="margin-top:12px">Welche Themen kommen dran?</div><div class="list">${s.topics.map(t=>`<button class="li" data-a="ttog" data-x="${t.id}"><span style="font-size:20px">${V.topics.includes(t.id)?"☑️":"⬜"}</span><span class="grow nm" style="text-align:left;white-space:normal">${esc(t.t)}</span></button>`).join("")}</div>
 <div class="sm mut" style="margin-top:12px">Notizen (was hat die Lehrkraft gesagt?)</div><textarea data-k="notes" placeholder="z. B. Seite 34–40 im Buch, Aufgaben wie im Arbeitsblatt">${esc(V.notes||"")}</textarea>
 <button class="btn fire full" style="margin-top:14px" data-a="savetest">Speichern & Lernplan erstellen 🚀</button></div>`};
VIEWS.test=()=>{const t=(P.tests||[]).find(x=>x.id===V.id);if(!t)return `<div class="card">Test nicht gefunden.</div>`;const s=subj(t.s);const d=daysUntil(t.d);const pr=testProg(t);t.ok=t.ok||{};
 const plan=planFor(t);
 return `<button class="btn ghost sm" style="margin-top:14px" data-a="go" data-x="tests">← Tests</button>
 <div class="card hero2" style="background:linear-gradient(135deg,${s.color},${s.color}aa);color:#fff"><div style="font-size:13px;font-weight:800;opacity:.9">${s.icon} ${s.name} · ${fmtDate(t.d)}</div><div class="big2" style="margin-top:4px">${esc(t.title)}</div>
 <div style="font-size:40px;font-weight:900;margin-top:6px">${d<0?"✔️ vorbei":d===0?"HEUTE 💪":d+" "+(d===1?"Tag":"Tage")}</div><div class="sm">${d>0?"bis zum Test":""}</div>
 <div class="bar" style="margin-top:10px;background:#ffffff44"><i style="width:${pr}%;background:#fff"></i></div><div class="sm" style="margin-top:4px">${pr}% der Themen sitzen (Mini-Test ≥ 80 %)</div></div>
 <div class="row noprint" style="margin-top:12px"><button class="btn fire" style="flex:1" data-a="texam" data-x="${t.id}">📝 Probe-Arbeit</button><button class="btn" style="flex:1" data-a="zettel" data-x="${t.topics.join(",")}">📄 Lernzettel</button></div>
 <div class="card"><h3>🎯 Das musst du können</h3>${t.topics.map(id=>{const tp=TOPIC[id];const b=P.topics[id]?P.topics[id].best:null;const ok=b>=80;return `<div style="margin-top:12px"><div class="row" style="justify-content:space-between"><b>${ok?"✅":"⬜"} ${esc(tp.t)}</b><span class="pill">${b==null?"neu":b+"%"}</span></div>
  ${canDo(id).map((c,j)=>{const k=id+"|"+j;const on=ok||t.ok[k];return `<button class="can" data-a="tcan" data-x="${t.id}|${k}"><span>${on?"☑️":"⬜"}</span><span>Ich kann: ${esc(c)}</span></button>`}).join("")}
  <div class="row" style="margin-top:6px;gap:6px"><button class="btn ghost sm" data-a="video" data-x="${id}">🎬</button><button class="btn ghost sm" data-a="topic2" data-x="${id}">✏️ Üben</button><button class="btn ghost sm" data-a="quizStart2" data-x="${id}">📝 Test</button><button class="btn ghost sm" data-a="cdeck" data-x="${id}">🃏</button></div></div>`}).join("")}</div>
 ${d>0?`<div class="card"><h3>🗓️ Dein Lernplan</h3><div class="plan" style="margin-top:10px">${plan.map(p=>{const isNow=p.d===today();const done=p.type==="learn"?p.topics.every(id=>P.topics[id]&&P.topics[id].best>=80):false;
  const lbl=p.type==="learn"?p.topics.map(id=>"📖 "+TOPIC[id].t).join("<br>")+`<div class="sm mut">Video → Üben → Mini-Test</div>`:p.type==="exam"?"📝 Probe-Klassenarbeit schreiben":p.type==="zettel"?"📄 Lernzettel durchlesen & früh schlafen 😴":"🔁 Wiederholen: Karteikarten & schwache Themen";
  return `<div class="pd ${isNow?"now":""} ${done?"ok":""}"><div class="sm" style="font-weight:900;color:${isNow?"var(--fire)":"var(--mut)"}">${isNow?"HEUTE":fmtDate(p.d)}</div><div style="font-weight:700">${lbl}</div></div>`}).join("")}</div></div>`:""}
 <div class="card"><h3>📎 Unterrichtsmaterial</h3><p class="mut sm">Fotos von Arbeitsblättern oder Tafelbildern – werden nur auf diesem Gerät gespeichert.</p>
 <div class="thumbs">${(t.imgs||[]).map(k=>`<img data-img="${esc(k)}" data-a="showimg" data-x="${esc(k)}" alt="">`).join("")}<label class="ph" style="display:flex;align-items:center;justify-content:center;font-size:28px;cursor:pointer">➕<input type="file" accept="image/*" multiple data-tfile="${t.id}" style="display:none"></label></div>
 ${t.notes?`<h3 style="margin-top:12px">📝 Notizen</h3><p style="white-space:pre-line;margin-top:4px">${esc(t.notes)}</p>`:""}</div>
 <button class="btn ghost sm noprint" style="margin-top:12px" data-a="deltest" data-x="${t.id}">🗑 Test löschen</button>`};

/* ---------- Fotos (IndexedDB, nur Gerät) ---------- */
function idb(){return new Promise((res,rej)=>{try{const r=indexedDB.open("lf7img",1);r.onupgradeneeded=()=>r.result.createObjectStore("img");r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)}catch(e){rej(e)}})}
async function imgPut(k,b){const db=await idb();return new Promise((res,rej)=>{const tx=db.transaction("img","readwrite");tx.objectStore("img").put(b,k);tx.oncomplete=res;tx.onerror=()=>rej(tx.error)})}
async function imgGet(k){const db=await idb();return new Promise(res=>{const tx=db.transaction("img","readonly");const r=tx.objectStore("img").get(k);r.onsuccess=()=>res(r.result);r.onerror=()=>res(null)})}
function shrink(file){return new Promise(res=>{const url=URL.createObjectURL(file);const im=new Image();im.onload=()=>{const m=1280;let w=im.width,h=im.height;const f=Math.min(1,m/Math.max(w,h));w=Math.round(w*f);h=Math.round(h*f);const c=document.createElement("canvas");c.width=w;c.height=h;c.getContext("2d").drawImage(im,0,0,w,h);URL.revokeObjectURL(url);c.toBlob(b=>res(b||file),"image/jpeg",.78)};im.onerror=()=>{URL.revokeObjectURL(url);res(file)};im.src=url})}
const IMGURL={};
function loadThumbs(){document.querySelectorAll("img[data-img]").forEach(async el=>{const k=el.dataset.img;if(IMGURL[k]){el.src=IMGURL[k];return}try{const b=await imgGet(k);if(b){IMGURL[k]=URL.createObjectURL(b);el.src=IMGURL[k]}else{el.alt="📵";el.title="Foto ist auf einem anderen Gerät"}}catch(e){}})}
document.addEventListener("change",async e=>{const el=e.target;if(el.dataset&&el.dataset.tfile){const t=(P.tests||[]).find(x=>x.id===el.dataset.tfile);if(!t)return;t.imgs=t.imgs||[];for(const f of [...el.files].slice(0,10)){const b=await shrink(f);const k="i"+Date.now()+Math.random().toString(36).slice(2,6);try{await imgPut(k,b);t.imgs.push(k)}catch(err){toast("Foto konnte nicht gespeichert werden.")}}save();toast("📎 Material gespeichert");rerender()}
 if(el.dataset&&el.dataset.k){V[el.dataset.k]=el.value;if(el.dataset.k==="s"){V.topics=[];rerender()}}});

 let m=x.match(/in (\d+) tag/);if(m)return addDays(t,+m[1]);m=x.match(/(\d{1,2})\.(\d{1,2})\.?(\d{2,4})?/);if(m){const now=new Date();let y=m[3]?(+m[3]<100?2000+ +m[3]:+m[3]):now.getFullYear();const dt=new Date(y,+m[2]-1,+m[1]);if(!m[3]&&dt<new Date(now.getFullYear(),now.getMonth(),now.getDate()))dt.setFullYear(y+1);return dayKey(dt)}

 if(!tid){const fresh=Object.keys(TOPIC).filter(id=>!P.topics[id]);tid=fresh[(new Date().getDate()*7)%fresh.length]||Object.keys(TOPIC)[0];why="ein neues Thema"}
 return{tid,why}}
function sessStart(){const{tid,why}=sessPlan();const L=["en","fr"][new Date().getDate()%2];
 window.SESS={tid,why,L,d:today(),b:{videos:dly("videos"),prac:dly("prac"),tests:(P.topics[tid]||{}).n||0,vocab:dly("vocab")},done:false};lsSet("lf7_sess",window.SESS);V={v:"sess"};render()}
function sessSteps(){const S=window.SESS;if(!S)return[];const t=TOPIC[S.tid];return[
 {ic:"🎬",t:"Video ansehen",s:t.t,ok:dly("videos")>S.b.videos,a:"video",x:S.tid},
 {ic:"✏️",t:"5 Aufgaben richtig üben",s:Math.min(5,dly("prac")-S.b.prac)+" / 5",ok:dly("prac")-S.b.prac>=5,a:"topic2",x:S.tid},
 {ic:"📝",t:"Mini-Test machen",s:"Ziel: 80 %",ok:((P.topics[S.tid]||{}).n||0)>S.b.tests,a:"quizStart2",x:S.tid},
 {ic:"🗂️",t:"5 Vokabeln richtig",s:VOC[S.L].flag+" "+VOC[S.L].name+" · "+Math.min(5,dly("vocab")-S.b.vocab)+" / 5",ok:dly("vocab")-S.b.vocab>=5,a:"vset",x:S.L+"|"+VOC[S.L].sets[new Date().getDate()%VOC[S.L].sets.length].id}]}
function sessCheck(){const S=window.SESS;if(!S||S.done||S.d!==today())return;if(sessSteps().every(s=>s.ok)){S.done=true;lsSet("lf7_sess",S);addXP(30,true);P.coins+=20;save();setTimeout(()=>{confetti(120);showModal(`<div class="center"><div class="big pop">🏆</div><h2>Lerneinheit geschafft!</h2><p class="mut" style="margin:8px 0 14px">Stark, ${esc(P.name)}! +30 XP und +20 🪙</p><button class="btn fire full" data-a="go" data-x="home">Zurück zu Heute</button></div>`)},400)}}
try{const s=lsGet("lf7_sess");if(s&&s.d===dayKey())window.SESS=s}catch(e){}
setInterval(()=>{try{if(P)sessCheck()}catch(e){}},3000);
VIEWS.sess=()=>{const S=window.SESS;if(!S||S.d!==today())return `<div class="card center" style="margin-top:20px"><p>Keine Lerneinheit aktiv.</p><button class="btn fire" style="margin-top:10px" data-a="sessgo">▶️ Jetzt starten</button></div>`;
 const st=sessSteps();const cur=st.findIndex(s=>!s.ok);const t=TOPIC[S.tid];
 return `<div class="card" style="margin-top:18px"><div class="mut sm">▶️ Deine Lerneinheit heute · ca. 15 Min</div><h2 style="margin-top:4px">${subj(t.sid).icon} ${esc(t.t)}</h2><div class="sm mut">Ausgewählt: ${esc(S.why)}</div>
 <div class="bar" style="margin-top:10px;height:10px"><i style="width:${st.filter(s=>s.ok).length/st.length*100}%"></i></div>
 ${st.map((s,i)=>`<button class="sessrow ${s.ok?"done":""} ${i===cur?"cur":""}" data-a="${s.a}" data-x="${s.x}"><span class="n">${s.ok?"✓":i+1}</span><div style="flex:1"><b>${s.ic} ${s.t}</b><div class="sm mut">${esc(s.s)}</div></div>${i===cur?`<span class="pill" style="background:var(--acc);color:#fff">Los →</span>`:""}</button>`).join("")}
 ${S.done?`<div class="fb ok" style="text-align:center">🏆 Geschafft! Morgen gibt es eine neue Einheit.</div>`:""}</div>
 <button class="btn ghost sm" style="margin-top:10px" data-a="sessnew">🔀 Anderes Thema wählen</button>`};
{const _fb=window.renderFbar;window.renderFbar=function(){_fb();const S=window.SESS;if(FL()||!S||S.done||S.d!==today()||["sess","home"].includes(V.v)||!P)return;const st=sessSteps();const n=st.filter(s=>s.ok).length;
 $("#fbar").innerHTML=`<div class="sessbar" data-a="go" data-x="sess">▶️ Lerneinheit ${n}/${st.length} <span style="margin-left:auto">Zur Übersicht →</span></div>`}}
VIEWS.home=()=>{const s=streakAlive();const lv=lvlOf(P.xp);const lo=lvlXp(lv),hi=lvlXp(lv+1);const pct=Math.min(100,Math.round((P.xp-lo)/(hi-lo)*100));const gp=Math.min(100,Math.round(todaySec()/(P.goal*60)*100));
 const qs=todaysQuests();const got=(P.qd&&P.qd.d===today())?P.qd.got:[];const nt=nextTest();const S=window.SESS&&window.SESS.d===today()?window.SESS:null;const sp=S?sessSteps():null;
 const hr=new Date().getHours();const greet=hr<11?"Guten Morgen":hr<17?"Hallo":"Guten Abend";const turn=MODE==="cloud"?myTurnCount():0;const open=!!P.statsOpen;
 const fr=MODE==="cloud"?(P.friends||[]).filter(id=>ALLP[id]).map(id=>Object.assign({},ALLP[id],{_id:id})):[];const lb=[Object.assign({},P,{_id:"me"})].concat(fr).map(p=>Object.assign(p,{wk:weekSec(p)})).sort((a,b)=>b.wk-a.wk);
 const plan=sessPlan();const pt=TOPIC[plan.tid];
 return `<div class="dash">
 <div class="full"><div class="card hero2"><div class="row" style="gap:14px;flex-wrap:nowrap">${avaHTML(P.ava,58)}<div style="flex:1;min-width:0"><div class="big2">${greet}, ${esc(P.name)}! 👋</div><div class="sm mut" style="margin-top:3px">Level ${lv} · ${rankName(lv)} · noch ${hi-P.xp} XP</div><div class="bar" style="margin-top:6px"><i style="width:${pct}%"></i></div></div><div class="center"><div style="font-size:30px" class="${s?"flame":""}">🔥</div><b>${s}</b></div></div>
 <div class="coachline" data-a="go" data-x="coach" style="cursor:pointer"><span class="m">🔥</span><div><b>Flami:</b> ${esc(coachSays())}</div></div></div>
 <button class="go-big" data-a="${S?"go":"sessgo"}" data-x="sess"><span class="pl">▶</span><div><b>${S?(S.done?"Lerneinheit geschafft ✅":"Weiterlernen ("+sp.filter(x=>x.ok).length+"/4)"):"Jetzt lernen"}</b><span>${S?esc(TOPIC[S.tid].t):"15 Min · "+esc(pt.t)+" · "+esc(plan.why)}</span></div></button>
 ${turn?`<button class="card" style="width:100%;text-align:left;border:2px solid var(--fire)" data-a="go" data-x="matches"><b>⚔️ Du bist in ${turn} ${turn===1?"Match":"Matches"} am Zug!</b><div class="sm mut">Tippen zum Spielen →</div></button>`:""}
 ${xmasBanner()}</div>
 <div><div class="card"><div class="row" style="gap:14px;flex-wrap:nowrap">${ringHTML(gp)}<div style="flex:1"><h3>${P.lastGoal===today()?"✅ Tagesziel geschafft":"🎯 Tagesziel"}</h3><div class="sm mut" style="margin:4px 0 8px">${P.lastGoal===today()?"Deine Flamme brennt heute 🔥":"Damit deine Flamme weiterbrennt"}</div><button class="btn ghost sm" data-a="goalSet">⚙️ ${P.goal} Min</button></div></div></div>
 <div class="card"><div class="row" style="justify-content:space-between"><h3>⚡ Tages-Quests</h3><span class="pill">${got.length}/3</span></div>${qs.map(q=>{const pv=Math.min(q.n,dly(q.k));const dn=got.includes(q.id);return `<div class="quest ${dn?"done":""}"><span class="qi">${dn?"✅":q.ic}</span><div class="qb"><div style="font-weight:800;font-size:14px">${q.t}</div><div class="bar" style="margin-top:4px"><i style="width:${pv/q.n*100}%"></i></div></div><span class="qx">+${q.xp} XP</span></div>`}).join("")}</div></div>
 <div>${nt?`<div class="card"><div class="row" style="justify-content:space-between"><h3>📅 Nächster Test</h3><button class="btn ghost sm" data-a="go" data-x="tests">Alle →</button></div>${testRow(nt)}</div>`:`<div class="card"><h3>📅 Nächster Test</h3><p class="mut sm" style="margin:6px 0 10px">Trag deine nächste Arbeit ein – du bekommst einen Lernplan.</p><button class="btn sm" data-a="newtest" data-x="">➕ Test eintragen</button></div>`}
 ${chestCard()}</div>
 <div class="full"><button class="fold" data-a="statsT"><span>📊 Mein Fortschritt</span><span>${open?"▲":"▼"}</span></button></div>
 ${open?`<div><div class="card"><div class="row" style="justify-content:space-between"><h3>📊 Lernzeit</h3><div class="seg"><button class="${V.range!==30?"on":""}" data-a="range" data-x="7">Woche</button><button class="${V.range===30?"on":""}" data-a="range" data-x="30">30 Tage</button></div></div>${chartHTML()}<div class="nums"><div><b>${P.xp}</b><span>XP</span></div><div><b>${Math.round((P.totalSec||0)/3600*10)/10}</b><span>Stunden</span></div><div><b>${P.best||0}</b><span>Rekord-Serie</span></div></div></div>
 <div class="card"><h3>🗓️ ${["Januar","Februar","März","April","Mai","Juni","Juli","August","September","Oktober","November","Dezember"][new Date().getMonth()]}</h3>${calHTML()}</div></div>
 <div>${fr.length?`<div class="card"><h3>🏆 Wochen-Rangliste</h3><div class="list">${lb.slice(0,4).map((p,i)=>`<div class="li">${["🥇","🥈","🥉"][i]||"4."} ${avaHTML(p.ava,32)}<div class="grow nm">${esc(p.name)}${p._id==="me"?" (du)":""}</div><b>${fmtMin(p.wk)}</b></div>`).join("")}</div></div>`:""}
 <div class="card"><h3>📚 Fächer</h3><div class="list">${SUBJ.map(su=>{const[d,n]=subjProg(su);const mins=Math.round(((P.subSec||{})[su.id]||0)/60);return `<button class="li" data-a="subject" data-x="${su.id}"><span style="font-size:22px">${su.icon}</span><div class="grow"><div class="nm">${su.name}</div><div class="bar" style="margin-top:4px"><i style="width:${d/n*100}%"></i></div></div><span class="sm mut">${mins} Min</span></button>`}).join("")}</div></div>
 <div class="card"><h3>🏅 Abzeichen (${(P.badges||[]).length}/${BADGES.length})</h3><div class="row" style="margin-top:10px;gap:6px">${BADGES.map(b=>`<div class="badge ${(P.badges||[]).includes(b[0])?"got":""}"><b>${b[1]}</b>${b[2]}</div>`).join("")}</div></div></div>`:""}
 </div>`};

/* ================= TEST ANLEGEN – Schritt für Schritt ================= */
const DKEY=()=>"lf7_draft_"+(UID||(P&&P.name));
function draftSave(){lsSet(DKEY(),{s:V.s,d:V.d,title:V.title,topics:V.topics,items:V.items,notes:V.notes,step:V.step})}
const TTYPES=["Klassenarbeit","Test","Vokabeltest","Leistungskontrolle","Referat","Abfrage"];
VIEWS.testadd=()=>{const st=V.step||1;const s=subj(V.s);const dots=`<div class="steps">${[1,2,3,4].map(i=>`<i class="${i<=st?"on":""}"></i>`).join("")}</div>`;
 const nav=(canNext,nextLbl)=>`<div class="row" style="margin-top:16px">${st>1?`<button class="btn ghost" style="flex:1" data-a="tstep" data-x="${st-1}">← Zurück</button>`:`<button class="btn ghost" style="flex:1" data-a="tcancel">Abbrechen</button>`}${st<4?`<button class="btn fire" style="flex:2" data-a="tstep" data-x="${st+1}" ${canNext?"":"disabled"}>${nextLbl||"Weiter →"}</button>`:`<button class="btn fire" style="flex:2" data-a="savetest" ${V.topics.length||V.items.length?"":"disabled"}>Speichern 🚀</button>`}</div>`;
 let body="";
 if(st===1)body=`<h2>Welches Fach?</h2><p class="mut sm">Schritt 1 von 4</p><div class="bigpick">${SUBJ.map(x=>`<button style="background:linear-gradient(145deg,${x.color},${x.color}aa);${x.id===V.s?"outline:4px solid var(--txt)":""}" data-a="tsub" data-x="${x.id}"><span>${x.icon}</span>${x.name}</button>`).join("")}</div>`;
 if(st===2){const q=[["Morgen",1],["Übermorgen",2],["In 1 Woche",7],["In 2 Wochen",14]];body=`<h2>Wann und was?</h2><p class="mut sm">Schritt 2 von 4 · ${s.icon} ${s.name}</p>
  <h3 style="margin-top:14px">📅 Datum</h3><div class="qd">${q.map(([l,n])=>`<button class="${V.d===addDays(today(),n)?"on":""}" data-a="tdate" data-x="${n}">${l}</button>`).join("")}</div>
  <input type="date" data-k="d" value="${esc(V.d||"")}" min="${today()}" style="margin-top:10px">${V.d?`<p class="sm" style="margin-top:6px;font-weight:800;color:var(--acc)">${fmtDate(V.d)} – in ${daysUntil(V.d)} ${daysUntil(V.d)===1?"Tag":"Tagen"}</p>`:""}
  <h3 style="margin-top:16px">📝 Art</h3><div class="qd">${TTYPES.map(o=>`<button class="${o===V.title?"on":""}" data-a="ttype" data-x="${o}">${o}</button>`).join("")}</div>`}
 if(st===3)body=`<h2>Welche Themen?</h2><p class="mut sm">Schritt 3 von 4 · Tippe alle an, die drankommen.</p>
  <div class="row" style="margin-top:10px;gap:6px"><button class="btn ghost sm" data-a="tall" data-x="1">Alle</button><button class="btn ghost sm" data-a="tall" data-x="0">Keine</button></div>
  <div class="list">${s.topics.map(t=>`<button class="li" data-a="ttog" data-x="${t.id}" style="${V.topics.includes(t.id)?"border-color:var(--acc);border-width:2px":""}"><span style="font-size:20px">${V.topics.includes(t.id)?"✅":"⬜"}</span><span class="grow nm" style="text-align:left;white-space:normal">${esc(t.t)}</span></button>`).join("")}</div>
  <p class="mut sm" style="margin-top:8px">Thema nicht dabei? Kein Problem – im nächsten Schritt kannst du alles selbst eintragen.</p>`;
 if(st===4)body=`<h2>Was musst du können?</h2><p class="mut sm">Schritt 4 von 4 · Trag ein, was die Lehrkraft gesagt hat – Punkt für Punkt. Daraus wird deine Checkliste.</p>
  <form data-f="titem" class="inp-row" style="margin-top:12px"><input id="tin" placeholder="z. B. Buch S. 34–40, Vokabeln Unit 2 …" autocomplete="off" maxlength="120"><button class="btn sm">➕</button></form>
  <div>${(V.items||[]).map((it,i)=>`<div class="item"><span>📌</span><div class="grow">${esc(it.t)}</div><button data-a="tdelitem" data-x="${i}" title="Entfernen">✕</button></div>`).join("")||`<p class="mut sm" style="margin-top:10px">Noch keine Punkte – tippe oben und drücke ➕.</p>`}</div>
  <h3 style="margin-top:16px">🗒️ Notizen (optional)</h3><textarea data-k="notes" placeholder="Alles, was du dir sonst merken willst">${esc(V.notes||"")}</textarea>
  <div class="card" style="margin-top:12px"><b>Zusammenfassung</b><div class="sm" style="margin-top:6px">${s.icon} ${esc(V.title)} in ${s.name} · ${V.d?fmtDate(V.d):"kein Datum"}<br>${V.topics.length} Themen · ${(V.items||[]).length} eigene Punkte</div></div>`;
 return `<div class="card" style="margin-top:16px">${dots}${body}${nav(st===1?!!V.s:st===2?!!V.d:true)}</div>`};
function newTestV(s,d){const dr=lsGet(DKEY());if(!s&&!d&&dr&&(dr.topics&&dr.topics.length||dr.items&&dr.items.length||dr.d)){V=Object.assign({v:"testadd",title:"Klassenarbeit",topics:[],items:[],notes:""},dr);toast("📝 Dein Entwurf wurde wiederhergestellt");return}
 V={v:"testadd",step:s?2:1,s:s||"ma",d:d||"",title:"Klassenarbeit",topics:[],items:[],notes:""}}
{const _t=VIEWS.test;VIEWS.test=()=>{const t=(P.tests||[]).find(x=>x.id===V.id);let h=_t();if(!t)return h;t.items=t.items||[];const done=t.items.filter(i=>i.done).length;
 const card=`<div class="card"><div class="row" style="justify-content:space-between"><h3>📌 Meine Checkliste</h3><span class="pill">${done}/${t.items.length}</span></div>
 ${t.items.map((it,i)=>`<div class="item ${it.done?"done":""}"><button data-a="titm" data-x="${t.id}|${i}" style="opacity:1;font-size:20px">${it.done?"☑️":"⬜"}</button><div class="grow">${esc(it.t)}</div><button data-a="titmdel" data-x="${t.id}|${i}">✕</button></div>`).join("")}
 <form data-f="titem2" data-x="${t.id}" class="inp-row" style="margin-top:10px"><input id="tin2" placeholder="Neuen Punkt hinzufügen …" autocomplete="off" maxlength="120"><button class="btn sm">➕</button></form></div>`;
 return h.replace('<div class="card"><h3>🎯 Das musst du können</h3>',card+'<div class="card"><h3>🎯 Das musst du können</h3>')}}
document.addEventListener("submit",e=>{const f=e.target.dataset.f;
 if(f==="titem"){e.preventDefault();const i=$("#tin");const v=(i.value||"").trim();if(!v)return;V.items=V.items||[];V.items.push({t:v,done:false});draftSave();rerender();setTimeout(()=>{const n=$("#tin");if(n)n.focus()},30)}
 if(f==="titem2"){e.preventDefault();const i=$("#tin2");const v=(i.value||"").trim();if(!v)return;const t=P.tests.find(z=>z.id===e.target.dataset.x);t.items=t.items||[];t.items.push({t:v,done:false});save();rerender()}});
document.addEventListener("input",e=>{if(V.v==="testadd"&&e.target.dataset&&e.target.dataset.k)setTimeout(draftSave,0)});
document.addEventListener("change",e=>{if(V.v==="testadd"&&e.target.dataset&&e.target.dataset.k==="d"){draftSave();rerender()}});

Object.assign(ACT,{
 sessgo:()=>sessStart(),
 sessnew:()=>{window.SESS=null;lsSet("lf7_sess",null);const fresh=shuffle(Object.keys(TOPIC).filter(id=>!(P.topics[id]&&P.topics[id].best>=80)));const tid=fresh[0]||Object.keys(TOPIC)[0];const L=["en","fr"][rnd(0,1)];
  window.SESS={tid,why:"von dir neu gewählt",L,d:today(),b:{videos:dly("videos"),prac:dly("prac"),tests:(P.topics[tid]||{}).n||0,vocab:dly("vocab")},done:false};lsSet("lf7_sess",window.SESS);rerender()},
 statsT:()=>{P.statsOpen=!P.statsOpen;save();rerender()},
 newtest:x=>{const[s,d]=(x||"").split("|");newTestV(s,d);render()},
 tsub:x=>{if(V.s!==x)V.topics=[];V.s=x;V.step=2;draftSave();rerender()},
 tstep:x=>{V.step=+x;draftSave();render()},
 tdate:x=>{V.d=addDays(today(),+x);draftSave();rerender()},
 ttype:x=>{V.title=x;draftSave();rerender()},
 ttog:x=>{const i=V.topics.indexOf(x);if(i>=0)V.topics.splice(i,1);else V.topics.push(x);draftSave();rerender()},
 tall:x=>{V.topics=x==="1"?subj(V.s).topics.map(t=>t.id):[];draftSave();rerender()},
 tdelitem:x=>{V.items.splice(+x,1);draftSave();rerender()},
 tcancel:()=>{lsSet(DKEY(),null);V={v:"tests"};render()},
 savetest:()=>{if(!V.d)return toast("📅 Bitte ein Datum wählen");if(!V.topics.length&&!(V.items||[]).length)return toast("Bitte ein Thema oder einen Punkt eintragen");
  P.tests=P.tests||[];const id="t"+Date.now().toString(36);P.tests.push({id,s:V.s,d:V.d,title:V.title||"Klassenarbeit",topics:V.topics.slice(),items:(V.items||[]).slice(),notes:V.notes||"",ok:{},imgs:[]});lsSet(DKEY(),null);save();confetti(50);toast("🗓️ Lernplan erstellt!");V={v:"test",id};render()},
 titm:x=>{const[id,i]=x.split("|");const t=P.tests.find(z=>z.id===id);t.items[+i].done=!t.items[+i].done;if(t.items[+i].done)addXP(3,true);save();rerender()},
 titmdel:x=>{const[id,i]=x.split("|");const t=P.tests.find(z=>z.id===id);t.items.splice(+i,1);save();rerender()}
});
</script>
