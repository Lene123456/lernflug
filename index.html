<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>LernFlug 7 – Lernen für die 7. Klasse</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&display=swap" rel="stylesheet">
<style>
:root{--bg:#0d1030;--bg2:#161a46;--card:#1d2257;--card2:#252b6b;--line:#2f3680;--txt:#eef0ff;--mut:#a3a8d9;--fire:#ff7a18;--fire2:#ffcc33;--ok:#2ee59d;--bad:#ff5d73;--acc:#7c6cff;--r:18px}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{background:var(--bg);color:var(--txt);font-family:Nunito,system-ui,sans-serif;min-height:100%}
body{background:radial-gradient(1200px 600px at 80% -10%,#3a2a8a55,transparent),radial-gradient(900px 500px at -10% 110%,#ff7a1822,transparent),var(--bg);background-attachment:fixed}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
input,select{font:inherit;color:var(--txt);background:var(--bg2);border:2px solid var(--line);border-radius:12px;padding:12px 14px;width:100%;outline:none}
input:focus,select:focus{border-color:var(--acc)}
h1,h2,h3{font-weight:900;letter-spacing:-.02em}
.wrap{max-width:860px;margin:0 auto;padding:0 14px 110px}
/* top bar */
.top{position:sticky;top:0;z-index:20;background:#0d1030e6;backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.topin{max-width:860px;margin:0 auto;padding:10px 14px;display:flex;align-items:center;gap:10px}
.logo{font-weight:900;font-size:20px;display:flex;align-items:center;gap:6px;cursor:pointer}
.logo span{background:linear-gradient(90deg,var(--fire2),var(--fire));-webkit-background-clip:text;color:transparent}
.chips{margin-left:auto;display:flex;gap:6px;align-items:center}
.chip{background:var(--card);border:1px solid var(--line);border-radius:999px;padding:5px 10px;font-weight:800;font-size:14px;display:flex;align-items:center;gap:4px;white-space:nowrap}
.chip.fire{color:var(--fire2)} .chip.dead{filter:grayscale(1);opacity:.6}
/* nav */
.nav{position:fixed;bottom:0;left:0;right:0;z-index:30;background:#12163ef2;backdrop-filter:blur(10px);border-top:1px solid var(--line);display:flex;justify-content:center;padding:6px 4px calc(6px + env(safe-area-inset-bottom))}
.nav button{flex:1;max-width:120px;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11px;font-weight:800;color:var(--mut);padding:6px 0;border-radius:12px}
.nav button b{font-size:22px;line-height:1}
.nav button.on{color:var(--txt);background:var(--card)}
.nav button.lock{opacity:.35}
/* cards */
.card{background:linear-gradient(160deg,var(--card),var(--bg2));border:1px solid var(--line);border-radius:var(--r);padding:18px;margin-top:14px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px;margin-top:14px}
.subj{border-radius:var(--r);padding:16px;min-height:118px;display:flex;flex-direction:column;justify-content:space-between;text-align:left;position:relative;overflow:hidden;border:1px solid #ffffff22;transition:transform .15s}
.subj:active{transform:scale(.97)}
.subj .ic{font-size:34px}
.subj .nm{font-weight:900;font-size:18px}
.subj .pr{font-size:12px;opacity:.9;font-weight:700}
.bar{height:8px;background:#ffffff22;border-radius:9px;overflow:hidden;margin-top:6px}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--fire2),var(--fire));border-radius:9px;transition:width .5s}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;background:linear-gradient(135deg,var(--acc),#a35cff);padding:13px 20px;border-radius:14px;font-weight:900;font-size:16px;box-shadow:0 4px 0 #3b2fa0;transition:transform .1s}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 #3b2fa0}
.btn.fire{background:linear-gradient(135deg,var(--fire2),var(--fire));color:#2a1200;box-shadow:0 4px 0 #a34a00}
.btn.ok{background:linear-gradient(135deg,#5dffc0,var(--ok));color:#003320;box-shadow:0 4px 0 #0b8a5a}
.btn.ghost{background:var(--card2);box-shadow:0 4px 0 #11143a}
.btn.sm{padding:8px 13px;font-size:14px;border-radius:11px}
.btn.full{width:100%}
.btn:disabled{opacity:.4}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.mut{color:var(--mut)} .sm{font-size:13px}
.hero{display:flex;gap:14px;align-items:center}
.stat{flex:1;min-width:90px;background:var(--bg2);border:1px solid var(--line);border-radius:14px;padding:10px;text-align:center}
.stat b{display:block;font-size:22px;font-weight:900}
.stat span{font-size:12px;color:var(--mut);font-weight:700}
/* avatar */
.ava{position:relative;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;flex-shrink:0;box-shadow:inset 0 -4px 0 #0003}
.ava .acc{position:absolute;top:-18%;right:-14%;font-size:.55em;transform:rotate(15deg)}
/* topic list */
.tlist{display:flex;flex-direction:column;gap:10px;margin-top:14px}
.titem{display:flex;align-items:center;gap:12px;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;text-align:left;width:100%}
.titem .num{width:38px;height:38px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-weight:900;background:var(--card2);flex-shrink:0}
.titem .tt{font-weight:800;flex:1}
.star{font-size:13px;font-weight:800}
/* tabs */
.tabs{display:flex;gap:6px;background:var(--bg2);padding:5px;border-radius:14px;margin-top:14px;border:1px solid var(--line)}
.tabs button{flex:1;padding:10px 4px;border-radius:10px;font-weight:800;font-size:14px;color:var(--mut)}
.tabs button.on{background:var(--card2);color:var(--txt)}
/* explanation */
.exp{line-height:1.6;font-size:16px}
.exp h4{margin:16px 0 6px;font-size:17px;color:var(--fire2)}
.exp p{margin:8px 0}
.exp ul,.exp ol{margin:6px 0 6px 22px}
.exp li{margin:4px 0}
.exp .ex{background:#7c6cff22;border-left:4px solid var(--acc);padding:10px 14px;border-radius:10px;margin:10px 0}
.exp .tip{background:#ffcc3318;border-left:4px solid var(--fire2);padding:10px 14px;border-radius:10px;margin:12px 0}
.tb{border-collapse:collapse;margin:10px 0;width:100%;font-size:15px}
.tb td,.tb th{border:1px solid var(--line);padding:7px 9px;text-align:left}
.tb th{background:var(--card2)}
/* quiz */
.qhead{display:flex;justify-content:space-between;align-items:center;gap:8px}
.qtext{font-size:20px;font-weight:800;margin:14px 0;line-height:1.35}
.opts{display:flex;flex-direction:column;gap:10px}
.opt{background:var(--bg2);border:2px solid var(--line);border-radius:14px;padding:14px;text-align:left;font-weight:700;font-size:16px}
.opt.sel{border-color:var(--acc);background:#7c6cff22}
.opt.ok{border-color:var(--ok);background:#2ee59d22}
.opt.bad{border-color:var(--bad);background:#ff5d7322}
.fb{margin-top:14px;padding:14px;border-radius:14px;font-weight:700;line-height:1.45}
.fb.ok{background:#2ee59d1f;border:1px solid var(--ok)}
.fb.bad{background:#ff5d731f;border:1px solid var(--bad)}
.big{font-size:54px;text-align:center}
.center{text-align:center}
.grade{font-size:72px;font-weight:900;text-align:center;background:linear-gradient(135deg,var(--fire2),var(--fire));-webkit-background-clip:text;color:transparent}
/* flashcard */
.fc{perspective:1000px;height:220px;margin-top:14px;cursor:pointer}
.fci{position:relative;width:100%;height:100%;transition:transform .5s;transform-style:preserve-3d}
.fc.flip .fci{transform:rotateY(180deg)}
.fcs{position:absolute;inset:0;backface-visibility:hidden;border-radius:20px;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:26px;font-weight:900;padding:20px;text-align:center;border:1px solid var(--line)}
.fcs.f{background:linear-gradient(135deg,var(--card2),var(--card))}
.fcs.b{background:linear-gradient(135deg,#3b2fa0,var(--acc));transform:rotateY(180deg)}
.boxes{display:flex;gap:6px;margin-top:10px}
.boxes div{flex:1;text-align:center;background:var(--bg2);border-radius:10px;padding:6px;font-size:12px;font-weight:800;border:1px solid var(--line)}
/* toasts */
#toasts{position:fixed;top:64px;left:0;right:0;z-index:100;display:flex;flex-direction:column;align-items:center;gap:8px;pointer-events:none}
.toast{background:var(--card2);border:1px solid var(--acc);padding:10px 16px;border-radius:14px;font-weight:800;box-shadow:0 10px 30px #0008;animation:tin .3s;max-width:92%}
@keyframes tin{from{transform:translateY(-20px);opacity:0}}
/* modal */
.modal{position:fixed;inset:0;z-index:90;background:#05061acc;display:flex;align-items:center;justify-content:center;padding:16px}
.modal .card{max-width:440px;width:100%;margin:0;max-height:90vh;overflow:auto}
/* flame anim */
.flame{display:inline-block;animation:fl 1.2s infinite alternate}
@keyframes fl{to{transform:scale(1.15) rotate(-4deg)}}
.pop{animation:pop .6s}
@keyframes pop{50%{transform:scale(1.4)}}
/* flight */
.sky{position:relative;border-radius:22px;overflow:hidden;background:linear-gradient(180deg,#0a0e3a,#27348f 60%,#ff9a5a);height:240px;margin-top:14px;border:1px solid var(--line)}
.sky .cloud{position:absolute;font-size:40px;opacity:.7;animation:cl 18s linear infinite}
@keyframes cl{from{transform:translateX(110vw)}to{transform:translateX(-30vw)}}
.sky .plane{position:absolute;font-size:46px;transition:left 1s linear,top 1s linear;transform:translate(-50%,-50%) rotate(0deg)}
.sky svg{position:absolute;inset:0}
.flightbar{position:sticky;top:57px;z-index:19;background:linear-gradient(90deg,#3b2fa0,#7c6cff);padding:8px 14px;display:flex;align-items:center;gap:10px;font-weight:900;font-size:14px}
.flightbar .t{font-variant-numeric:tabular-nums;font-size:16px}
.pass{background:#fff;color:#16183a;border-radius:20px;padding:18px;margin-top:14px;position:relative;overflow:hidden}
.pass:before{content:"";position:absolute;right:110px;top:-12px;bottom:-12px;border-left:3px dashed #c8cbe8}
.pass .lbl{font-size:11px;color:#777b9e;font-weight:800;text-transform:uppercase}
.pass .val{font-size:20px;font-weight:900}
.seats{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.seat{background:var(--bg2);border:1px solid var(--line);border-radius:12px;padding:6px 10px;display:flex;align-items:center;gap:6px;font-weight:800;font-size:13px}
.pill{display:inline-block;padding:3px 9px;border-radius:999px;font-size:12px;font-weight:800;background:var(--card2)}
.pill.on{background:#2ee59d33;color:var(--ok)}
.list{display:flex;flex-direction:column;gap:8px;margin-top:10px}
.li{display:flex;align-items:center;gap:12px;background:var(--bg2);border:1px solid var(--line);border-radius:14px;padding:10px 12px}
.li .grow{flex:1;min-width:0}
.li .nm{font-weight:900;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.shop{display:grid;grid-template-columns:repeat(auto-fill,minmax(100px,1fr));gap:10px;margin-top:10px}
.shop button{background:var(--bg2);border:2px solid var(--line);border-radius:14px;padding:10px;display:flex;flex-direction:column;align-items:center;gap:4px;font-weight:800;font-size:13px}
.shop button.own{border-color:var(--ok)} .shop button.eq{border-color:var(--fire2);background:#ffcc3318}
.shop button .e{font-size:30px}
.colors{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
.colors button{width:38px;height:38px;border-radius:50%;border:3px solid transparent}
.colors button.on{border-color:#fff}
.week{display:flex;gap:6px;margin-top:10px}
.week div{flex:1;text-align:center}
.week .d{height:70px;background:var(--bg2);border-radius:10px;display:flex;align-items:flex-end;overflow:hidden;border:1px solid var(--line)}
.week .d i{width:100%;background:linear-gradient(0deg,var(--fire),var(--fire2));display:block}
.week span{font-size:11px;color:var(--mut);font-weight:800}
.splash{min-height:80vh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;text-align:center}
.splash .big{animation:fly 2s ease-in-out infinite}
@keyframes fly{50%{transform:translateY(-14px) rotate(-6deg)}}
.badge{display:inline-flex;flex-direction:column;align-items:center;gap:2px;width:84px;font-size:11px;font-weight:800;text-align:center;color:var(--mut)}
.badge b{font-size:30px;filter:grayscale(1);opacity:.35}
.badge.got{color:var(--txt)} .badge.got b{filter:none;opacity:1}
.timer{font-variant-numeric:tabular-nums;font-weight:900}
.inp-row{display:flex;gap:8px}
.inp-row input{flex:1}
.sp{cursor:pointer;font-size:22px}
@media(max-width:420px){.qtext{font-size:18px}.chip{padding:4px 8px;font-size:13px}.logo{font-size:17px}}
</style>
</head>
<body>
<div id="topbar"></div>
<div id="fbar"></div>
<div class="wrap" id="main"><div class="splash"><div class="big">✈️</div><h2>LernFlug 7</h2><p class="mut">Startklar machen …</p></div></div>
<div id="nav"></div>
<div id="toasts"></div>
<div id="modal"></div>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="config.js"></script>
<script>
// LernFlug 7 – Inhalte nach Rahmenlehrplan Berlin-Brandenburg, Jahrgangsstufe 7 (Gymnasium)
// Frage-Format: [Frage, [Optionen], richtigerIndex, Erklärung]  oder  [Frage, "=Antwort|Variante", Erklärung]
window.SUBJECTS = [
{ id:"ma", name:"Mathe", icon:"📐", color:"#4f8cff", topics:[
 {id:"m-rat", t:"Rationale Zahlen", gen:true, ex:`
<p><b>Rationale Zahlen (ℚ)</b> sind alle positiven und negativen Zahlen, die man als Bruch schreiben kann: z. B. −3, 0, 2,5, −¾.</p>
<p><b>Betrag:</b> Abstand zur 0 auf der Zahlengeraden. |−7| = 7, |4| = 4.</p>
<h4>Addieren & Subtrahieren</h4>
<ul><li><b>Gleiche Vorzeichen:</b> Beträge addieren, Vorzeichen behalten: (−3) + (−5) = −8</li>
<li><b>Verschiedene Vorzeichen:</b> größeren minus kleineren Betrag, Vorzeichen der Zahl mit dem größeren Betrag: (−9) + 4 = −5</li>
<li><b>Minus einer negativen Zahl = plus:</b> 6 − (−2) = 6 + 2 = 8</li></ul>
<h4>Multiplizieren & Dividieren</h4>
<ul><li>Gleiche Vorzeichen → Ergebnis <b>positiv</b>: (−4)·(−3) = 12</li>
<li>Verschiedene Vorzeichen → Ergebnis <b>negativ</b>: (−20) : 5 = −4</li></ul>
<div class="tip">💡 Merksatz: „Minus mal Minus ergibt Plus“. Punkt- vor Strichrechnung gilt weiter!</div>`,
 q:[["(−7) + 4 = ?","=-3","Verschiedene Vorzeichen: 7 − 4 = 3. Die −7 hat den größeren Betrag → −3."],
 ["5 − (−3) = ?","=8","Minus einer negativen Zahl wird zu Plus: 5 + 3 = 8."],
 ["(−6) · (−4) = ?","=24","Gleiche Vorzeichen → positiv: 6 · 4 = 24."],
 ["(−36) : 9 = ?","=-4","Verschiedene Vorzeichen → negativ: 36 : 9 = 4 → −4."],
 ["Welche Zahl ist am kleinsten?",["−0,5","−2","−1,9","0"],1,"Je weiter links auf der Zahlengeraden, desto kleiner. −2 liegt am weitesten links."],
 ["|−12| = ?","=12","Der Betrag ist immer der Abstand zur 0, also positiv."],
 ["Es ist 3 °C. Die Temperatur fällt um 8 Grad. Wie viel Grad sind es jetzt?","=-5","3 − 8 = −5 °C."],
 ["(−2) · 3 · (−5) = ?","=30","(−2)·3 = −6; (−6)·(−5) = 30."]]},
 {id:"m-proz", t:"Prozentrechnung", gen:true, ex:`
<p>Prozent heißt „von Hundert“: 1 % = 1/100 = 0,01.</p>
<p><b>Grundwert G</b> = das Ganze · <b>Prozentwert W</b> = der Anteil · <b>Prozentsatz p %</b></p>
<div class="ex"><b>W = G · p / 100</b><br><b>p = W / G · 100</b><br><b>G = W · 100 / p</b></div>
<h4>Beispiel</h4><p>20 % von 150 €: W = 150 · 20 / 100 = <b>30 €</b>.</p>
<h4>Erhöhen & Vermindern (Wachstumsfaktor)</h4>
<ul><li>+15 % → mal <b>1,15</b></li><li>−25 % → mal <b>0,75</b></li></ul>
<div class="tip">💡 Wichtige Brüche: 50 % = ½, 25 % = ¼, 20 % = ⅕, 10 % = 1/10, 75 % = ¾.</div>`,
 q:[["20 % von 150 € = ? (in €)","=30","W = 150 · 20 / 100 = 30."],
 ["18 von 72 Schülern fahren Rad. Wie viel Prozent sind das?","=25","p = 18 / 72 · 100 = 25 %."],
 ["15 % sind 45 €. Wie groß ist der Grundwert? (in €)","=300","G = 45 · 100 / 15 = 300."],
 ["Ein Pullover kostet 80 € und wird um 25 % reduziert. Neuer Preis in €?","=60","80 · 0,75 = 60."],
 ["50 € werden um 10 % erhöht. Neuer Betrag in €?","=55","50 · 1,1 = 55."],
 ["Was bedeutet der Faktor 1,2?",["20 % weniger","12 % mehr","20 % mehr","2 % mehr"],2,"1,2 = 100 % + 20 % → Erhöhung um 20 %."],
 ["Wie viel sind 3/4 in Prozent?","=75","3/4 = 0,75 = 75 %."]]},
 {id:"m-zins", t:"Zinsrechnung", gen:true, ex:`
<p>Die Zinsrechnung ist Prozentrechnung mit Geld:</p>
<ul><li><b>Kapital K</b> = Grundwert</li><li><b>Zinsen Z</b> = Prozentwert</li><li><b>Zinssatz p %</b> = Prozentsatz</li></ul>
<div class="ex"><b>Jahreszinsen: Z = K · p / 100</b><br><b>Monatszinsen: Z = K · p / 100 · m / 12</b><br><b>Tageszinsen: Z = K · p / 100 · t / 360</b></div>
<p>Bei Banken hat ein Jahr 360 Zinstage, ein Monat 30 Tage.</p>
<h4>Zinseszins</h4><p>Bleiben die Zinsen auf dem Konto, werden sie im nächsten Jahr mitverzinst: K₂ = K · (1 + p/100)².</p>`,
 q:[["2000 € werden 1 Jahr zu 3 % angelegt. Zinsen in €?","=60","Z = 2000 · 3 / 100 = 60."],
 ["500 € werden 6 Monate zu 4 % angelegt. Zinsen in €?","=10","Z = 500 · 4/100 · 6/12 = 10."],
 ["1200 € bringen in einem Jahr 36 € Zinsen. Zinssatz in %?","=3","p = 36 / 1200 · 100 = 3."],
 ["1000 € zu 10 % für 2 Jahre mit Zinseszins. Endkapital in €?","=1210","1000 · 1,1 · 1,1 = 1210."],
 ["Wie viele Zinstage hat ein Bankjahr?",["365","360","300","12"],1,"In der Zinsrechnung rechnet man mit 360 Tagen."],
 ["Welches Kapital bringt bei 5 % in einem Jahr 40 € Zinsen? (in €)","=800","K = 40 · 100 / 5 = 800."]]},
 {id:"m-zuo", t:"Zuordnungen & Dreisatz", gen:true, ex:`
<h4>Proportional („je mehr, desto mehr“)</h4>
<p>Doppelte Menge → doppelter Preis. Alle <b>Quotienten</b> y : x sind gleich. Graph: Gerade durch den Ursprung.</p>
<h4>Antiproportional („je mehr, desto weniger“)</h4>
<p>Doppelt so viele Arbeiter → halbe Zeit. Alle <b>Produkte</b> x · y sind gleich. Graph: Hyperbel.</p>
<h4>Dreisatz</h4>
<div class="ex">3 Hefte kosten 4,50 €.<br>1 Heft kostet 4,50 : 3 = 1,50 €.<br>7 Hefte kosten 7 · 1,50 = <b>10,50 €</b>.</div>
<div class="ex">4 Maler brauchen 6 Tage.<br>1 Maler braucht 6 · 4 = 24 Tage.<br>3 Maler brauchen 24 : 3 = <b>8 Tage</b>.</div>`,
 q:[["3 Hefte kosten 4,50 €. Was kosten 7 Hefte? (in €)","=10.5|10.50","Dreisatz: 4,50 : 3 = 1,50; 1,50 · 7 = 10,50."],
 ["4 Maler brauchen 6 Tage. Wie viele Tage brauchen 3 Maler?","=8","Antiproportional: 4 · 6 = 24; 24 : 3 = 8."],
 ["Welche Zuordnung ist proportional?",["Alter → Körpergröße","Anzahl Brötchen → Preis","Geschwindigkeit → Fahrzeit","Anzahl Personen → Pizza pro Person"],1,"Doppelt so viele Brötchen kosten doppelt so viel."],
 ["Welcher Graph gehört zu einer antiproportionalen Zuordnung?",["Gerade durch den Ursprung","Hyperbel","Waagerechte Linie","Parabel"],1,"Antiproportionale Zuordnungen haben eine Hyperbel als Graphen."],
 ["Ein Auto braucht 6 Liter auf 100 km. Wie viele Liter auf 250 km?","=15","6 : 100 · 250 = 15."],
 ["Bei einer antiproportionalen Zuordnung ist immer gleich …",["die Summe","der Quotient","das Produkt","die Differenz"],2,"x · y = konstant."]]},
 {id:"m-term", t:"Terme & Gleichungen", gen:true, ex:`
<p>Ein <b>Term</b> ist ein Rechenausdruck mit Zahlen und Variablen, z. B. 3x + 5.</p>
<h4>Terme vereinfachen</h4><ul><li>Gleichartige Glieder zusammenfassen: 3x + 5x − 2x = 6x</li>
<li>Ausmultiplizieren: 2(x + 4) = 2x + 8</li><li>Minus vor der Klammer dreht alle Vorzeichen: −(a − 3) = −a + 3</li></ul>
<h4>Gleichungen lösen (Äquivalenzumformung)</h4>
<div class="ex">3x + 7 = 22 &nbsp;| −7<br>3x = 15 &nbsp;| : 3<br><b>x = 5</b><br>Probe: 3·5 + 7 = 22 ✔</div>
<div class="tip">💡 Was du auf einer Seite machst, musst du auch auf der anderen Seite machen – wie bei einer Waage.</div>`,
 q:[["Vereinfache: 3x + 5x − 2x","=6x","3 + 5 − 2 = 6 → 6x."],
 ["Was ergibt 2(x + 4)?",["2x + 4","2x + 8","x + 8","2x + 6"],1,"Jedes Glied mal 2: 2·x + 2·4."],
 ["Löse: 3x + 7 = 22. x = ?","=5","−7 → 3x = 15 → :3 → x = 5."],
 ["Löse: 5x − 3 = 2x + 9. x = ?","=4","−2x → 3x − 3 = 9 → +3 → 3x = 12 → x = 4."],
 ["Löse: x : 4 = 3. x = ?","=12","Mal 4 auf beiden Seiten → x = 12."],
 ["Berechne 2a + 3 für a = −2.","=-1","2·(−2) + 3 = −4 + 3 = −1."],
 ["−(a − 3) = ?",["−a − 3","a + 3","−a + 3","a − 3"],2,"Minus vor der Klammer ändert alle Vorzeichen."]]},
 {id:"m-drei", t:"Dreiecke & Winkel", ex:`
<h4>Winkelsätze</h4><ul><li><b>Innenwinkelsumme im Dreieck:</b> α + β + γ = 180°</li>
<li><b>Nebenwinkel</b> ergänzen sich zu 180°</li><li><b>Scheitelwinkel</b> sind gleich groß</li>
<li>An geschnittenen <b>Parallelen</b>: Stufenwinkel und Wechselwinkel sind gleich groß</li></ul>
<h4>Dreiecksarten</h4><p>Nach Seiten: gleichseitig (alle Winkel 60°), gleichschenklig (zwei gleich große Basiswinkel), unregelmäßig. Nach Winkeln: spitz-, recht-, stumpfwinklig.</p>
<h4>Kongruenzsätze</h4><p>Dreiecke sind deckungsgleich, wenn sie übereinstimmen in: <b>SSS</b>, <b>SWS</b>, <b>WSW</b> (bzw. SWW) oder <b>SsW</b> (Winkel liegt der größeren Seite gegenüber).</p>
<h4>Besondere Linien</h4><ul><li>Mittelsenkrechten schneiden sich im <b>Umkreismittelpunkt</b></li><li>Winkelhalbierende schneiden sich im <b>Inkreismittelpunkt</b></li></ul>`,
 q:[["α = 50°, β = 60°. Wie groß ist γ? (in °)","=70","180 − 50 − 60 = 70."],
 ["Wie groß ist der Nebenwinkel von 35°? (in °)","=145","Nebenwinkel ergeben zusammen 180°."],
 ["Ein Dreieck ist durch alle drei Seiten eindeutig bestimmt. Welcher Kongruenzsatz ist das?",["SWS","WSW","SSS","SsW"],2,"SSS = Seite-Seite-Seite."],
 ["Wo schneiden sich die Mittelsenkrechten?",["Inkreismittelpunkt","Umkreismittelpunkt","Schwerpunkt","Höhenschnittpunkt"],1,"Der Schnittpunkt der Mittelsenkrechten ist von allen Ecken gleich weit entfernt → Umkreis."],
 ["Gleichschenkliges Dreieck: Basiswinkel je 40°. Wie groß ist der Winkel an der Spitze? (in °)","=100","180 − 40 − 40 = 100."],
 ["Scheitelwinkel sind …",["immer 90°","gleich groß","zusammen 180°","zusammen 360°"],1,"Scheitelwinkel liegen sich gegenüber und sind gleich groß."],
 ["Wie groß ist jeder Winkel im gleichseitigen Dreieck? (in °)","=60","180 : 3 = 60."]]},
 {id:"m-flaeche", t:"Flächen: Dreieck, Parallelogramm, Trapez", ex:`
<div class="ex"><b>Rechteck:</b> A = a · b · u = 2a + 2b<br><b>Parallelogramm:</b> A = g · h<br><b>Dreieck:</b> A = ½ · g · h<br><b>Trapez:</b> A = ½ · (a + c) · h<br><b>Kreis:</b> A = π · r², u = 2 · π · r (π ≈ 3,14)</div>
<p>Die <b>Höhe h</b> steht immer <b>senkrecht</b> (90°) auf der Grundseite g – nicht die schräge Seite nehmen!</p>
<h4>Einheiten umrechnen (Faktor 100!)</h4><p>1 m² = 100 dm² = 10 000 cm² · 1 cm² = 100 mm² · 1 ha = 10 000 m²</p>
<div class="tip">💡 Zusammengesetzte Figuren in bekannte Teilfiguren zerlegen und die Flächen addieren.</div>`,
 q:[["Dreieck: g = 8 cm, h = 5 cm. A in cm²?","=20","½ · 8 · 5 = 20."],
 ["Parallelogramm: g = 7 m, h = 4 m. A in m²?","=28","7 · 4 = 28."],
 ["Trapez: a = 10 cm, c = 6 cm, h = 5 cm. A in cm²?","=40","½ · (10 + 6) · 5 = 40."],
 ["Wie viele cm² sind 1 m²?",["100","1000","10 000","1 000 000"],2,"100 · 100 = 10 000."],
 ["Rechteck 6 cm × 4 cm. Umfang in cm?","=20","2·6 + 2·4 = 20."],
 ["Welche Länge braucht man als Höhe?",["die schräge Seite","die Strecke senkrecht zur Grundseite","die längste Seite","die Diagonale"],1,"Die Höhe steht im rechten Winkel auf g."]]},
 {id:"m-koerper", t:"Körper: Quader & Prisma", ex:`
<h4>Quader & Würfel</h4><div class="ex"><b>Volumen:</b> V = a · b · c (Würfel: a³)<br><b>Oberfläche:</b> O = 2·(ab + ac + bc) (Würfel: 6a²)</div>
<h4>Prisma</h4><p>Ein gerades Prisma hat zwei gleiche, parallele Grundflächen (z. B. Dreiecke) und Rechtecke als Seitenflächen (Mantel).</p>
<div class="ex"><b>V = G · h</b> (Grundfläche mal Körperhöhe)<br><b>O = 2 · G + M</b> (M = Umfang der Grundfläche · h)</div>
<h4>Einheiten (Faktor 1000!)</h4><p>1 m³ = 1000 dm³ · 1 dm³ = 1000 cm³ = <b>1 Liter</b> · 1 cm³ = 1 ml</p>
<div class="tip">💡 Netz = aufgeklappter Körper. Schrägbild = räumliche Zeichnung (nach hinten gehende Kanten verkürzt unter 45°).</div>`,
 q:[["Quader 5 cm × 4 cm × 3 cm. Volumen in cm³?","=60","5 · 4 · 3 = 60."],
 ["Würfel mit a = 3 cm. Oberfläche in cm²?","=54","6 · 3² = 54."],
 ["Prisma: Grundfläche 12 cm², Höhe 10 cm. V in cm³?","=120","V = G · h = 120."],
 ["1 dm³ entspricht …",["1 ml","1 Liter","10 Liter","100 ml"],1,"1 dm³ = 1 l."],
 ["Wie viele cm³ sind 1 dm³?","=1000","Faktor 1000 bei Raumeinheiten."],
 ["Ein aufgeklappter Körper heißt …","=netz|körpernetz","Netz."]]},
 {id:"m-wahr", t:"Wahrscheinlichkeit & Daten", gen:true, ex:`
<h4>Laplace-Experiment</h4><p>Alle Ergebnisse sind gleich wahrscheinlich (fairer Würfel, Münze).</p>
<div class="ex"><b>P(E) = Anzahl günstige Ergebnisse / Anzahl mögliche Ergebnisse</b><br>P(Augenzahl 6) = 1/6 · P(gerade Zahl) = 3/6 = 1/2</div>
<h4>Mehrstufige Zufallsexperimente</h4><p>Baumdiagramm: <b>Pfadregel:</b> Wahrscheinlichkeiten entlang eines Pfades multiplizieren. <b>Summenregel:</b> Pfade addieren. P(zweimal Kopf) = ½ · ½ = ¼.</p>
<h4>Daten auswerten</h4><ul><li><b>Mittelwert:</b> Summe : Anzahl</li><li><b>Median:</b> mittlerer Wert der geordneten Liste</li><li><b>Spannweite:</b> größter − kleinster Wert</li></ul>`,
 q:[["Wahrscheinlichkeit, mit einem Würfel eine 6 zu würfeln? (als Bruch)","=1/6","1 günstiges von 6 möglichen Ergebnissen."],
 ["P(gerade Zahl) beim Würfel = ?",["1/6","1/3","1/2","2/3"],2,"2, 4, 6 → 3 von 6 = 1/2."],
 ["Mittelwert von 2, 4, 6, 8?","=5","(2+4+6+8) : 4 = 20 : 4 = 5."],
 ["Median von 3, 9, 1, 7, 5?","=5","Geordnet: 1, 3, 5, 7, 9 → Mitte ist 5."],
 ["Eine Münze wird zweimal geworfen. P(zweimal Kopf)? (als Bruch)","=1/4","Pfadregel: ½ · ½ = ¼."],
 ["Spannweite von 12, 5, 20, 8?","=15","20 − 5 = 15."]]}
]},

 {id:"d-satz", t:"Satzglieder", ex:`
<p>Satzglieder findest du mit der <b>Umstellprobe</b>: Was zusammen verschoben werden kann, ist ein Satzglied.</p>
<ul><li><b>Subjekt:</b> Wer oder was? – <i>Der Hund</i> bellt.</li>
<li><b>Prädikat:</b> Was tut/geschieht? – Der Hund <i>bellt</i>.</li>
<li><b>Dativobjekt:</b> Wem? – Er hilft <i>dem Mann</i>.</li>
<li><b>Akkusativobjekt:</b> Wen oder was? – Sie liest <i>ein Buch</i>.</li>
<li><b>Genitivobjekt:</b> Wessen? (selten)</li>
<li><b>Adverbiale Bestimmungen:</b> Zeit (Wann?), Ort (Wo?), Art und Weise (Wie?), Grund (Warum?)</li></ul>
<div class="ex">Am Morgen (Zeit) | bringt (Prädikat) | der Hund (Subjekt) | dem Jungen (Dativobj.) | den Ball (Akkusativobj.).</div>`,
 q:[["„Der Hund bringt dem Jungen den Ball.“ – Was ist das Dativobjekt?",["Der Hund","dem Jungen","den Ball","bringt"],1,"Wem bringt er den Ball? – dem Jungen."],
 ["Im selben Satz: Was ist das Akkusativobjekt?",["den Ball","dem Jungen","Der Hund","bringt"],0,"Wen oder was bringt er? – den Ball."],
 ["„Am Morgen gehe ich joggen.“ – „Am Morgen“ ist …",["Subjekt","adverbiale Bestimmung der Zeit","Akkusativobjekt","Prädikat"],1,"Wann? – Am Morgen."],
 ["Mit welcher Frage findest du das Subjekt?",["Wem?","Wen oder was?","Wer oder was?","Wo?"],2,"Das Subjekt antwortet auf „Wer oder was?“"],
 ["„Wegen des Regens bleiben wir zu Hause.“ – „Wegen des Regens“ ist eine adverbiale Bestimmung des …",["Ortes","Grundes","der Zeit","der Art und Weise"],1,"Warum? – Wegen des Regens."],
 ["Mit welcher Probe bestimmt man Satzglieder?",["Ersatzprobe","Umstellprobe","Weglassprobe","Klangprobe"],1,"Satzglieder lassen sich als Block umstellen."]]},
 {id:"d-passiv", t:"Aktiv & Passiv", ex:`
<p><b>Aktiv:</b> Wer tut etwas? – <i>Der Koch bereitet das Essen zu.</i><br><b>Passiv:</b> Was geschieht? – <i>Das Essen wird (vom Koch) zubereitet.</i></p>
<h4>Vorgangspassiv: werden + Partizip II</h4>
<ul><li>Präsens: Das Haus <b>wird gebaut</b>.</li><li>Präteritum: Das Haus <b>wurde gebaut</b>.</li>
<li>Perfekt: Das Haus <b>ist gebaut worden</b>.</li><li>Futur: Das Haus <b>wird gebaut werden</b>.</li></ul>
<h4>Zustandspassiv: sein + Partizip II</h4><p>Beschreibt das Ergebnis: <i>Das Fenster ist geöffnet.</i></p>
<div class="tip">💡 Das Akkusativobjekt im Aktiv wird im Passiv zum Subjekt.</div>`,
 q:[["„Der Lehrer korrigiert die Arbeit.“ im Passiv:",["Die Arbeit korrigiert den Lehrer.","Die Arbeit wird vom Lehrer korrigiert.","Die Arbeit ist vom Lehrer korrigierend.","Der Lehrer wird korrigiert."],1,"werden + Partizip II; Akkusativobjekt wird Subjekt."],
 ["„Das Haus wurde gebaut.“ – Welche Zeitform?",["Präsens","Präteritum","Perfekt","Futur"],1,"„wurde“ = Präteritum von werden."],
 ["„Der Brief ist geschrieben worden.“ – Welche Zeitform?",["Perfekt","Präteritum","Plusquamperfekt","Präsens"],0,"ist … worden = Perfekt Passiv."],
 ["Welcher Satz steht im Zustandspassiv?",["Die Tür wird geöffnet.","Die Tür ist geöffnet.","Er öffnet die Tür.","Die Tür wurde geöffnet."],1,"sein + Partizip II = Zustandspassiv."],
 ["Das Passiv bildet man mit …",["haben + Infinitiv","werden + Partizip II","sein + Infinitiv","werden + Infinitiv"],1,"Vorgangspassiv: werden + Partizip II."]]},
 {id:"d-dass", t:"das/dass & Kommas", ex:`
<h4>das oder dass?</h4><ul><li><b>das</b> = Artikel, Relativpronomen oder Demonstrativpronomen → lässt sich durch <b>dieses, jenes, welches</b> ersetzen.</li>
<li><b>dass</b> = Konjunktion, leitet einen Nebensatz ein → Ersatzprobe klappt nicht.</li></ul>
<div class="ex">Das Buch, <b>das</b> (welches) ich lese, ist spannend.<br>Ich hoffe, <b>dass</b> du kommst.</div>
<h4>Kommaregeln</h4><ul><li>Zwischen Haupt- und Nebensatz (weil, dass, obwohl, wenn, als …)</li>
<li>Relativsätze werden eingeschlossen</li><li>Aufzählungen – aber <b>nicht vor „und“/„oder“</b></li>
<li>Vor <b>aber, sondern, doch</b></li><li>Appositionen: Herr Lu, <i>unser Lehrer</i>, ist krank.</li>
<li>Infinitivgruppen mit <b>um, ohne, statt, anstatt</b> zu</li></ul>`,
 q:[["Ich hoffe, ___ du morgen kommst.",["das","dass"],1,"Ersatzprobe mit „welches“ klappt nicht → Konjunktion „dass“."],
 ["Das Buch, ___ ich lese, ist spannend.",["das","dass"],0,"„welches ich lese“ → Relativpronomen „das“."],
 ["Ich glaube, ___ ___ stimmt.",["das – dass","dass – das","dass – dass","das – das"],1,"Ich glaube, dass das (dieses) stimmt."],
 ["Welcher Satz ist richtig?",["Ich gehe nach Hause weil ich müde bin.","Ich gehe, nach Hause weil ich müde bin.","Ich gehe nach Hause, weil ich müde bin.","Ich gehe nach Hause weil, ich müde bin."],2,"Komma vor dem Nebensatz mit „weil“."],
 ["Welcher Satz ist richtig?",["Wir kaufen Äpfel, Birnen, und Bananen.","Wir kaufen Äpfel, Birnen und Bananen.","Wir kaufen Äpfel Birnen, und Bananen.","Wir kaufen, Äpfel, Birnen und Bananen."],1,"Kein Komma vor „und“ in Aufzählungen."],
 ["Welcher Satz ist richtig?",["Er lernt um, die Arbeit zu bestehen.","Er lernt, um die Arbeit zu bestehen.","Er lernt um die Arbeit, zu bestehen.","Er, lernt um die Arbeit zu bestehen."],1,"Komma vor Infinitivgruppe mit „um … zu“."]]},
 {id:"d-ball", t:"Balladen", ex:`
<p>Eine <b>Ballade</b> ist ein erzählendes Gedicht mit spannender, oft dramatischer Handlung. Sie verbindet alle drei Gattungen: <b>Lyrik</b> (Verse, Strophen, Reim), <b>Epik</b> (es wird erzählt) und <b>Dramatik</b> (Spannung, wörtliche Rede). Goethe nannte sie das „Ur-Ei“ der Dichtung.</p>
<h4>Fachbegriffe</h4><ul><li><b>Vers</b> = Gedichtzeile · <b>Strophe</b> = Abschnitt</li>
<li><b>Paarreim</b> aabb · <b>Kreuzreim</b> abab · <b>umarmender Reim</b> abba</li>
<li>Lyrisches Ich / Erzähler, Spannungsbogen, Höhepunkt, Wendepunkt</li></ul>
<h4>Bekannte Balladen</h4><ul><li>Goethe: „Erlkönig“, „Der Zauberlehrling“</li><li>Schiller: „Der Handschuh“, „Die Bürgschaft“</li><li>Fontane: „John Maynard“, „Die Brück’ am Tay“, „Herr von Ribbeck auf Ribbeck im Havelland“ (Brandenburg!)</li></ul>
<div class="tip">💡 Bei der Analyse: Inhalt kurz zusammenfassen → Aufbau & Spannung → sprachliche Mittel (Personifikation, Vergleich, Wiederholung) → Wirkung.</div>`,
 q:[["Welches Reimschema ist ein Kreuzreim?",["aabb","abab","abba","abcd"],1,"Kreuzreim: abab."],
 ["Welche drei Gattungen vereint die Ballade?",["Roman, Drama, Märchen","Lyrik, Epik, Dramatik","Sage, Fabel, Legende","Bericht, Brief, Gedicht"],1,"Goethe: Ballade = „Ur-Ei“ mit allen drei Gattungen."],
 ["Wer schrieb den „Erlkönig“?",["Schiller","Fontane","Goethe","Heine"],2,"Johann Wolfgang von Goethe, 1782."],

 ["Was ist ein Vers?",["Eine Strophe","Eine Gedichtzeile","Ein Reim","Der Titel"],1,"Ein Vers ist eine Zeile im Gedicht."],
 ["aabb ist ein …",["Kreuzreim","umarmender Reim","Paarreim","Schweifreim"],2,"Zwei aufeinanderfolgende Verse reimen sich."]]},
 {id:"d-inhalt", t:"Inhaltsangabe", ex:`
<p>Eine <b>Inhaltsangabe</b> informiert sachlich und knapp über das Wichtigste eines Textes.</p>
<h4>Aufbau</h4><ul><li><b>Einleitung (TATTE):</b> Titel, Autor, Textsorte, Thema, Erscheinungsjahr</li>
<li><b>Hauptteil:</b> wichtigste Handlungsschritte in richtiger Reihenfolge, Zusammenhänge (weil, deshalb)</li>
<li><b>Schluss</b> (optional): kurze Deutung / Absicht des Textes</li></ul>
<h4>Regeln</h4><ul><li>Tempus: <b>Präsens</b> (Vorzeitiges im Perfekt)</li><li><b>Keine wörtliche Rede</b> – indirekte Rede oder umschreiben</li>
<li>Sachlich, keine Spannung, keine eigene Meinung, eigene Worte</li></ul>
<div class="ex">In der Ballade „John Maynard“ von Theodor Fontane aus dem Jahr 1886 geht es um einen Steuermann, der sein Leben opfert, um die Passagiere eines brennenden Schiffes zu retten.</div>`,

 ["Was gehört NICHT in eine Inhaltsangabe?",["Titel und Autor","wörtliche Rede","wichtigste Handlungsschritte","Thema"],1,"Wörtliche Rede wird umschrieben oder in indirekte Rede gesetzt."],
 ["Wofür steht das erste T in TATTE?",["Thema","Text","Titel","Teil"],2,"Titel, Autor, Textsorte, Thema, Erscheinungsjahr."],
 ["Wie soll eine Inhaltsangabe geschrieben sein?",["spannend und ausgeschmückt","sachlich und knapp","mit vielen Zitaten","aus der Ich-Perspektive"],1,"Sachlich, knapp, in eigenen Worten."],
 ["Was gehört in die Einleitung?",["Die eigene Meinung","Der Höhepunkt","Titel, Autor, Textsorte, Thema, Jahr","Das Ende der Geschichte"],2,"TATTE-Satz."]]},
 {id:"d-erz", t:"Erzähltexte untersuchen", ex:`
<p>Wer eine Geschichte untersucht, fragt: <b>Wer erzählt? Wie wird erzählt?</b> Wichtig: Der <b>Erzähler</b> ist nicht der <b>Autor</b>! Der Autor erfindet den Erzähler.</p>
<h4>Erzählform</h4><ul><li><b>Ich-Erzähler:</b> Eine Figur erzählt selbst („Ich rannte los …“) – man kennt nur ihre Gedanken.</li><li><b>Er-/Sie-Erzähler:</b> Es wird über die Figuren erzählt („Sie rannte los …“).</li></ul>
<h4>Erzählverhalten (Erzählperspektive)</h4><ul><li><b>Auktorial:</b> allwissender Erzähler, kennt Gedanken aller Figuren, kommentiert, greift vor („Er ahnte noch nicht, dass …“)</li>
<li><b>Personal:</b> erzählt aus der Sicht einer Figur, weiß nur, was sie weiß und fühlt</li><li><b>Neutral:</b> wie eine Kamera – nur, was man sehen und hören kann, keine Gedanken</li></ul>
<h4>Zeit</h4><p><b>Erzählzeit</b> = wie lange man zum Lesen braucht · <b>erzählte Zeit</b> = wie lange die Handlung dauert. Zeitraffung (ein Jahr in einem Satz), Zeitdehnung (eine Sekunde über eine Seite), Rückblende.</p>
<div class="tip">💡 In der Analyse immer mit Textbeleg arbeiten: „Der Erzähler ist auktorial, denn er kennt die Gedanken beider Figuren (Z. 12).“</div>`,
 q:[["„Ich wusste nicht, was ich sagen sollte.“ – Welche Erzählform?",["Er-Erzähler","Ich-Erzähler","neutraler Erzähler","Autor"],1,"Eine Figur erzählt selbst → Ich-Erzähler."],
 ["Ein Erzähler kennt die Gedanken ALLER Figuren und kommentiert. Er ist …",["personal","neutral","auktorial","Ich-Erzähler"],2,"Allwissend → auktorial."],

 ["Ein Jahr wird in einem Satz erzählt. Das nennt man …",["Zeitdehnung","Zeitraffung","Rückblende","Vorausdeutung"],1,"Viel Zeit, wenig Text → Zeitraffung."],
 ["Die Zeit, die man zum LESEN braucht, heißt …","=erzählzeit|erzaehlzeit","Erzählzeit (im Gegensatz zur erzählten Zeit)."]]},
 {id:"d-figur", t:"Figuren charakterisieren & Jugendroman", ex:`
<p>Im Unterricht lest ihr meist eine <b>Ganzschrift</b> (Jugendroman), z. B. „Krabat“, „Tschick“, „Die Welle“, „Rico, Oskar und die Tieferschatten“ oder „Die Nibelungen“. Dazu schreibt man oft eine <b>Charakterisierung</b>.</p>
<h4>Direkte & indirekte Charakterisierung</h4><ul><li><b>Direkt:</b> Eigenschaften werden ausdrücklich genannt („Sie war mutig.“)</li><li><b>Indirekt:</b> man erschließt sie aus Verhalten, Sprache, Gedanken („Ohne zu zögern sprang sie ins Wasser.“ → mutig)</li></ul>
<h4>Aufbau einer Charakterisierung</h4><ol><li><b>Einleitung:</b> Titel, Autor, Textsorte, Figur kurz vorstellen</li><li><b>Hauptteil:</b> äußere Merkmale (Alter, Aussehen, Lebensumstände) → Verhalten → Eigenschaften mit Textbelegen → Beziehungen zu anderen Figuren → Entwicklung</li><li><b>Schluss:</b> eigene Bewertung der Figur</li></ol>
<p><b>Figurenkonstellation:</b> Übersicht, wie die Figuren zueinander stehen (Freunde, Gegner, Familie) – oft als Schaubild. <b>Protagonist</b> = Hauptfigur, <b>Antagonist</b> = Gegenspieler.</p>
<div class="tip">💡 Tempus: Präsens. Belege mit Zitat und Seitenzahl: (S. 34, Z. 5).</div>`,
 q:[["„Sie war sehr hilfsbereit.“ – Welche Art der Charakterisierung?",["indirekt","direkt","neutral","auktorial"],1,"Die Eigenschaft wird ausdrücklich genannt."],
 ["„Er teilte sein letztes Brot mit dem Fremden.“ zeigt Großzügigkeit. Das ist …",["direkte Charakterisierung","indirekte Charakterisierung","Figurenkonstellation","Exposition"],1,"Die Eigenschaft muss aus dem Verhalten erschlossen werden."],
 ["Wie heißt der Gegenspieler der Hauptfigur?",["Protagonist","Antagonist","Erzähler","Statist"],1,"Antagonist = Gegenspieler."],
 ["Ein Schaubild, das die Beziehungen der Figuren zeigt, heißt …",["Figurenkonstellation","Mindmap der Zeit","Spannungskurve","Inhaltsangabe"],0,"Figurenkonstellation."],
 ["In welcher Zeitform schreibt man eine Charakterisierung?",["Präteritum","Präsens","Futur","Perfekt"],1,"Wie die Inhaltsangabe im Präsens."],
 ["Was gehört in den Schluss einer Charakterisierung?",["neue Textstellen","eigene Bewertung der Figur","die Inhaltsangabe","Reimschema"],1,"Am Ende bewertest du die Figur."]]},
 {id:"d-kurz", t:"Kurzgeschichte & andere Erzählformen", ex:`
<h4>Kurzgeschichte – Merkmale</h4><ul><li><b>Unvermittelter Anfang</b> – man ist sofort mitten im Geschehen</li><li><b>Offenes Ende</b> – der Leser denkt selbst weiter</li><li>Alltagssituation, oft ein <b>Wendepunkt</b> im Leben einer Figur</li><li>wenige Figuren, kurze Handlungszeit, einfache Alltagssprache</li></ul>
<p>Bekannte Autoren: Wolfgang Borchert („Das Brot“, „Nachts schlafen die Ratten doch“), Heinrich Böll.</p>
<h4>Weitere Erzählformen</h4><ul><li><b>Kalendergeschichte:</b> kurze, unterhaltsame Geschichte mit Lehre (Johann Peter Hebel, Bertolt Brecht)</li><li><b>Anekdote:</b> kurze, pointierte Geschichte über eine bekannte Person</li><li><b>Sage:</b> enthält einen wahren Kern (Ort, Person), z. B. Nibelungensage, Sagen aus dem Spreewald</li><li><b>Fabel:</b> Tiere mit menschlichen Eigenschaften, Moral am Ende</li><li><b>Novelle:</b> mittellange Erzählung über eine „unerhörte Begebenheit“</li></ul>`,
 q:[["Welches Merkmal hat eine Kurzgeschichte?",["Es war einmal …","offenes Ende","Moral am Ende","Reime"],1,"Kurzgeschichten enden meist offen."],
 ["Wie beginnt eine Kurzgeschichte meistens?",["mit einer langen Einleitung","unvermittelt, mitten im Geschehen","mit „Es war einmal“","mit einem Gedicht"],1,"Unvermittelter Einstieg."],
 ["Wer schrieb „Das Brot“?",["Goethe","Wolfgang Borchert","Fontane","Hebel"],1,"Wolfgang Borchert, 1946."],
 ["Eine Geschichte mit Tieren, die menschlich handeln, und einer Moral ist eine …",["Sage","Fabel","Novelle","Anekdote"],1,"Fabel."],
 ["Was hat eine Sage im Gegensatz zum Märchen?",["sprechende Tiere","einen wahren Kern","immer ein Happy End","Reime"],1,"Sagen beziehen sich auf reale Orte, Personen oder Ereignisse."],
 ["Johann Peter Hebel ist bekannt für …",["Kalendergeschichten","Dramen","Balladen","Romane"],0,"Kalendergeschichten."]]},
 {id:"d-lyrik", t:"Gedichte & sprachliche Mittel", ex:`
<h4>Aufbau</h4><p>Strophe, Vers, Reim (Paarreim aabb, Kreuzreim abab, umarmender Reim abba), <b>lyrisches Ich</b> = die Stimme, die im Gedicht spricht.</p>
<h4>Metrum (Versmaß)</h4><ul><li><b>Jambus:</b> unbetont – betont (x X): „Ge-<b>dicht</b>“</li><li><b>Trochäus:</b> betont – unbetont (X x): „<b>Son</b>-ne“</li><li><b>Daktylus:</b> X x x · <b>Anapäst:</b> x x X</li></ul>
<h4>Sprachliche Mittel</h4><ul><li><b>Vergleich:</b> mit „wie“: stark wie ein Löwe</li><li><b>Metapher:</b> bildhaft ohne „wie“: Er ist ein Löwe.</li>
<li><b>Personifikation:</b> Dinge handeln menschlich: Der Wind singt.</li><li><b>Alliteration:</b> gleiche Anfangslaute: Milch macht müde Männer munter.</li>
<li><b>Anapher:</b> gleicher Versanfang wird wiederholt</li><li><b>Enjambement:</b> der Satz geht über das Versende hinaus</li><li><b>Lautmalerei:</b> klirr, zisch, plumps</li><li><b>Hyperbel:</b> Übertreibung: Ich hab dir das tausendmal gesagt!</li></ul>
<div class="tip">💡 Bei der Analyse immer sagen, welche WIRKUNG ein Mittel hat – nicht nur, dass es da ist.</div>`,
 q:[["„Der Wind heult ums Haus.“",["Vergleich","Personifikation","Alliteration","Anapher"],1,"Der Wind handelt wie ein Mensch/Tier."],
 ["„Sie ist schnell wie der Blitz.“",["Metapher","Vergleich","Hyperbel","Enjambement"],1,"Mit „wie“ → Vergleich."],
 ["„Er ist ein Fels in der Brandung.“",["Vergleich","Metapher","Lautmalerei","Personifikation"],1,"Bildhaft ohne „wie“ → Metapher."],
 ["„Milch macht müde Männer munter.“",["Alliteration","Anapher","Metapher","Hyperbel"],0,"Gleicher Anfangslaut."],
 ["Unbetont – betont (x X) heißt …",["Trochäus","Jambus","Daktylus","Anapäst"],1,"Jambus."],
 ["Die Stimme, die im Gedicht spricht, nennt man …","=lyrisches ich|das lyrische ich","Das lyrische Ich – nicht der Dichter selbst!"],
 ["Der Satz läuft über das Versende in den nächsten Vers. Das ist ein …",["Enjambement","Reim","Refrain","Vers"],0,"Enjambement (Zeilensprung)."]]},
 {id:"d-drama", t:"Drama & Theater", ex:`
<p>Ein <b>Drama</b> ist ein Text, der für die Bühne geschrieben ist. Die Handlung entsteht durch das, was die Figuren sagen und tun.</p>
<ul><li><b>Akt</b> = großer Abschnitt · <b>Szene/Auftritt</b> = kleiner Abschnitt (wenn Figuren auf- oder abtreten)</li>
<li><b>Dialog</b> = Gespräch mehrerer Figuren · <b>Monolog</b> = eine Figur spricht allein (oft ihre Gedanken)</li>
<li><b>Regieanweisungen</b> (meist kursiv/in Klammern): sagen, wie gespielt wird – (flüstert), (geht zur Tür)</li>
<li><b>Nebentext</b> = Regieanweisungen · <b>Haupttext</b> = was die Figuren sprechen</li></ul>
<h4>Aufbau (klassisch in 5 Akten)</h4><p>1. <b>Exposition</b> (Einführung) → 2. steigende Handlung → 3. <b>Höhepunkt/Wendepunkt</b> → 4. fallende Handlung → 5. <b>Katastrophe</b> (Tragödie) bzw. Lösung (Komödie)</p>
<p><b>Tragödie</b> = Trauerspiel, endet schlimm · <b>Komödie</b> = Lustspiel, endet glücklich</p>
<div class="tip">💡 Szenisches Spiel, Standbild und Rollenbiografie helfen, Figuren besser zu verstehen.</div>`,
 q:[["Eine Figur spricht allein auf der Bühne. Das ist ein …",["Dialog","Monolog","Chor","Prolog"],1,"Mono = allein."],
 ["Was sind Regieanweisungen?",["Was die Figuren sagen","Hinweise, wie gespielt wird","Der Titel","Die Pause"],1,"Sie stehen meist kursiv oder in Klammern."],
 ["Wie heißt die Einführung zu Beginn eines Dramas?",["Katastrophe","Exposition","Höhepunkt","Epilog"],1,"In der Exposition lernt man Figuren und Situation kennen."],
 ["Ein Drama, das schlimm endet, ist eine …",["Komödie","Tragödie","Fabel","Ballade"],1,"Tragödie = Trauerspiel."],
 ["Ein größerer Abschnitt eines Dramas heißt …","=akt|aufzug","Akt (Aufzug); kleinere Abschnitte sind Szenen."],
 ["Ein Gespräch zwischen mehreren Figuren heißt …",["Monolog","Dialog","Regieanweisung","Strophe"],1,"Dialog."]]},
 {id:"d-sach", t:"Sachtexte & Werbung", ex:`
<h4>Sachtexte erschließen (5-Schritt-Lesemethode)</h4><ol><li>Überfliegen (Überschrift, Bilder)</li><li>Fragen an den Text stellen</li><li>Gründlich lesen, Schlüsselwörter markieren</li><li>Abschnitte zusammenfassen</li><li>Wiederholen/Ergebnis festhalten</li></ol>
<p><b>Diskontinuierliche Texte</b> = Tabellen, Diagramme, Grafiken (ohne Fließtext). <b>Kontinuierliche Texte</b> = Fließtexte.</p>
<h4>Textsorten</h4><p><b>Bericht</b> (sachlich, W-Fragen, Präteritum), <b>Nachricht</b>, <b>Reportage</b> (lebendig, Präsens), <b>Kommentar</b> (Meinung).</p>
<h4>Werbung</h4><ul><li><b>AIDA-Formel:</b> Attention (Aufmerksamkeit) → Interest (Interesse) → Desire (Wunsch) → Action (Kauf)</li>
<li>Bestandteile: Bild, <b>Slogan</b> (einprägsamer Spruch), Headline, Fließtext, Logo/Marke</li><li>Sprachliche Mittel: Superlative, Reime, Anglizismen, Imperative („Hol dir …“), Wortneuschöpfungen</li></ul>`,
 q:[["Wofür steht das D in der AIDA-Formel?",["Design","Desire (Wunsch)","Dialog","Dauer"],1,"Attention, Interest, Desire, Action."],
 ["Ein kurzer, einprägsamer Werbespruch heißt …","=slogan","Slogan, z. B. „Haribo macht Kinder froh“."],
 ["Ein Diagramm ist ein …",["kontinuierlicher Text","diskontinuierlicher Text","literarischer Text","Gedicht"],1,"Kein Fließtext → diskontinuierlich."],
 ["Welche Textsorte enthält die Meinung des Autors?",["Bericht","Nachricht","Kommentar","Tabelle"],2,"Ein Kommentar bewertet."],
 ["„Hol dir jetzt den neuen Geschmack!“ – Welches Mittel?",["Imperativ","Metapher","Passiv","Konjunktiv"],0,"Aufforderung → Imperativ."],
 ["In welcher Zeitform schreibt man einen Bericht?",["Präsens","Präteritum","Futur","Plusquamperfekt"],1,"Berichte stehen im Präteritum."]]},
 {id:"d-konj", t:"Indirekte Rede & Konjunktiv I", ex:`
<p>Mit der <b>indirekten Rede</b> gibst du wieder, was jemand gesagt hat – z. B. in Inhaltsangaben oder Zeitungsberichten. Dafür benutzt man den <b>Konjunktiv I</b>.</p>
<div class="ex">Direkt: Tim sagt: „Ich <b>bin</b> müde.“<br>Indirekt: Tim sagt, er <b>sei</b> müde.</div>
<h4>Bildung: Stamm + Endung</h4><table class="tb"><tr><th></th><th>haben</th><th>sein</th><th>kommen</th></tr>
<tr><td>ich</td><td>habe*</td><td>sei</td><td>komme*</td></tr><tr><td>du</td><td>habest</td><td>seist</td><td>kommest</td></tr>
<tr><td>er/sie/es</td><td><b>habe</b></td><td><b>sei</b></td><td><b>komme</b></td></tr><tr><td>wir</td><td>haben*</td><td>seien</td><td>kommen*</td></tr><tr><td>sie</td><td>haben*</td><td><b>seien</b></td><td>kommen*</td></tr></table>
<p>* Klingt der Konjunktiv I wie der Indikativ, nimmt man den <b>Konjunktiv II</b> (oder „würde“): Sie sagen, sie <b>hätten</b> keine Zeit.</p>
<div class="tip">💡 Pronomen anpassen: „ich“ → „er/sie“, „mein“ → „sein/ihr“. Fragen: „ob“ oder Fragewort: Sie fragt, ob er komme.</div>`,
 q:[["Tim sagt: „Ich bin müde.“ → Tim sagt, er ___ müde.","=sei","Konjunktiv I von sein: er sei."],
 ["Lea sagt: „Ich habe Hunger.“ → Lea sagt, sie ___ Hunger.","=habe","Konjunktiv I: sie habe."],
 ["Die Kinder sagen: „Wir haben keine Zeit.“ → Die Kinder sagen, sie ___ keine Zeit.",["haben","hätten","habe","hatten"],1,"Konj. I (haben) = Indikativ → Ersatz durch Konj. II: hätten."],
 ["Er fragt: „Kommst du mit?“ → Er fragt, ___ ich mitkomme.",["dass","ob","weil","wenn"],1,"Ja/Nein-Frage → „ob“."],
 ["Wofür braucht man die indirekte Rede z. B.?",["für Gedichte","für Inhaltsangaben und Berichte","für Rechenaufgaben","für Reime"],1,"Wörtliche Rede wird in Inhaltsangaben umgeformt."],
 ["Konjunktiv I von „er geht“?","=er gehe|gehe","Stamm geh- + e → er gehe."]]},
 {id:"d-temp", t:"Tempora & Partizipien", ex:`
<table class="tb"><tr><th>Tempus</th><th>Beispiel</th></tr>
<tr><td>Präsens</td><td>ich <b>lese</b></td></tr><tr><td>Präteritum</td><td>ich <b>las</b></td></tr><tr><td>Perfekt</td><td>ich <b>habe gelesen</b></td></tr>
<tr><td>Plusquamperfekt</td><td>ich <b>hatte gelesen</b></td></tr><tr><td>Futur I</td><td>ich <b>werde lesen</b></td></tr><tr><td>Futur II</td><td>ich <b>werde gelesen haben</b></td></tr></table>
<p><b>Plusquamperfekt</b> = Vorvergangenheit: Etwas passierte <i>vor</i> einem anderen Ereignis in der Vergangenheit. <i>Nachdem sie gegessen <b>hatte</b>, ging sie los.</i></p>
<h4>Partizip I und II</h4><ul><li><b>Partizip I</b> = Infinitiv + d: lachend, singend → <i>das lachende Kind</i> (gleichzeitig, aktiv)</li><li><b>Partizip II</b>: gelacht, gesungen, gelesen → <i>das gelesene Buch</i> (abgeschlossen, oft passiv)</li></ul>
<div class="tip">💡 Erzählungen stehen meist im Präteritum, Vorzeitiges im Plusquamperfekt.</div>`,
 q:[["„Ich hatte gegessen.“ – Welche Zeitform?",["Perfekt","Präteritum","Plusquamperfekt","Futur II"],2,"hatte + Partizip II = Plusquamperfekt."],
 ["„Wir werden gewinnen.“ – Welche Zeitform?",["Futur I","Präsens","Perfekt","Futur II"],0,"werden + Infinitiv = Futur I."],
 ["Nachdem er die Hausaufgaben ___ (machen), spielte er Fußball.","=gemacht hatte|hatte gemacht","Vorzeitigkeit in der Vergangenheit → Plusquamperfekt."],
 ["Was ist ein Partizip I?",["gelacht","lachend","lachte","lacht"],1,"Infinitiv + d."],
 ["Präteritum von „gehen“, 1. Person: ich ___","=ging","gehen – ging – gegangen."],
 ["„das gelesene Buch“ – „gelesene“ ist ein …",["Partizip I","Partizip II","Infinitiv","Imperativ"],1,"Partizip II von lesen."]]},
 {id:"d-satzbau", t:"Satzreihe, Satzgefüge & Attribute", ex:`
<ul><li><b>Satzreihe</b> = Hauptsatz + Hauptsatz (verbunden mit und, oder, aber, denn, doch): <i>Es regnet, aber wir gehen raus.</i></li>
<li><b>Satzgefüge</b> = Hauptsatz + Nebensatz: <i>Wir bleiben drinnen, weil es regnet.</i> Im Nebensatz steht das konjugierte Verb am <b>Ende</b>.</li>
<li><b>Relativsatz</b> = Nebensatz, der ein Nomen näher beschreibt (der, die, das, welcher …): <i>Das Buch, das ich lese, ist spannend.</i></li></ul>
<h4>Attribute</h4><p>Attribute sind <b>Teile von Satzgliedern</b>, die ein Nomen genauer beschreiben (Frage: <i>Was für ein …?</i>). Sie lassen sich nicht allein umstellen.</p>
<ul><li>Adjektivattribut: der <b>alte</b> Ritter</li><li>Genitivattribut: das Haus <b>meines Onkels</b></li><li>Präpositionalattribut: das Haus <b>am See</b></li><li>Relativsatz als Attribut: der Ritter, <b>der mutig kämpfte</b></li></ul>
<div class="tip">💡 Zwischen Hauptsatz und Nebensatz steht immer ein Komma.</div>`,
 q:[["„Ich lerne, weil ich morgen eine Arbeit schreibe.“ ist eine …",["Satzreihe","Satzgefüge","Aufzählung","Apposition"],1,"Hauptsatz + Nebensatz."],
 ["„Ich lerne und meine Schwester spielt.“ ist eine …",["Satzreihe","Satzgefüge","Relativsatz","Infinitivgruppe"],0,"Zwei Hauptsätze."],
 ["Wo steht im Nebensatz das konjugierte Verb?",["am Anfang","an zweiter Stelle","am Ende","egal"],2,"…, weil es regnet."],
 ["„das Haus am See“ – „am See“ ist ein …",["Adverbiale","Präpositionalattribut","Subjekt","Prädikat"],1,"Es beschreibt das Nomen Haus genauer."],
 ["„das Fahrrad meines Bruders“ – Welches Attribut?",["Adjektivattribut","Genitivattribut","Relativsatz","Apposition"],1,"Wessen Fahrrad? → Genitiv."],
 ["Mit welcher Frage findet man Attribute?",["Wer oder was?","Was für ein …?","Wann?","Wem?"],1,"Attribute antworten auf „Was für ein …?“"]]},
 {id:"d-recht", t:"Rechtschreibung: s/ss/ß, Nominalisierung & Zeitangaben", ex:`
<h4>s, ss oder ß?</h4><ul><li><b>ss</b> nach <b>kurzem</b> Vokal: Fluss, Kuss, wissen, dass</li><li><b>ß</b> nach <b>langem</b> Vokal oder Doppellaut (au, ei, eu): Fuß, Straße, groß, heißen, draußen</li><li><b>s</b>: wenn man beim Verlängern ein weiches s hört: Haus – Häuser, Gras – Gräser</li></ul>
<h4>i oder ie?</h4><p>Langes i meist <b>ie</b> (Liebe, spielen). Ausnahmen: mir, dir, wir, Tiger, Maschine. Kurzes i: <b>i</b> (Kind, Mitte).</p>
<h4>Nominalisierung (großschreiben!)</h4><p>Verben und Adjektive werden zu Nomen, wenn ein <b>Artikel</b>, eine <b>Präposition mit Artikel</b> (beim, zum) oder ein Wort wie <b>etwas, nichts, viel, alles</b> davorsteht: <i>beim <b>Laufen</b>, das <b>Lesen</b>, etwas <b>Schönes</b>, nichts <b>Neues</b></i>.</p>
<h4>Zeitangaben</h4><ul><li>Groß: am <b>Abend</b>, heute <b>Morgen</b>, am <b>Montag</b>, der <b>Montagabend</b></li><li>Klein (mit -s = Adverb): <b>abends</b>, <b>montags</b>, <b>morgens</b></li></ul>`,
 q:[["Fu_ (Körperteil)",["s","ss","ß"],2,"Langer Vokal → ß: Fuß."],
 ["Flu_ (Gewässer)",["s","ss","ß"],1,"Kurzer Vokal → ss: Fluss."],
 ["Welche Schreibung ist richtig?",["beim laufen","beim Laufen","Beim laufen","beim läufen"],1,"„beim“ macht das Verb zum Nomen."],
 ["Welche Schreibung ist richtig?",["etwas schönes","etwas Schönes","Etwas schönes","etwas Schönnes"],1,"Nach „etwas“ wird das Adjektiv nominalisiert."],
 ["Welche Schreibung ist richtig?",["am montag","Montags","heute morgen","am Montag"],3,"Nach „am“ großgeschrieben; montags klein (mit -s)."],
 ["Welches Wort wird mit „ie“ geschrieben?",["Tieger","spielen (sp_len)","Maschiene","wier"],1,"spielen; Tiger, Maschine, wir sind Ausnahmen."]]},
 {id:"d-wbild", t:"Wortbildung & Wortbedeutung", ex:`
<h4>Zusammensetzung (Kompositum)</h4><p>Zwei Wörter werden verbunden: <b>Haus + Tür = Haustür</b>. Das letzte Wort (<b>Grundwort</b>) bestimmt die Wortart und das Geschlecht, das erste (<b>Bestimmungswort</b>) erklärt es genauer.</p>
<h4>Ableitung</h4><p>Mit <b>Präfix</b> (Vorsilbe: <i>ver-, ent-, un-</i>) oder <b>Suffix</b> (Nachsilbe: <i>-ung, -heit, -keit, -lich, -bar</i>): <i>lesen → lesbar, frei → Freiheit, glücklich → unglücklich</i>.</p>
<h4>Wortfamilie & Wortfeld</h4><ul><li><b>Wortfamilie</b>: Wörter mit gleichem Wortstamm: fahren, Fahrer, Fahrrad, Abfahrt</li><li><b>Wortfeld</b>: Wörter mit ähnlicher Bedeutung: gehen, laufen, schlendern, rennen</li></ul>
<h4>Bedeutung</h4><p><b>Synonym</b> = gleiche Bedeutung (schnell – rasch) · <b>Antonym</b> = Gegenteil (hell – dunkel) · <b>Metapher</b> = bildlicher Ausdruck (Tischbein, Rabeneltern).</p>`,
 q:[["„Haustür“ – Welches ist das Grundwort?",["Haus","Tür","beide","keins"],1,"Das letzte Wort ist das Grundwort."],
 ["„Freiheit“ entsteht durch …",["Zusammensetzung","Ableitung mit Suffix","Abkürzung","Metapher"],1,"frei + -heit."],
 ["Was gehört zur Wortfamilie „fahren“?",["laufen","Fahrrad","Auto","Zug"],1,"Gleicher Wortstamm fahr-."],
 ["„gehen, rennen, schlendern“ bilden ein …",["Wortfamilie","Wortfeld","Kompositum","Suffix"],1,"Ähnliche Bedeutung → Wortfeld."],
 ["Gegenteil von „hell“ nennt man …","=antonym","Antonym: dunkel."],
 ["Welches Präfix macht „glücklich“ zum Gegenteil?","=un|un-","unglücklich."]]},
 {id:"d-schild", t:"Schildern & innerer Monolog", ex:`
<h4>Schildern</h4><p>Bei einer <b>Schilderung</b> beschreibst du einen Moment sehr lebendig, sodass der Leser ihn miterlebt. Es passiert wenig Handlung, aber viele <b>Sinneseindrücke</b>.</p>
<ul><li>Alle Sinne: sehen, hören, riechen, schmecken, fühlen</li><li>Gefühle und Gedanken</li><li>treffende Adjektive & Verben, <b>sprachliche Bilder</b> (Vergleich, Metapher, Personifikation)</li><li>meist <b>Präsens</b> – wirkt unmittelbar</li></ul>
<div class="ex">Die Wellen schlagen klatschend gegen die Steine. Salzige Luft brennt in meiner Nase, und der Sand ist warm wie eine Decke.</div>
<h4>Innerer Monolog</h4><p>Man schreibt die <b>Gedanken einer Figur</b> in der <b>Ich-Form</b> und im <b>Präsens</b>, als würde sie mit sich selbst sprechen – oft mit Fragen, Ausrufen und unvollständigen Sätzen.</p>
<div class="ex">Was mache ich jetzt bloß? Wenn Mama das erfährt … Nein. Ich muss es ihr sagen. Heute noch.</div>`,
 q:[["Was ist bei einer Schilderung besonders wichtig?",["viel Handlung","Sinneseindrücke und Gefühle","Zahlen und Fakten","wörtliche Rede"],1,"Der Leser soll den Moment miterleben."],
 ["In welcher Form schreibt man einen inneren Monolog?",["Er-Form, Präteritum","Ich-Form, Präsens","Wir-Form, Futur","Passiv"],1,"Gedanken der Figur, unmittelbar."],
 ["„Der Sand ist warm wie eine Decke.“",["Metapher","Vergleich","Personifikation","Alliteration"],1,"Mit „wie“ → Vergleich."],
 ["Welche Zeitform wirkt in Schilderungen besonders unmittelbar?",["Präsens","Plusquamperfekt","Futur II","Präteritum"],0,"Präsens holt den Leser ins Geschehen."],
 ["Was passt zu einem inneren Monolog?",["sachliche Daten","Fragen und Ausrufe in Gedanken","Tabellen","Inhaltsangabe"],1,"Man denkt mit der Figur."]]},
 {id:"d-film", t:"Kurzfilm & Medien untersuchen", ex:`
<h4>Kameraeinstellungen</h4><ul><li><b>Totale</b>: ganzer Ort, Überblick</li><li><b>Halbtotale</b>: Personen von Kopf bis Fuß</li><li><b>Halbnah/Amerikanisch</b>: bis Hüfte/Knie</li><li><b>Nah</b>: Kopf und Schultern – Gespräche</li><li><b>Groß/Detail</b>: Gesicht oder Gegenstand – Gefühle, wichtige Dinge</li></ul>
<h4>Perspektiven</h4><p><b>Vogelperspektive</b> (von oben → Figur wirkt klein/schwach) · <b>Froschperspektive</b> (von unten → wirkt groß/mächtig) · <b>Normalsicht</b> (Augenhöhe).</p>
<p>Weitere Mittel: Musik & Geräusche, Licht & Farben, Schnitt (schnell = spannend), Rückblende.</p>
<h4>Medien</h4><p>Bei Informationen aus dem Internet immer prüfen: <b>Wer</b> hat es geschrieben? <b>Wann</b>? Gibt es <b>Quellen</b>? Ist es Werbung oder Meinung? Mehrere Quellen vergleichen!</p>`,
 q:[["Eine Kamera filmt von unten nach oben. Die Figur wirkt …",["klein","mächtig","unsichtbar","lustig"],1,"Froschperspektive."],
 ["Welche Einstellung zeigt nur ein Gesicht oder einen Gegenstand?",["Totale","Halbtotale","Groß- bzw. Detailaufnahme","Halbnah"],2,"Groß/Detail zeigt Gefühle und Details."],
 ["Was zeigt eine Totale?",["ein Auge","den ganzen Ort im Überblick","nur Hände","ein Gespräch"],1,"Überblick."],
 ["Wie heißt die Perspektive von oben?",["Froschperspektive","Vogelperspektive","Normalsicht","Nahaufnahme"],1,"Vogelperspektive."],
 ["Was solltest du bei Internet-Infos prüfen?",["nur die Farbe","Wer, wann, Quellen","die Länge","die Schriftart"],1,"Glaubwürdigkeit prüfen!"]]},
 {id:"d-argu", t:"Argumentieren & Erörtern", ex:`
<p>Beim Argumentieren überzeugst du andere von deiner Meinung.</p>
<h4>Das 3B-Modell</h4><ul><li><b>Behauptung</b> (These): Handys sollten in der Pause erlaubt sein.</li>
<li><b>Begründung</b> (Argument): …, weil Schüler sich so mit Eltern absprechen können.</li>
<li><b>Beispiel / Beleg:</b> Wenn ein Bus ausfällt, kann man sofort Bescheid geben.</li></ul>
<h4>Aufbau einer Erörterung</h4><ul><li>Einleitung: Anlass, Thema, Frage</li><li>Hauptteil: Argumente <b>steigernd</b> anordnen (stärkstes zuletzt). <i>Linear</i> = eine Seite, <i>dialektisch</i> = Pro und Contra</li><li>Schluss: eigene Meinung, Fazit</li></ul>
<div class="tip">💡 Verknüpfungswörter: außerdem, darüber hinaus, deshalb, folglich, jedoch, einerseits – andererseits, am wichtigsten ist …</div>`,
 q:[["Wofür stehen die 3 B?",["Bild, Buch, Brief","Behauptung, Begründung, Beispiel","Beginn, Bericht, Bewertung","Bitte, Bedingung, Beweis"],1,"Behauptung – Begründung – Beispiel."],
 ["Wie ordnet man Argumente am besten?",["Stärkstes zuerst","Zufällig","Steigernd – stärkstes zuletzt","Alphabetisch"],2,"Das stärkste Argument bleibt am Ende im Gedächtnis."],
 ["Eine Erörterung mit Pro und Contra heißt …",["linear","dialektisch","chronologisch","kreativ"],1,"Dialektisch = beide Seiten abwägen."],
 ["Was gehört in den Schluss?",["neue Argumente","eigene Meinung / Fazit","die Einleitung","ein Gedicht"],1,"Im Schluss ziehst du ein Fazit."],
 ["„Hausaufgaben sollten abgeschafft werden.“ ist eine …",["These","Begründung","Beispiel","Einleitung"],0,"Eine Behauptung/These."]]}
]},
{ id:"en", name:"Englisch", icon:"🇬🇧", color:"#a66bff", topics:[
 {id:"e-pres", t:"Simple Present vs. Present Progressive", ex:`
<h4>Simple Present</h4><p>Gewohnheiten, Regeln, Fakten. Signalwörter: <b>always, often, usually, never, every day</b>.<br><i>She <b>plays</b> football every Saturday.</i> (he/she/it: <b>-s</b>!)</p>
<h4>Present Progressive: am/is/are + -ing</h4><p>Etwas passiert <b>gerade jetzt</b> oder vorübergehend. Signalwörter: <b>now, at the moment, look!, listen!</b><br><i>Look! She <b>is playing</b> football now.</i></p>
<h4>Verben der Sinne + Adjektiv</h4><p>Nach <b>look, sound, smell, taste, feel</b> steht ein <b>Adjektiv</b>, kein Adverb: <i>The cake <b>tastes good</b>. You <b>look happy</b>.</i></p>
<div class="tip">💡 Verben wie like, love, know, want stehen fast nie in der -ing-Form.</div>`,
 q:[["Look! The children ___ (play) in the park.","=are playing","„Look!“ → gerade jetzt."],
 ["My dad ___ (work) in London every day.","=works","Gewohnheit + he → -s."],
 ["I ___ (not/watch) TV at the moment.","=am not watching|'m not watching","at the moment → Progressive."],
 ["This soup smells ___.",["good","well","goodly","nicely"],0,"Verben der Sinne + Adjektiv."],
 ["Which sentence is correct?",["I am knowing the answer.","I know the answer.","I knowing the answer.","I knows the answer."],1,"know steht nicht in der -ing-Form."]]},
 {id:"e-pp", t:"Present Perfect vs. Simple Past", ex:`
<h4>Simple Past</h4><p>Abgeschlossene Handlung zu einem <b>bestimmten Zeitpunkt in der Vergangenheit</b>.<br>Signalwörter: <b>yesterday, last week, ago, in 2020, when</b><br><i>I visited London last year.</i></p>
<h4>Present Perfect: have/has + 3. Form</h4><p>Ergebnis ist <b>jetzt wichtig</b> oder Zeitpunkt egal / Handlung dauert an.<br>Signalwörter: <b>ever, never, already, yet, just, so far, since, for</b><br><i>I have never been to Paris. She has just finished.</i></p>
<div class="ex"><b>since</b> + Zeitpunkt (since 2020, since Monday)<br><b>for</b> + Zeitraum (for three years, for two hours)</div>`,
 q:[["I ___ (visit) London last year.","=visited","„last year“ → Simple Past."],
 ["She ___ (never/be) to Paris.","=has never been","„never“ → Present Perfect: has never been."],
 ["We ___ (just/finish) our homework.","=have just finished","„just“ → have just finished."],
 ["I have lived here ___ 2020.",["for","since","ago","yet"],1,"since + Zeitpunkt."],
 ["They have known each other ___ three years.",["since","for","ago","already"],1,"for + Zeitraum."],
 ["Have you ___ seen a whale?",["ever","yesterday","ago","last"],0,"ever = jemals → Present Perfect."],
 ["Two days ago, he ___ (lose) his phone.","=lost","„ago“ → Simple Past; lose – lost – lost."]]},
 {id:"e-prog", t:"Past Progressive", ex:`
<p>Bildung: <b>was/were + Verb-ing</b>.</p>
<p>Benutzung: Eine Handlung war <b>gerade im Gange</b>, als etwas anderes passierte (Simple Past).</p>
<div class="ex">I <b>was reading</b> when the phone <b>rang</b>.<br>While we <b>were playing</b> football, it started to rain.</div>
<ul><li><b>while</b> + Past Progressive (lange Handlung)</li><li><b>when</b> + Simple Past (kurze, neue Handlung)</li></ul>`,
 q:[["I ___ (read) when the phone rang.","=was reading","Laufende Handlung: was + -ing."],
 ["They ___ (play) football when it started to rain.","=were playing","they → were playing."],
 ["While she was cooking, the lights ___ (go) out.","=went","Kurze, neue Handlung → Simple Past."],
 ["What ___ you doing at 8 o’clock yesterday?",["was","were","did","are"],1,"you → were."],
 ["Welches Wort leitet meist die lange Handlung ein?",["when","while","ago","yet"],1,"while + Past Progressive."]]},
 {id:"e-fut", t:"Future: will & going to", ex:`
<ul><li><b>will</b> + Infinitiv: Vorhersagen, Vermutungen, spontane Entscheidungen, Versprechen<br><i>I think it will rain. – I’ll help you!</i></li>
<li><b>going to</b> + Infinitiv: Pläne & Absichten, sichere Anzeichen<br><i>I’m going to visit my aunt. Look at the clouds! It’s going to rain.</i></li>
<li><b>Present Progressive</b>: feste Verabredungen<br><i>I’m meeting Tom at 5.</i></li>
<li><b>Simple Present</b>: Fahrpläne<br><i>The train leaves at 7.</i></li></ul>`,
 q:[["Look at those black clouds! It ___ rain.",["will","is going to","rains","is raining"],1,"Sicheres Anzeichen → going to."],
 ["„The phone is ringing.“ – „I ___ answer it!“",["am going to","will","answer","am answering"],1,"Spontane Entscheidung → will."],
 ["I think Germany ___ win the match.",["will","is going to be","wins","win"],0,"Vermutung (I think) → will."],
 ["Next summer we ___ (travel) to Spain – we have already booked.","=are going to travel|are travelling|are traveling","Plan → going to (oder feste Abmachung: Present Progressive)."],
 ["The bus ___ at 7:15 every morning.",["will leave","leaves","is going to leave","is leaving"],1,"Fahrplan → Simple Present."]]},
 {id:"e-if", t:"If-Sätze (Typ 1 & 2)", ex:`
<h4>Typ 1 – realistisch</h4><div class="ex">If + <b>Simple Present</b>, … <b>will</b> + Infinitiv<br><i>If it rains, we will stay at home.</i></div>
<h4>Typ 2 – unwahrscheinlich / gedacht</h4><div class="ex">If + <b>Simple Past</b>, … <b>would</b> + Infinitiv<br><i>If I had more money, I would buy a bike.</i></div>
<div class="tip">💡 Kein „will“ und kein „would“ im If-Teil! Bei Typ 2 sagt man oft „If I were you …“. Steht der If-Satz vorne, setzt man ein Komma.</div>`,
 q:[["If it rains, we ___ (stay) at home.","=will stay|'ll stay","Typ 1: will + Infinitiv."],
 ["If I ___ (have) more money, I would buy a bike.","=had","Typ 2: Simple Past im If-Satz."],
 ["If you ___ (study), you will pass the test.","=study","Typ 1: Simple Present im If-Satz."],
 ["If I ___ you, I would apologize.",["am","was","were","will be"],2,"Feste Wendung: If I were you."],
 ["Which sentence is correct?",["If he will come, we play.","If he comes, we will play.","If he came, we will play.","If he comes, we would play."],1,"Typ 1: Present + will."]]},
 {id:"e-rel", t:"Relative Clauses", ex:`
<ul><li><b>who</b> → Personen: <i>The girl who lives next door is nice.</i></li>
<li><b>which</b> → Dinge/Tiere: <i>The book which I read was great.</i></li>
<li><b>that</b> → Personen und Dinge (in notwendigen Relativsätzen)</li>
<li><b>whose</b> → Besitz: <i>The boy whose bike was stolen …</i></li></ul>
<h4>Contact clauses</h4><p>Ist das Relativpronomen <b>Objekt</b>, kann man es weglassen: <i>The film (that) we saw was funny.</i> Ist es Subjekt, nicht: <i>The man who called …</i></p>`,
 q:[["The girl ___ lives next door is my friend.",["which","who","whose","where"],1,"Person → who."],
 ["The book ___ I bought is exciting.",["who","which","whose","what"],1,"Ding → which (oder that)."],
 ["That’s the boy ___ dog bit me.",["who","which","whose","that"],2,"Besitz → whose."],
 ["In welchem Satz kann man das Relativpronomen weglassen?",["The man who called was angry.","The cake that we baked was tasty.","The dog which barks is loud.","The girl who won is happy."],1,"„that“ ist hier Objekt (we baked the cake) → contact clause möglich."],
 ["Welches Pronomen passt für Personen UND Dinge?",["who","which","that","whose"],2,"that geht für beides."]]},
 {id:"e-pass", t:"Passive", ex:`
<p>Bildung: <b>form of „be“ + past participle (3. Form)</b>. Der Handelnde wird mit <b>by</b> angeschlossen (falls wichtig).</p>
<div class="ex">Simple Present: English <b>is spoken</b> all over the world.<br>Simple Past: The bridge <b>was built</b> in 1890.<br>Plural: Cars <b>are made</b> in this factory.</div>
<div class="tip">💡 Das Passiv benutzt man, wenn die Handlung wichtiger ist als die Person – typisch in Nachrichten und Sachtexten.</div>`,
 q:[["English ___ (speak) all over the world.","=is spoken","Simple Present Passive: is + spoken."],
 ["The bridge ___ (build) in 1890.","=was built","Simple Past Passive: was + built."],
 ["These cars ___ (make) in Germany.","=are made","Plural → are made."],
 ["„Romeo and Juliet“ was written ___ Shakespeare.",["from","of","by","with"],2,"Handelnder → by."],
 ["Which sentence is passive?",["Tom cleaned the room.","The room was cleaned.","Tom is cleaning.","Tom has cleaned."],1,"be + past participle."]]},
 {id:"e-modal", t:"Modals & Substitutes", ex:`
<table class="tb"><tr><th>Modal</th><th>Ersatzform</th><th>Bedeutung</th></tr>
<tr><td>can</td><td>be able to</td><td>können</td></tr><tr><td>must</td><td>have to</td><td>müssen</td></tr>
<tr><td>may / can</td><td>be allowed to</td><td>dürfen</td></tr><tr><td>mustn’t</td><td>–</td><td><b>nicht dürfen!</b></td></tr><tr><td>needn’t</td><td>don’t have to</td><td>nicht müssen</td></tr><tr><td>should</td><td>–</td><td>sollte</td></tr></table>
<p>Modals gibt es nur im Präsens. Für andere Zeiten braucht man die <b>Ersatzformen</b>:</p>
<div class="ex">Yesterday I <b>had to</b> help my mum. · Tomorrow I <b>will be able to</b> come. · We <b>were allowed to</b> stay up late.</div>
<div class="tip">⚠️ Falle: „You mustn’t“ = du darfst nicht! „You don’t have to“ = du musst nicht.</div>`,
 q:[["Yesterday I ___ (müssen) clean my room.","=had to","Vergangenheit von must → had to."],
 ["You ___ use your phone in the test! (darfst nicht)",["don’t have to","mustn’t","needn’t","can"],1,"mustn’t = nicht dürfen."],
 ["You ___ come – it’s optional. (musst nicht)",["mustn’t","don’t have to","can’t","shouldn’t"],1,"don’t have to = nicht müssen."],
 ["Next year I ___ (können) swim 1 km.","=will be able to","Zukunft von can → will be able to."],
 ["We ___ (dürfen) stay up late last night.","=were allowed to","Vergangenheit von may → were allowed to."]]},
 {id:"e-tags", t:"Question Tags & some/any", ex:`
<h4>Question tags („…, oder?“)</h4><p>Positiver Satz → negativer Tag, negativer Satz → positiver Tag. Man nimmt das Hilfsverb des Satzes (sonst do/does/did).</p>
<div class="ex">You’re from Berlin, <b>aren’t you</b>?<br>She can swim, <b>can’t she</b>?<br>He didn’t come, <b>did he</b>?<br>They live here, <b>don’t they</b>?</div>
<h4>some / any und Zusammensetzungen</h4><ul><li><b>some</b> (somebody, something, somewhere): in bejahten Sätzen und Angeboten/Bitten (Would you like some tea?)</li><li><b>any</b> (anybody, anything, anywhere): in Fragen und verneinten Sätzen</li><li><b>no</b> (nobody, nothing, nowhere) = kein</li></ul>`,
 q:[["You’re hungry, ___?","=aren't you|arent you","Positiver Satz mit „are“ → aren’t you?"],
 ["She didn’t call, ___?","=did she","Negativer Satz → positiver Tag."],
 ["Tom plays football, ___?","=doesn't he|doesnt he","Kein Hilfsverb → does → doesn’t he?"],
 ["Is there ___ milk left?",["some","any","no","something"],1,"Frage → any."],
 ["I can’t see ___.",["anything","something","nothing","some"],0,"Verneinung → anything."],
 ["Would you like ___ cake?",["any","some","no","anything"],1,"Angebot → some."]]},
 {id:"e-refl", t:"Reflexive & each other", ex:`
<table class="tb"><tr><th>Person</th><th>Reflexivpronomen</th></tr><tr><td>I</td><td>myself</td></tr><tr><td>you</td><td>yourself</td></tr><tr><td>he / she / it</td><td>himself / herself / itself</td></tr><tr><td>we</td><td>ourselves</td></tr><tr><td>you (Pl.)</td><td>yourselves</td></tr><tr><td>they</td><td>themselves</td></tr></table>
<p><i>She hurt <b>herself</b>. We enjoyed <b>ourselves</b>.</i></p>
<h4>each other = sich gegenseitig</h4><p><i>Tom and Sam help <b>each other</b>.</i> (Tom hilft Sam, Sam hilft Tom) – ≠ <i>They help <b>themselves</b></i> (jeder sich selbst).</p>
<div class="tip">💡 Viele deutsche „sich“-Verben sind im Englischen nicht reflexiv: sich freuen = to look forward to, sich treffen = to meet, sich erinnern = to remember.</div>`,
 q:[["He cut ___ with a knife.","=himself","he → himself."],
 ["We really enjoyed ___ at the party.","=ourselves","we → ourselves."],
 ["Mia and Lea call ___ every evening. (sich gegenseitig)",["themselves","each other","theirselves","herself"],1,"Gegenseitig → each other."],
 ["Did you make this cake ___? (du allein)","=yourself","you (Sg.) → yourself."],
 ["„Wir treffen uns um 5.“",["We meet ourselves at 5.","We meet at 5.","We meet us at 5.","We meet each other ourselves at 5."],1,"meet ist nicht reflexiv."]]},
 {id:"e-advcl", t:"Adverbial Clauses (because, so that, although …)", ex:`
<p>Adverbialsätze sagen <b>warum, wozu, wann</b> oder <b>trotz was</b> etwas passiert.</p>
<ul><li><b>Grund:</b> because, as – <i>I stayed at home <b>because</b> I was ill.</i></li><li><b>Zweck:</b> so that, to – <i>She studies hard <b>so that</b> she can pass.</i></li>
<li><b>Gegensatz:</b> although, even though – <i><b>Although</b> it was cold, we went swimming.</i></li><li><b>Zeit:</b> when, while, before, after, as soon as, until</li></ul>
<div class="tip">💡 Steht der Nebensatz vorne, setzt man ein Komma: <i>Although it rained, we played.</i> Im Englischen gibt es KEINE Verb-Endstellung wie im Deutschen!</div>`,
 q:[["I'm tired ___ I went to bed late.",["although","because","so that","until"],1,"Grund → because."],
 ["___ it was raining, we played football.",["Because","Although","So that","When"],1,"Gegensatz → although."],
 ["Speak louder ___ everybody can hear you.",["so that","because","although","while"],0,"Zweck → so that."],
 ["Wait here ___ I come back.",["until","because","although","so"],0,"Zeit → until (bis)."],
 ["Which sentence is correct?",["Because I hungry was, I ate.","Because I was hungry, I ate.","Because was I hungry, I ate.","I ate, because hungry I was."],1,"Englische Wortstellung bleibt S-V-O."]]},
 {id:"e-adv", t:"Adverbs & Comparison", ex:`
<h4>Adjektiv oder Adverb?</h4><p>Adjektiv beschreibt ein <b>Nomen</b>: <i>a careful driver</i>. Adverb beschreibt ein <b>Verb</b>: <i>He drives carefully.</i></p>
<ul><li>Bildung: Adjektiv + <b>-ly</b> (quick → quickly, happy → happily)</li><li>Ausnahmen: good → <b>well</b>, fast → fast, hard → hard</li></ul>
<h4>Steigerung</h4><ul><li>kurze Adjektive: tall – taller – the tallest</li><li>lange: interesting – more interesting – the most interesting</li>
<li>unregelmäßig: good – better – best · bad – worse – worst · many – more – most</li><li>Vergleich: <b>than</b> (größer als), <b>as … as</b> (genauso … wie)</li></ul>`,
 q:[["She sings very ___ (good).","=well","good → well (Adverb)."],
 ["He drives ___ (careful).","=carefully","Adverb: careful + ly."],
 ["This book is ___ (interesting) than that one.","=more interesting","Lange Adjektive: more …"],
 ["Steigerung von „bad“?",["badder – baddest","worse – worst","more bad – most bad","worse – baddest"],1,"bad – worse – worst."],
 ["Tom is as tall ___ his brother.",["than","as","like","then"],1,"as … as."],
 ["Mount Everest is the ___ (high) mountain in the world.","=highest","Superlativ: the highest."]]}
]},
{ id:"fr", name:"Französisch", icon:"🇫🇷", color:"#2ec4b6", topics:[
 {id:"f-salut", t:"Se présenter – sich vorstellen", ex:`
<ul><li><b>Bonjour !</b> Guten Tag! · <b>Salut !</b> Hallo/Tschüss · <b>Au revoir !</b> Auf Wiedersehen</li>

 ["„Ich bin zwölf Jahre alt.“",["Je suis douze ans.","J’ai douze ans.","J’habite douze ans.","Je m’appelle douze."],1,"Alter mit avoir: J’ai … ans."],
 ["Was heißt „J’habite à Berlin“?",["Ich heiße Berlin.","Ich wohne in Berlin.","Ich mag Berlin.","Ich fahre nach Berlin."],1,"habiter = wohnen."],

 {id:"f-art", t:"Artikel & Plural", ex:`
<table class="tb"><tr><th></th><th>männlich</th><th>weiblich</th><th>Plural</th></tr>
<tr><td>bestimmt</td><td><b>le</b> copain</td><td><b>la</b> copine</td><td><b>les</b> copains</td></tr>
<tr><td>unbestimmt</td><td><b>un</b> livre</td><td><b>une</b> maison</td><td><b>des</b> livres</td></tr></table>
<p>Vor Vokal oder stummem h: <b>l’</b> → l’ami, l’école, l’hôtel.</p>
<p>Plural meist mit <b>-s</b> (das man nicht hört): le chat → les chats.</p>
<h4>Zusammenziehung</h4><div class="ex">à + le = <b>au</b> (au cinéma) · à + les = <b>aux</b><br>de + le = <b>du</b> (le livre du prof) · de + les = <b>des</b></div>`,

 {id:"f-neg", t:"Verneinung & Fragen", ex:`
<h4>Verneinung: ne … pas</h4><div class="ex">Je <b>ne</b> joue <b>pas</b>. · Il <b>n’</b>aime <b>pas</b> le foot. (vor Vokal n’)</div>
<p>Auch: ne … <b>plus</b> (nicht mehr), ne … <b>jamais</b> (nie), ne … <b>rien</b> (nichts).</p>
<h4>Fragen stellen</h4><ul><li>Intonation: Tu viens ?</li><li><b>Est-ce que</b> tu viens ?</li></ul>
<p>Fragewörter: <b>où</b> (wo), <b>quand</b> (wann), <b>qui</b> (wer), <b>qu’est-ce que</b> (was), <b>comment</b> (wie), <b>pourquoi</b> (warum) – Antwort: <b>parce que</b> (weil), <b>combien</b> (wie viel).</p>`,
 q:[["Verneine: „Je joue au foot.“",["Je pas joue au foot.","Je ne joue pas au foot.","Je joue ne pas au foot.","Ne je joue pas au foot."],1,"ne vor dem Verb, pas danach."],
 ["„Il aime le chocolat“ verneint:",["Il ne aime pas le chocolat.","Il n’aime pas le chocolat.","Il n’aime le chocolat.","Il aime pas ne le chocolat."],1,"Vor Vokal: n’."],
 ["Was heißt „pourquoi“?",["wo","wann","warum","wie"],2,"pourquoi = warum, Antwort: parce que."],
 ["Was heißt „où“?",["oder","wo","wer","was"],1,"où (mit Akzent) = wo; ou = oder."],
 ["„ne … jamais“ bedeutet …",["nicht mehr","nie","nichts","noch nicht"],1,"jamais = nie."]]},

 {id:"f-adj", t:"Adjektive & Farben", ex:`
<p>Französische Adjektive richten sich nach dem Nomen (männlich/weiblich, Einzahl/Mehrzahl):</p>
<div class="ex">un chat <b>noir</b> · une chatte <b>noire</b> · des chats <b>noirs</b> · des chattes <b>noires</b></div>
<ul><li>weiblich meist <b>+e</b>: grand → grande, petit → petite</li><li>endet schon auf -e: bleibt gleich (rouge, jaune, sympa)</li><li>Besonderheiten: blanc → blanche, gentil → gentille, beau → belle, nouveau → nouvelle, vieux → vieille</li></ul>
<p><b>Stellung:</b> meist <b>nach</b> dem Nomen (un pull rouge). Kurze, häufige stehen <b>vor</b> dem Nomen: grand, petit, beau, joli, bon, nouveau, vieux, jeune.</p>
<p>Farben: rouge, bleu, vert, jaune, noir, blanc, gris, orange*, marron* (*unveränderlich)</p>`,

 ["des pulls ___ (bleu)","=bleus","Männlich Plural → +s."],
 ["une robe ___ (blanc)","=blanche","blanc → blanche."],

 {id:"f-qte", t:"faire du, Mengen & ne … plus", ex:`
<h4>faire de + Artikel (Hobbys)</h4><p>de + le = <b>du</b>, de + la = <b>de la</b>, de + l' = <b>de l'</b>, de + les = <b>des</b><br><i>Je fais <b>du</b> vélo. Elle fait <b>de la</b> danse. Il fait <b>de l'</b>escalade.</i> (aber: jouer <b>au</b> foot)</p>
<h4>Mengenangaben + de</h4><p>Nach Mengen steht nur <b>de / d'</b> (ohne Artikel!): <b>beaucoup de</b> pommes, <b>assez de</b> pain, <b>trop de</b> sucre, <b>un kilo de</b> tomates, <b>une bouteille d'</b>eau.</p>
<h4>Verneinung mit Mengen</h4><p>Nach <b>ne … pas</b> und <b>ne … plus</b> wird un/une/des zu <b>de</b>: <i>J'ai un chien. → Je n'ai <b>pas de</b> chien. Il n'y a <b>plus de</b> lait.</i></p>
<div class="tip">💡 ne … plus = nicht mehr · ne … pas = nicht</div>`,
 q:[["Je fais ___ vélo.",["de la","du","des","le"],1,"de + le vélo → du."],
 ["Elle fait ___ danse.",["du","de la","des","à la"],1,"la danse → de la."],
 ["Il y a beaucoup ___ pommes.",["des","de","les","du"],1,"Nach Mengen nur de."],
 ["Verneine: „J'ai un frère.“",["Je n'ai pas un frère.","Je n'ai pas de frère.","Je n'ai pas des frères.","Je ai pas de frère."],1,"un → de nach Verneinung."],
 ["„Es gibt keine Milch mehr.“",["Il n'y a plus de lait.","Il n'y a pas du lait.","Il y a plus lait.","Il n'y a plus du lait."],0,"ne … plus de."]]},
 {id:"f-cod", t:"Objektpronomen: le, la, les", ex:`
<p>Um ein Nomen nicht zu wiederholen, ersetzt man das <b>direkte Objekt</b> durch ein Pronomen. Es steht <b>vor dem Verb</b>!</p>
<table class="tb"><tr><th>Person</th><th>Pronomen</th></tr><tr><td>mich / dich</td><td>me / te</td></tr><tr><td>ihn / es (m)</td><td>le (l')</td></tr><tr><td>sie / es (f)</td><td>la (l')</td></tr><tr><td>uns / euch</td><td>nous / vous</td></tr><tr><td>sie (Pl.)</td><td>les</td></tr></table>
<div class="ex">Tu regardes le film ? – Oui, je <b>le</b> regarde.<br>Tu aimes la musique ? – Oui, je <b>l'</b>aime.<br>Tu invites tes amis ? – Non, je ne <b>les</b> invite pas.</div>
<div class="tip">💡 Bei der Verneinung umschließt ne … pas das Pronomen + Verb: je ne <b>la</b> vois pas.</div>`,

 ["Tu prends la pomme ? – Oui, je ___ prends.",["le","la","les","l'"],1,"la pomme (f) → la."],
 ["Tu invites tes copains ? – Oui, je ___ invite.",["le","la","les","leur"],2,"Plural → les."],
 ["Wo steht das Objektpronomen?",["nach dem Verb","vor dem Verb","am Satzende","am Satzanfang"],1,"Je le regarde."],
 ["Tu aimes l'école ? – Non, je ne ___ aime pas.",["la","l'","le","les"],1,"Vor Vokal → l'."]]},

 {id:"g-zonen", t:"Klima- & Vegetationszonen", ex:`
<p>Weil die Sonnenstrahlen am Äquator <b>steil</b> und an den Polen <b>flach</b> auftreffen, ist es am Äquator warm und an den Polen kalt. So entstehen <b>Klimazonen</b>:</p>
<ul><li><b>Polare Zone</b> → Eiswüste, Tundra</li><li><b>Subpolare/kalt-gemäßigte Zone</b> → Tundra, Taiga (borealer Nadelwald)</li>

<li><b>Subtropen</b> → Hartlaubvegetation (Mittelmeer), Wüsten</li>
<li><b>Tropen</b> → Savanne, tropischer Regenwald</li></ul>
<div class="tip">💡 Klimazone = Temperatur & Niederschlag · Vegetationszone = die natürliche Pflanzenwelt, die dazu passt.</div>`,
